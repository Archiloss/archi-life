<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>建院模拟器 v0.1</title>
<style>
html{ zoom:1.25; }
  :root{
    --bg:#1a1a1a; --panel:#202020; --chrome:#2e2e2e; --line:#3a3a3a; --grid:#242424;
    --ink:#dcdcdc; --white:#fff; --dim:#8a8a8a; --dim2:#5f5f5f;
    --cyan:#35d6e8; --yellow:#ffd93d; --red:#ff5f5f; --green:#4ade80; --magenta:#e879f9; --orange:#ffb020;
    /* 结构线 / 强调色 / 次级墨：三处被引用但一直没定义（分隔线整条不渲染），这里补齐（2026-09-12） */
    --line-c:#4a4a4a; --accent:#35d6e8; --ink2:#b0b0b0;
        /* 结构色（换肤时整组替换） */
    --body-bg:#0f0f0f; --hud-bg:#141414; --box-bg:#232323;
    --edge:#3d3d3d; --edge2:#4a4a4a; --sunken:#1f1f1f; --head-bg:#1c1c1c;
    /* 换肤敏感 token：以前是硬编码深色，浅皮会贴成黑板；统一走变量，浅皮整组覆盖 */
    --seat-bg:#1e1e1e; --seat-ink:#4a4a4a; --seat-hov:#22302f;
    --opt-hov:#26302f;
    --opt-chosen-bg:#243032; --opt-chosen-ink:#fff;
    --cell-done-bg:#242424; --cell-done-ink:#676767; --cell-here-bg:#243032;
    --grp-line:#242424;
    --chip-up-bg:#182620; --chip-dn-bg:#261818;
    --k-line:#5a5a5a;
    --mono:var(--font-ui);      /* 旧名保留：全库引用 --mono 的老规则自动跟着走，只有一个真源 */

    /* ============================================================
       字体收口（2026-09-13 · 清单第 34 项）
       为什么要有这两个变量：
         以前各屏的文字全靠 body 的 --mono 往下继承，谁漏了声明（尤其是
         button / input 这类**不继承字体**的表单控件）就掉回浏览器默认字体，
         同一屏里就出现「两种字」。现在：全库只认 --font-ui 一个源，
         结局页所有节点**显式**声明，不再赌继承。
         --font-serif：结局要衬线时才用（设计/落地-结尾页字体-20260913.md 选项 B）；
                     默认不用，但**必须在这里声明**——将来启用时一处改全屏。
       ============================================================ */
    --font-ui:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC",monospace;
    --font-serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--body-bg);color:var(--ink);font-family:var(--font-ui);
       font-size:13px;-webkit-font-smoothing:antialiased;padding:14px;
       cursor:var(--cursor, crosshair);display:flex;}
  /* 表单控件**不继承**字体（浏览器默认给一套 system-ui）：全库统一声明，
     这样任何 `button`/`input` 只要没显式写字体，也一定跟着 --font-ui，
     不会在某个屏上突然变一套字。显式声明过的规则（.opt/.place/button.act…）优先级更高，不受影响。 */
  button,input,select,textarea{font-family:var(--font-ui);}

  /* ---- 十字光标（跟随鼠标，CAD 的命根子动作）---- */
  .crosshair{position:fixed;inset:0;pointer-events:none;z-index:999;display:none;}
  .crosshair.on{display:block;}
  .crosshair .h,.crosshair .v{position:absolute;background:rgba(150,150,150,.5);}
  .crosshair .h{left:0;right:0;height:1px;}
  .crosshair .v{top:0;bottom:0;width:1px;}
  .crosshair .pick{
    position:absolute;width:11px;height:11px;
    border:1px solid rgba(180,180,180,.85);
    transform:translate(-50%,-50%);
  }
  .app{max-width:min(1080px, calc(100vw / 1.25));margin:0 auto;background:var(--bg);border:1px solid #000;
       box-shadow:0 10px 40px rgba(0,0,0,.7);display:flex;flex-direction:column;
       flex:1;min-height:0;}

  .titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px;
            padding:0 12px;height:28px;background:var(--chrome);
            border-bottom:1px solid var(--line);font-size:11.5px;}
  .titlebar .fn{color:var(--dim);}
  .titlebar .w{display:flex;gap:14px;color:var(--dim2);font-size:11px;}

  .menubar{display:flex;gap:0;background:var(--chrome);border-bottom:1px solid var(--line);
           height:26px;align-items:center;padding:0 4px;font-size:11.5px;overflow:hidden;}
  .menubar b{font-weight:400;padding:4px 9px;color:var(--ink);white-space:nowrap;}

  .hud{display:flex;align-items:center;gap:0;background:var(--hud-bg);
       border-bottom:1px solid var(--line);height:34px;overflow:hidden;}
  .hud .st{display:flex;align-items:center;gap:7px;padding:0 15px;height:100%;
           border-right:1px solid var(--line);font-size:11.5px;color:var(--dim);white-space:nowrap;}
  .hud .st b{color:var(--white);font-weight:400;font-variant-numeric:tabular-nums;}
  .hud .st.sp{flex:1;justify-content:flex-end;border-right:0;color:var(--dim2);}


  /* ---- CAD 经典坐标轴（UCS 图标）---- */
  .ucs{position:absolute;left:16px;bottom:16px;pointer-events:none;z-index:5;
       font-size:9px;line-height:1;opacity:.85;}
  .ucs .ax{position:relative;width:34px;height:34px;}
  .ucs .ax i{position:absolute;background:var(--dim);}
  .ucs .ax i.x{left:0;bottom:3px;width:30px;height:1px;}
  .ucs .ax i.y{left:3px;bottom:0;width:1px;height:30px;}
  .ucs .ax i.xh{left:28px;bottom:1px;width:0;height:0;background:none;
    border-left:4px solid var(--dim);border-top:3px solid transparent;border-bottom:3px solid transparent;}
  .ucs .ax i.yh{left:1px;bottom:28px;width:0;height:0;background:none;
    border-bottom:4px solid var(--dim);border-left:3px solid transparent;border-right:3px solid transparent;}
  .ucs .ax em{position:absolute;font-style:normal;font-size:8.5px;color:var(--dim);}
  .ucs .ax em.ex{left:31px;bottom:-2px;}
  .ucs .ax em.ey{left:-1px;bottom:31px;}
  /* 左下角 UCS 图标是 AutoCAD 的规矩：别的软件不长这样
     · SketchUp 的绘图轴在模型原点交汇，不在屏幕角上
     · Rhino 另有自己的世界坐标轴图标（.raxe）
     · 手绘根本没有软件界面 */
  body.skin-su .ucs,
  body.skin-rhino .ucs,
  body.skin-sketch .ucs{display:none;}

  /* ---- 工作区 + 右侧面板 ---- */
  .main{display:grid;grid-template-columns:1fr 208px;flex:1;min-height:0;}
  .work{display:flex;flex-direction:column;min-width:0;min-height:0;}

  .side{background:var(--chrome);border-left:1px solid var(--line);overflow-y:auto;}
  .side h3{margin:0;padding:7px 10px;font-size:10px;font-weight:400;
           color:var(--dim2);letter-spacing:1.5px;background:var(--head-bg);
           border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .side h3:first-child{border-top:0;}
  .side .grp{padding:8px 10px;border-bottom:1px solid var(--grp-line);}
  .side .row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px;}
  .side .row .sw{width:9px;height:9px;flex:0 0 9px;border:1px solid rgba(0,0,0,.6);}
  .side .row .k{color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side .row .n{color:var(--ink);font-variant-numeric:tabular-nums;}
  .side .row .n.on{color:var(--white);}
  .side .row .n.off{color:var(--edge2);text-decoration:line-through;}
  .side .row .n b{color:var(--white);font-weight:400;}
  /* 特性行是飘字的挂点容器：行内文本 1 行 + 下方 30px 飘字带（padding-bottom），
     飘字 absolute 在容器内 top=100%+24px 起步（即 padding-bottom 带里），上浮 ≤16px
     仍在容器内——不出容器、不压行内文字；行高从 50px(现状) 增到 76px */
  .side .float-host{ position:relative; min-height:40px; padding-bottom:30px; align-items:center; }
  .hud .st.float-host{ min-height:64px; padding-bottom:26px; align-items:flex-start; position:relative; }
  /* 窄屏移动端块（840-865 行）会再压 .hud .st 的 min-height —— 飘字带必须保住 */
  html .hud .st.float-host{ min-height:64px !important; padding-bottom:26px !important; }
  /* 顶部横条 .st 容器窄（375 屏一格只有 ~57px 宽），±14px 横向错开会横着出容器——
     顶条这里改纵向落：第 i 枚出现的往下多让 22px（min-height 64px 已按 2 枚 + 余量给足） */
  .hud .st.float-host .float{ top:calc(24px + var(--float-y,0px)); }
  /* 与之配套：.float top 改用固定 24px（从 host padding-box 顶起算），
     不再用 calc(100%+24) —— 100% 在 flex 容器里解析不稳，出过「飘字坠出容器」；
     host padding-bottom 30px 就是给飘字留的白带，飘不上来也不会压字 */
  .side .float-host .float, .hud .float-host .float{ top:24px; }

  /* 图幅：一局的进度，一格一站（6 列） */
  .side .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px 10px;}
  .side .cell{aspect-ratio:1;border:1px solid var(--edge);background:var(--sunken);
              display:grid;place-items:center;font-size:8.5px;color:var(--dim2);
              font-variant-numeric:tabular-nums;}
  .side .cell.done{background:var(--cell-done-bg);color:var(--cell-done-ink);}
  .side .cell.here{border-color:var(--cyan);background:var(--cell-here-bg);color:var(--cyan);font-weight:700;}
  .side .cell.fork{border-color:var(--yellow);color:var(--yellow);}
  .side .cell.end{border-color:var(--magenta);color:var(--magenta);}

  /* ---- 底部状态栏（含实时坐标）---- */
  .status{display:flex;align-items:center;background:var(--chrome);
          border-top:1px solid var(--line);height:22px;font-size:10px;
          color:var(--dim2);overflow:hidden;}
  .status span{padding:0 11px;height:100%;display:flex;align-items:center;
               border-right:1px solid var(--line);white-space:nowrap;}
  .status span.act{color:var(--white);background:var(--line);}
  .status span.co{margin-left:auto;border-right:0;border-left:1px solid var(--line);
                  color:var(--dim);font-variant-numeric:tabular-nums;}

  .track{padding:16px 18px;background-color:var(--bg);
         background-image:linear-gradient(var(--grid) 1px,transparent 1px),
           linear-gradient(90deg,var(--grid) 1px,transparent 1px);
         background-size:22px 22px;border-bottom:1px solid var(--line);
         overflow-x:auto;}
  .nodes{display:flex;align-items:flex-start;gap:0;min-width:min-content;}
  .nd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 3px;}
  .nd .bx{width:34px;height:26px;border:1px solid var(--edge);background:var(--sunken);
          display:grid;place-items:center;font-size:9.5px;color:var(--dim2);}
  .nd .nm{font-size:9.5px;color:var(--dim2);white-space:nowrap;max-width:56px;
          overflow:hidden;text-overflow:ellipsis;text-align:center;}
  .nd.done .bx{background:var(--sunken);color:#6a6a6a;}
  .nd.here .bx{border-color:var(--cyan);background:var(--cell-here-bg);color:var(--cyan);font-weight:700;}
  .nd.here .nm{color:var(--cyan);}
  .nd.fork .bx{border-color:var(--yellow);color:var(--yellow);}
  .nd.end .bx{border-color:var(--magenta);color:var(--magenta);}
  .sep{padding:0 2px;color:var(--edge);align-self:center;margin-top:6px;font-size:10px;}

  /* 画布：绘图区 + 皮肤装饰层（装饰只盖绘图区，不盖命令行） */
  .canvas{position:relative;flex:1;min-height:0;display:flex;}
  .deco{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden;}
  .stage{padding:20px 18px;min-height:210px;display:flex;flex-direction:column;gap:14px;
         flex:1;min-height:0;overflow-y:auto;position:relative;
         background-color:var(--bg);
         background-image:linear-gradient(var(--grid) 1px,transparent 1px),
           linear-gradient(90deg,var(--grid) 1px,transparent 1px);
         background-size:22px 22px;}
  .stage .ttl{font-size:12px;color:var(--dim);letter-spacing:2px;}
  .stage .txt{font-size:15px;line-height:1.85;color:var(--white);white-space:pre-wrap;}
  .stage .txt .hot{color:var(--yellow);}
  .stage .txt .bk{color:var(--dim);}

  /* ---- 场景图：每一站该有它的样子 ---- */

  /* ---- 座位平面图：在图上挑位置，不是在选项里挑 ---- */
  .seatwrap{margin:2px 0 10px;border:1px solid #2e2e2e;background:var(--hud-bg);padding:12px;}
  .seatwrap .board{font-size:10px;color:var(--dim2);letter-spacing:4px;text-align:center;
                   padding-bottom:8px;margin-bottom:10px;border-bottom:1px dashed #333;}
  .seatmap{display:grid;gap:6px;}
  .seat{aspect-ratio:2.3/1;border:1px solid var(--edge);background:var(--seat-bg);cursor:pointer;
        border-radius:1px;transition:border-color .1s,background .1s;position:relative;
        font-family:var(--mono);font-size:9px;color:var(--seat-ink);padding:0;}
  .seat:hover{border-color:var(--cyan);background:var(--seat-hov);color:var(--cyan);}
  .seat.void{border:none;background:transparent;cursor:default;}
  .seat .tagn{position:absolute;left:3px;top:2px;font-size:8px;color:#3f3f3f;}
  .seat:hover .tagn{color:var(--cyan);}

  /* ---- 推体块 ---- */
  .massbar{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0;align-items:center;}
  .massbar button{font-family:var(--mono);font-size:12.5px;padding:9px 14px;min-height:40px;
    background:var(--box-bg);color:var(--ink);border:1px solid var(--edge);border-radius:2px;cursor:pointer;}
  .massbar button:hover{border-color:var(--cyan);color:var(--cyan);}
  .massbar button:disabled{opacity:.3;cursor:not-allowed;border-color:#333;color:var(--dim2);}
  .massbar button.done{background:var(--cyan);color:var(--body-bg);border-color:var(--cyan);font-weight:700;}
  .massleft{font-size:11.5px;color:var(--dim);margin-top:9px;letter-spacing:.3px;}
  .massleft b{color:var(--yellow);font-weight:400;}
  .stage .picked{font-size:15px;color:var(--dim);line-height:1.9;
    opacity:0;animation:lnIn .34s ease-out forwards;animation-delay:.3s;}
  .stage .res{font-size:16px;color:var(--white);line-height:1.95;}
  /* ---- 行业背景插播：一整屏的轻薄屏（标题 + 正文 + 一个「继续」）----
     正文最长 7 行；1366×768 / 1280×720 这种笔记本窗口也要一屏放得下，
     不许出现滚动条（.stage 是 overflow-y:auto，多 1px 就长出一条）。
     2026-09-13：窗口高 629 时内容 250 / 可用 249 → 正好多 1px（长条溢出）。
     把上下内缩从 -5px 收到 -7px（共省 4px），这一类临界高度不再出条。 */
  .stage .interwrap{display:flex;flex-direction:column;gap:10px;margin:-7px 0;}
  .stage .interwrap .res{font-size:15px;line-height:1.8;}
  .stage .interwrap .big{padding:0;}
  /* 长文本（三篇）用同一套 interwrap：空行是分段，别被折叠掉高度 */
  .stage .interwrap .res span.ln:empty{min-height:.9em;}
  /* 「那年 · 行业」固定条的专属角标：一枚小牌，不是标题（11px 等宽、字距拉开、贴左上） */
  .stage .interwrap .intertag{align-self:flex-start;font-size:11px;line-height:1.7;
    letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);border-radius:2px;
    padding:0 6px 0 8px;opacity:.85;}
  .deltas{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px;}
  .chip{font-size:13.5px;padding:6px 12px;border:1px solid var(--line);
        border-radius:2px;font-variant-numeric:tabular-nums;letter-spacing:.3px;
        color:var(--dim);}
  .chip.up{color:var(--green);border-color:#2f5a48;background:var(--chip-up-bg);}
  .chip.dn{color:var(--red);border-color:#5a2f2f;background:var(--chip-dn-bg);}
  .chip.zero{color:var(--dim2);}
  @keyframes hudPulse{0%{color:var(--cyan);}100%{color:var(--white);}}
  .hud .st b.pulse{animation:hudPulse 1s ease-out;}
  .fill{display:flex;gap:10px;align-items:center;margin-top:2px;flex-wrap:wrap;}
  .fill input{
    flex:1;min-width:180px;
    background:var(--box-bg);border:1px solid var(--edge);border-radius:2px;
    color:var(--white);font-family:var(--mono);font-size:16px;
    padding:12px 14px;min-height:48px;
  }
  .fill input:focus{outline:none;border-color:var(--cyan);}
  .fill input::placeholder{color:#5f5f5f;}
  .warn{font-size:12px;color:var(--yellow);min-height:17px;margin-top:5px;}

  .opts{display:flex;flex-direction:column;gap:7px;margin-top:2px;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;min-height:44px;
       background:var(--box-bg);border:1px solid var(--edge);border-radius:2px;
       cursor:pointer;text-align:left;font-family:var(--mono);font-size:13px;
       color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover{border-color:var(--cyan);background:var(--opt-hov);}
  .opt .k{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;
          border:1px solid var(--k-line);font-size:10.5px;color:var(--dim);margin-top:1px;}
  .opt:hover .k{border-color:var(--cyan);color:var(--cyan);}
  /* 够不着的选项：看得见，点不了 */
  .opt.locked{opacity:.34;cursor:not-allowed;border-style:dashed;}
  .opt.locked:hover{border-color:var(--edge);background:var(--box-bg);}
  .opt.locked:hover .k{border-color:var(--k-line);color:var(--dim);}
  .opt.locked .cf{color:var(--yellow);}
  .opt.unlocked{border-color:var(--cyan);}
  /* 选择的那一刻：被选中的留下，其余退场 */
  .opt.chosen{border-color:var(--cyan);background:var(--opt-chosen-bg);color:var(--opt-chosen-ink);
              box-shadow:0 0 0 1px var(--cyan);}
  .opt.chosen .k{border-color:var(--cyan);color:var(--cyan);}
  .opt.faded{opacity:.15;transition:opacity .28s;}
  .opt{transition:border-color .12s,background .12s,opacity .28s,box-shadow .15s;}

  /* 结果逐行浮现，不是一坨字甩脸上 */
  /* 结果晚一步浮现——这个"停顿"以前是靠 setTimeout，现在纯 CSS，不会丢 */
  .stage .res span.ln{display:block;opacity:0;transform:translateY(4px);
    animation:lnIn .38s ease-out forwards;animation-delay:.42s;}
  .stage .res span.ln:nth-child(2){animation-delay:.55s;}
  .stage .res span.ln:nth-child(3){animation-delay:.68s;}
  .stage .res span.ln:nth-child(4){animation-delay:.81s;}
  @keyframes lnIn{to{opacity:1;transform:none;}}
  .deltas span.chip{opacity:0;animation:lnIn .3s ease-out forwards;animation-delay:.5s;}
  .deltas span.chip:nth-child(2){animation-delay:.62s;}
  .deltas span.chip:nth-child(3){animation-delay:.74s;}

  /* 数值飘字：挂进 HUD 数值自己的容器 .float-host 内绝对定位（2026-09-14 重写）。
     为什么不再用 position:fixed + 全局坐标：坐标要手动除以 html 的 zoom=1.25，
     夹边界时 window.innerWidth/z（带缩放）和 f.offsetWidth（不带）两套单位混算
     → 夹边界等于没生效 → 出界 + 压在特性栏文字上；同屏多枚还落在同一个 x 叠成一坨。
     现在飘字只是在 .float-host（= HUD 数值那格自己的 span，position:relative）里
     absolute 摆放：坐标只在容器内算，与 zoom 无关（zoom 同倍数放大容器和飘字，
     比例不变）；.float-host 自带 max-width:100%，容器外就是别的 HUD 格——
     物理上不可能越界，不可能压到别的文字。同屏多枚由 JS 按序内联 --float-y/--float-x 错层：
      纵向每枚让 22px，横向 ±14px 左右交替，多枚不再叠在同一个坐标。 */
  .float-host{ position:relative; display:inline-block; max-width:100%; }
  .float{ position:absolute; left:calc(50% + var(--float-x,0px)); top:24px;
    transform:translateX(-50%);
    pointer-events:none;z-index:1000;font-family:var(--mono);
    font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap;
    background:var(--hud-bg); border:1px solid var(--line); border-radius:3px;
    padding:3px 10px; box-shadow:0 2px 10px rgba(0,0,0,.55);
    max-width:100%;
    animation:floatUp 2.4s ease-out forwards; }
  .float .fl-k,.float .fl-v{white-space:nowrap;}
  .float .fl-v{margin-left:8px;}      /* 兜底：万一 gap 不生效，也不许贴在一起 */
  @keyframes floatUp{                 /* 上浮 ≤16px；全程不会把飘字带回 HUD 条内 */
    0%{opacity:0;transform:translate(-50%, 0) scale(.9);}
    8%{opacity:1;transform:translate(-50%, -4px) scale(1.04);}
    75%{opacity:1;transform:translate(-50%, -12px) scale(1);}
    100%{opacity:0;transform:translate(-50%, -16px) scale(1);}
  }
  /* 全宽度统一「数值下方」落点：容器内起步 +24px（HUD 数值下沿外的浮动缝），
     上浮最多 16px，仍在容器下方空白带里，不带回条内、不压行内文字 */
  @media (min-width:820px){
    .float{ top:calc(100% + 24px + var(--float-y,0px)); }
  }
  .opt .t{flex:1;line-height:1.5;}
  .opt .cf{font-size:11px;color:var(--dim2);white-space:nowrap;margin-top:2px;}
  /* 暗牌选项（开场追问）：选之前不报数值，占位与 --dim 一族 */
  .opt .cf.hid{color:var(--dim);letter-spacing:1px;}

  /* 「不报建筑」一周目锁定态（样张：design/mock-不报建筑锁定.html）
     置灰 + not-allowed；点它只弹一句提示，不进结局。判据＝图鉴里还没有已看结局。 */
  .opt.lock{opacity:.55;border-color:#333;background:#232323;cursor:not-allowed;color:var(--dim2);}
  .opt.lock:hover{border-color:#333;background:#232323;}
  .opt.lock .k,.opt.lock:hover .k{border-color:#4a4a4a;color:#4a4a4a;}
  .opt .lk{font-size:11px;color:#4a4a4a;margin-left:auto;letter-spacing:.1em;
           white-space:nowrap;align-self:center;}

  /* 「就 填 这 个」补的字母 A：与旁边那行 B 对齐（只动显示，不动行为） */
  .fill button.act{display:flex;align-items:center;gap:9px;}
  button.act .k{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;
                border:1px solid rgba(0,0,0,.38);font-size:10.5px;color:inherit;font-weight:700;}

  /* 暗牌揭晓浮层（同一个 .gtoast 形态）：涨绿、扣红、竖线灰。
     2026-09-13 用户：「特性变更弹窗 文字全挤在一起了」——几段（作品/设计/头发）
     挤成一团。带数值的那一种挂 .gtoast-vals：横向 flex + 8px gap + 允许换行，
     窄屏不重叠；分隔的 ｜ 两侧各留 6px（原来 7px，保留）。 */
  .gtoast-vals{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;line-height:1.6;}
  .gtoast .tup{color:var(--green);}
  .gtoast .tdn{color:var(--red);}
  .gtoast .tsep{color:var(--dim2);margin:0 6px;}
  .gtoast-vals .tup,.gtoast-vals .tdn{margin-right:8px;}   /* 兜底：gap 之外再保 8px */

  .big{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0;}
  .big .num{font-size:44px;color:var(--white);font-variant-numeric:tabular-nums;line-height:1;}
  .big .lbl{font-size:11px;color:var(--dim);letter-spacing:2px;}

  button.act{font-family:var(--mono);font-size:14px;letter-spacing:1px;padding:13px 34px;
             min-height:48px;background:var(--cyan);color:var(--body-bg);border:1px solid var(--cyan);
             border-radius:3px;cursor:pointer;font-weight:700;transition:filter .12s;}
  button.act:hover{filter:brightness(1.1);}
  button.act:disabled{background:#2e2e2e;border-color:var(--edge);color:var(--dim2);cursor:not-allowed;}

  .alloc{display:flex;flex-direction:column;gap:9px;}
  .arow{display:flex;align-items:center;gap:12px;}
  .arow .an{width:76px;font-size:12.5px;color:var(--ink);}
  .arow .ab{width:30px;height:30px;display:grid;place-items:center;background:#2a2a2a;
            border:1px solid var(--edge2);border-radius:2px;cursor:pointer;color:var(--ink);}
  .arow .ab:hover{border-color:var(--cyan);color:var(--cyan);}
  .arow .av{width:26px;text-align:center;font-size:14px;color:var(--white);font-variant-numeric:tabular-nums;}
  .arow .left{font-size:11px;color:var(--dim2);}

  .cmd{background:var(--hud-bg);border-top:1px solid var(--line);padding:9px 13px;
       font-size:11.5px;line-height:1.8;max-height:118px;overflow-y:auto;}
  .cmd .l{color:#8f8f8f;}
  .cmd .l .p{color:var(--dim2);}
  .cmd .l .up{color:var(--green);}
  .cmd .l .dn{color:var(--red);}
  .cmd .l .hl{color:var(--cyan);}
  .cmd .prompt{color:#cfcfcf;margin-top:5px;padding-top:5px;border-top:1px dashed #2e2e2e;}
  .cmd .prompt .p{color:var(--dim2);}
  .cmd .prompt .opts{color:var(--yellow);}
  /* 光标现在名副其实：敲 A/B/C/D 会先在前面回显，再执行 */
  .cmd .prompt .typed{color:var(--white);font-weight:700;}
  .cmd .prompt .cur{display:inline-block;width:7px;height:12px;background:var(--white);
                    vertical-align:-2px;animation:blink 1.05s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .ending{padding:26px 22px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:4;}
  /* 结局页字体收口（2026-09-13 · 清单第 34 项）：
     这一屏的文字节点**全部显式**跟 --font-ui，不再靠 body 继承 —— 以前谁漏声明就掉回
     浏览器默认字体（表单控件还会默认一套 system-ui），同一屏两种字。现在整屏一个源。 */
  .ending,.ending *{font-family:var(--font-ui);}
  /* 结局面板底部的「再来一局」常驻：窗口不高时（900/800 高）以前要滚到最底才看得见 */
  .ending .endbar{position:sticky;bottom:-26px;margin:6px 0 -26px;padding:10px 0 8px;
                  background:var(--bg);border-top:1px solid var(--line-c);}
  .ending .lab{font-size:11px;line-height:1.9;color:var(--dim);letter-spacing:3px;}
  .ending .big-t{font-size:24px;color:var(--ink);line-height:1.5;}
  .ending .body{font-size:13.5px;line-height:1.9;color:var(--ink);white-space:pre-wrap;}
  .ending .body .hot{color:var(--yellow);}
  .ending .body .dim{color:var(--dim);}

  /* 窄屏：收掉右侧面板，数值回到顶部横条 */
  @media (max-width:819px){
    .main{grid-template-columns:1fr;}
    .side{display:none;}
    /* 窄屏收短由主 .float 规则 + 840-859 的移动端块统一管（本块不再覆盖 floatUp） */

    /* 窄屏飘字（2026-09-14 补）：JS 把飘字挂到整个 .hud 条（.float-host）。
       根因：窄屏 .st 一格只有 ~57px，飘字挂进小格里居中放必然横着撑出小格
       （375 帧 14 重叠 / 768 出容器）。改法：飘字落在条内**第一行右侧的空白带**
       （三个数值格只占左侧 ~210px，右侧是空白）——右缘锚定（right:6px，
       left:auto），第 i 枚纵向 --slot-y 下挪 28px（idx×28），专用动画
       hudFloatRight 只淡入淡出、**零位移**，汽包全程在条内第一行空白处，
       不压左侧数值字、不出条；带内没有任何文字可压。
       .hud 在窄屏块 position:relative，为 absolute 落点提供参照。 */
    .hud{ position:relative; overflow:visible; }
    .hud.float-host .float{
      top:auto; right:6px; left:auto;
      transform:translateX(0);
      top:calc(4px + var(--slot-y,30px));
      animation:hudFloatRight 2.4s ease-out forwards;
    }
    .hud.float-host .float > .fl-k{ margin-left:5px; }
    .hud.float-host .float .fl-v{ margin-right:5px; }
    @keyframes hudFloatRight{
      0%{opacity:0;}
      8%{opacity:1;}
      75%{opacity:1;}
      100%{opacity:0;}
    }
  }
  /* 宽屏：顶部横条不再重复数值，交给右侧面板 */
  @media (min-width:820px){
    .hud .st.num{display:none;}
  }

  @media (max-width:700px){
    body{padding:8px;font-size:12.5px;}
    .hud .st{padding:0 10px;font-size:11px;}
    .stage{padding:16px 13px;min-height:180px;}
    .stage .txt{font-size:14px;}
    .track{padding:12px;}
  }


/* ============================================================
   皮肤：整组替换上面的颜色变量。用 body 上的 class 切换。
   判定写在 game.js 的 skinsOf(S) 里——皮肤不是奖品，
   是"你这辈子是怎么过的"的视觉总结。
   ============================================================ */

/* ---- SU：蓝天 + 灰地面 + 三色轴（官方界面：无网格、地平线在约 40%）---- */
body.skin-su{
  --body-bg:#d4d4d4; --bg:#efefef; --panel:#e6e6e6; --chrome:#d8d8d8;
  --line:#bdbdbd; --grid:#e4e4e4;
  --ink:#2b2b2b; --white:#131313; --dim:#6c6c6c; --dim2:#909090;
  --hud-bg:#e2e2e2; --box-bg:#eaeaea; --edge:#b4b4b4; --edge2:#cacaca;
  --sunken:#e0e0e0; --head-bg:#dadada;
  --cyan:#14688f; --yellow:#8a6410; --red:#ab3428; --green:#2e7040; --magenta:#7c3a90; --orange:#c07a14;
  --line-c:#a8a8a8; --accent:#14688f; --ink2:#4a4a4a;
  /* 换肤敏感 token：浅底深字（SU 蓝天灰地） */
  --seat-bg:#f7f7f7; --seat-ink:#4a4a4a; --seat-hov:#d9eef5;
  --opt-hov:#dff0f7; --opt-chosen-bg:#cfe9f4; --opt-chosen-ink:#0c2c3a;
  --cell-done-bg:#dcdcdc; --cell-done-ink:#5c5c5c; --cell-here-bg:#d6eaf2;
  --grp-line:#cfcfcf; --chip-up-bg:#e4f0e7; --chip-dn-bg:#f2e0dd; --k-line:#b0b8bc;
}
/* 绘图区＝SU 的天空与地面（地平线 40%，上蓝下灰，无网格） */
body.skin-su .stage{
  background-color:#b8b8b8;
  background-image:linear-gradient(#4a90d9 0%, #7db8e8 26%, #b9dcf2 39.6%, #b8b8b8 40%);
  background-size:auto;
}
/* SU 的三色绘图轴：红 X 向右下、绿 Y 向右上、蓝 Z 竖直（虚线） */
/* SU 的默认比例人（就在原点旁边站着） */
/* SU 的绘图区＝天空（这是 SU 唯一蓝的地方） */
body.skin-su .stage{
  background-color:#cfe3f2;
  background-image:linear-gradient(#a9cbe8 0%, #cfe3f2 46%, #dceaf6 100%);
  background-size:auto;
}
/* 地平线：天空下面压一条地面灰 */
body.skin-su .stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:min(26%,150px);
  background:linear-gradient(#cfcfcf,#c2c2c2);pointer-events:none;}

/* ---- 手绘：硫酸纸 + 针管笔 ---- */
body.skin-sketch{
  --body-bg:#cfc7b6; --bg:#f4f0e6; --panel:#eee9dd; --chrome:#ddd6c6;
  --line:#c4bba8; --grid:#e8e2d4;
  --ink:#39352c; --white:#1a1712; --dim:#7d7666; --dim2:#a8a091;
  --hud-bg:#ebe5d8; --box-bg:#f0ebe0; --edge:#bfb6a3; --edge2:#d2c9b7;
  --sunken:#e9e3d5; --head-bg:#e3dccd;
  --cyan:#1f5f8b; --yellow:#8a6410; --red:#a33a2a; --green:#3d6b34; --magenta:#7a3a7a; --orange:#a87415;
  --line-c:#b3a992; --accent:#1f5f8b; --ink2:#4d4838;
  /* 换肤敏感 token：浅底深字（硫酸纸） */
  --seat-bg:#f4efe2; --seat-ink:#4d4838; --seat-hov:#e7e0cc;
  --opt-hov:#eee7d4; --opt-chosen-bg:#e2e8cf; --opt-chosen-ink:#20221a;
  --cell-done-bg:#ddd6c2; --cell-done-ink:#4f4a3a; --cell-here-bg:#dde5cd;
  --grp-line:#c9c1ab; --chip-up-bg:#e3ead6; --chip-dn-bg:#f0dfd4; --k-line:#a89f8b;
}
/* 手绘：硫酸纸（无 CAD 网格；两层极淡噪点模拟纸张纤维，纯 CSS 不上图） */
body.skin-sketch .stage{
  background-color:#f4f0e6;
  background-image:
    radial-gradient(rgba(110,100,70,.07) 1px,transparent 1px),
    radial-gradient(rgba(110,100,70,.05) 1px,transparent 1px);
  background-size:9px 9px, 15px 15px;
  background-position:0 0, 4px 7px;
}

/* ---- Rhino：中灰工作视窗 + 更亮的浅灰面板（官方默认）---- */
body.skin-rhino{
  --body-bg:#8f8f8f; --bg:#a0a0a0; --panel:#e2e2e2; --chrome:#d6d6d6;
  --line:#8a8a8a; --grid:#969696;
  --ink:#2f2f2f; --white:#1a1a1a; --dim:#5a5a5a; --dim2:#787878;
  --hud-bg:#dcdcdc; --box-bg:#e6e6e6; --edge:#a8a8a8; --edge2:#bebebe;
  --sunken:#b0b0b0; --head-bg:#d2d2d2;
  --cyan:#0e6ba8; --yellow:#8a6410; --red:#a82f28; --green:#2c6b3f; --magenta:#763a8e; --orange:#c67a1e;
  --line-c:#6f6f6f; --accent:#0e6ba8; --ink2:#2f2f2f;
  /* 换肤敏感 token：浅底深字（Rhino 亮面板） */
  --seat-bg:#ececec; --seat-ink:#333333; --seat-hov:#d9e8f2;
  --opt-hov:#deeaf2; --opt-chosen-bg:#cfe4f2; --opt-chosen-ink:#10283a;
  --cell-done-bg:#cfcfcf; --cell-done-ink:#333333; --cell-here-bg:#cfe4f2;
  --grp-line:#bdbdbd; --chip-up-bg:#dceade; --chip-dn-bg:#efd9d5; --k-line:#afafaf;
}
/* Rhino 的浅灰面板上，正文数字/图层关/排程主项用深墨——别用那组发灰的 --ink/--white */
body.skin-rhino .side .row .n{color:#1f1f1f;}
body.skin-rhino .side .row .n.on{color:#131313;}
body.skin-rhino .side .row .n.off{color:#6a6a6a;}
body.skin-rhino .side .row .n b{color:#131313;}
body.skin-rhino .side .cell{color:#3a3a3a;}
body.skin-rhino .place .nm{color:#1c1c1c;}
/* 视窗内的构造平面网格（Rhino 的标志：视窗有网格，面板没有） */
body.skin-rhino .stage{
  background-color:#a0a0a0;
  background-image:linear-gradient(#8f8f8f 1px,transparent 1px),
    linear-gradient(90deg,#8f8f8f 1px,transparent 1px),
    linear-gradient(#9a9a9a 1px,transparent 1px),
    linear-gradient(90deg,#9a9a9a 1px,transparent 1px);
  background-size:96px 96px,96px 96px,12px 12px,12px 12px;
}
/* 视窗标题（左上角蓝色小标签，Rhino 每个视窗都有） */
body.skin-rhino .stage::before{
  content:'Perspective';position:absolute;left:0;top:0;
  background:#3d7ebf;color:#fff;font-size:9px;padding:1px 7px 2px;pointer-events:none;
}
/* 世界坐标轴图标（左下角三叉） */
/* Rhino 的文字在灰底上要深色 */
body.skin-rhino .stage .ttl,
body.skin-rhino .stage .txt{color:#1c1c1c;}
body.skin-rhino .stage .txt .bk{color:#4a4a4a;}

/* ---- 光标：跟着皮肤换。CAD 是十字拾取，SU/Rhino 默认都是箭头 ---- */
:root{
  /* 手绘：铅笔（内联 SVG，不依赖外部图片） */
  --cursor-pencil:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><path d='M3 21l1.5-4.5L17 4l3 3L7.5 19.5 3 21z' fill='%23f4f0e6' stroke='%23383530' stroke-width='1.2' stroke-linejoin='round'/><path d='M15.5 5.5l3 3' stroke='%23383530' stroke-width='1.2'/></svg>") 3 21, auto;
}
body.skin-su   { --cursor: default; }
body.skin-rhino{ --cursor: default; }
body.skin-sketch{ --cursor: var(--cursor-pencil); }

/* 十字线跟随机：只有 CAD 需要（SU/Rhino 是箭头，手绘是铅笔） */
body.skin-su .crosshair,
body.skin-rhino .crosshair,
body.skin-sketch .crosshair{ display:none !important; }

/* 拾取框颜色也跟着皮肤走 */
body.skin-su .crosshair .pick,
body.skin-rhino .crosshair .pick{ border-color:var(--dim2); }

  /* 状态栏里各软件特有的元素 */

  .place .nt{grid-column:2;font-size:11px;color:var(--dim);margin-top:2px;}

  /* ===== 结局：判词 =====

     （11/12/12.5/13/13.5/14/15/16/24）、8 档行高、8 档字距，纯粹是历次补丁叠出来的，
     肉眼读成「字体不统一」。现在只留 6 档、各有明确角色：
       24 标题 · 16 判词 · 15 现场句 · 13.5 正文/证据 · 12.5 小字（清单/头发/一件事/回望/说明）· 11 标签（题头/徽章/计数）
     行高统一 1.9（选题头那种单行标签除外）。字距三档：正文 0 / 正文微松 .02em / 标签 1~3px。

     判词若要衬线，只改 .verdict 一行的 --font-serif（选项 B，见 design/落地-结尾页字体-20260913.md）。 */
  .ending .claim{font-family:var(--font-ui);font-size:13.5px;line-height:1.9;color:var(--ink);margin-bottom:10px;}
  .ending .wlist{margin:0 0 12px 0;padding-left:2px;border-left:2px solid var(--line-c);}
  .ending .wlist .wl{font-family:var(--font-ui);font-size:12.5px;line-height:1.9;color:var(--ink2);padding-left:9px;letter-spacing:.02em;}
  .ending .hair{font-family:var(--font-ui);font-size:12.5px;line-height:1.9;color:var(--dim);margin-bottom:14px;}
  /* 中文没有真斜体：以前这里的 font-style:italic 是浏览器**合成斜体**（把 PingFang 硬掰斜）。
     实测（tools/capture-ending-snapshot.js）：整屏 32 个文字节点里**只有 .one 这两行**不是 normal 字形，
     在全屏等宽正体里它们看起来就是「另一套字」—— 用户说的「字体不统一」就是它。
     语气改用左边那条竖线（border-left）表达，字形一律正体。 */
  .ending .one{font-family:var(--font-ui);font-size:12.5px;line-height:1.9;color:var(--dim);
               margin-bottom:0;padding-left:10px;border-left:2px solid var(--line);}
  .ending .verdict{font-family:var(--font-ui);font-size:16px;line-height:1.9;color:var(--ink);font-weight:600;
                   letter-spacing:.02em;margin:22px 0 20px;padding-top:16px;
                   border-top:1px solid var(--line-c);}
  .ending .atlas{font-family:var(--font-ui);font-size:11px;line-height:1.9;color:var(--dim2);letter-spacing:1.2px;margin:-8px 0 14px;}

  /* ===== 结局·现场 =====
     字体/字号/行距口径与上面的判词族一致：现场句 15px、正文 13.5px，行高都 1.9。 */
  .ending .scene-txt{font-family:var(--font-ui);font-size:15px;line-height:1.9;color:var(--ink);
                     letter-spacing:.02em;margin:12px 0 2px;
                     padding:10px 12px;border-left:2px solid var(--accent);
                     background:var(--panel);}
  /* 结局正文（body 上屏）：一段陈述，接在 scene 后面，字号/行距与 .claim/.res 同族 */
  .ending .body-txt{font-family:var(--font-ui);font-size:13.5px;line-height:1.9;color:var(--ink2);
                    letter-spacing:.02em;margin:6px 0 2px;
                    padding:0 2px;}

  /* 排程按钮里「可能遇到：通宵 · 模型」那行小字（M5） */
  .place .nt .ev{display:block;color:var(--dim2);font-size:10.5px;
                 margin-top:2px;letter-spacing:.3px;}

/* 对话流：新句淡入，旧句留在上方逐级变淡 */
.dlg{ display:flex; flex-direction:column; gap:6px; }
.dlg .ln{ line-height:1.55; transition:opacity .28s ease; }
.dlg .ln.fresh{ animation: dlgIn .38s ease; }
@keyframes dlgIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .dlg .ln.fresh{ animation:none; } }

/* 开场预设校名 chips */
.presets{ margin-top:14px; color:var(--dim); font-size:11px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.presets button.pre{ background:transparent; border:1px solid var(--line); color:var(--ink); font:inherit; font-size:12px; padding:3px 9px; border-radius:4px; cursor:pointer; opacity:.85; }
.presets button.pre:hover{ border-color:var(--accent); color:var(--accent); opacity:1; }

/* 排程学年/线路横幅 */
.yr{ font-family:var(--mono); letter-spacing:4px; font-size:13px; text-align:center;
     color:var(--accent); padding:7px 0 2px; margin-bottom:2px;
     border-top:1px solid var(--line-c); border-bottom:1px solid var(--line-c); }

  /* ============================================================
     撤掉线条插画之后的排版件（2026-09-12）
     事件卡不再画 SVG 线稿，改成「图签行」撑版式；皮肤标记也用文字
     ============================================================ */
  .stamp{font-size:10.5px;letter-spacing:1.4px;color:var(--dim2);
         border-bottom:1px solid var(--line);padding-bottom:5px;margin:-2px 0 11px;}
  body.skin-su .deco .dmark,
  body.skin-rhino .deco .dmark{position:absolute;left:16px;bottom:12px;font-size:9.5px;
         letter-spacing:3px;color:var(--dim2);opacity:.5;pointer-events:none;}

  /* ---- 结局画廊（纯文字版式）---- */
  .titlebar .gal{cursor:pointer;border:1px solid var(--line);padding:0 7px;margin-right:12px;color:var(--dim);}
  .titlebar .gal:hover{color:var(--accent);border-color:var(--accent);}
  .titlebar .gal b{color:var(--accent);}
  .galwrap{position:fixed;inset:0;background:rgba(6,6,6,.88);overflow:auto;padding:30px 16px;z-index:400;}
  .galbox{max-width:960px;margin:0 auto;border:1px solid var(--line);background:var(--bg);padding:20px 24px 24px;}
  .galhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .galhead .galt{font-size:16px;letter-spacing:4px;color:var(--white);}
  .galhead .galn{font-size:11.5px;color:var(--dim);}
  .galhead .galn b{color:var(--accent);font-size:14px;}
  .galnote{font-size:11px;color:var(--dim2);padding:9px 0 2px;line-height:1.7;}
  .gsec{font-size:11px;letter-spacing:3px;color:var(--yellow);border-top:1px solid var(--line);
        margin-top:14px;padding:10px 0 6px;}
  .grow{display:grid;grid-template-columns:88px minmax(150px,1fr) minmax(230px,1.5fr);gap:10px;
        align-items:baseline;padding:5px 0;border-bottom:1px dashed #2a2a2a;font-size:12px;}
  .grow .gm{color:var(--dim2);font-size:11px;}
  .grow .gt{color:var(--dim2);letter-spacing:1px;}
  .grow .gd{color:var(--dim2);font-size:11px;line-height:1.6;}
  .grow.got .gt{color:var(--white);}
  .grow.got .gd{color:var(--ink2);}
  .grow.got .gm{color:var(--accent);}
  .galfoot{margin-top:20px;text-align:center;position:sticky;bottom:0;z-index:5;
           padding:10px 0 8px;background:var(--bg);border-top:1px solid var(--line-c);}
  @media (max-width:700px){
    .grow{grid-template-columns:1fr;gap:2px;}
    .grow .gd{padding-left:0;}
    .galbox{padding:16px 14px 18px;}
  }

  /* 结局页徽章（原「特殊结局」降级而来：不占图鉴格，但玩家照样看得到） */
  .ending .badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;}
  .ending .badge{font-size:11px;letter-spacing:1.2px;color:var(--dim);
        border:1px solid var(--line);padding:2px 8px;background:var(--sunken);}
  /* 徽章说明（2026-09-13）：点开才显示，接 ENDING_TEXT.special 的秃了／空手／什么都有三段 */
  .ending .badge{cursor:pointer;user-select:none;}
  .ending .badge:hover,.ending .badge:focus{color:var(--ink2);border-color:var(--dim2);}
  .ending .badge-hint{margin:0 0 2px;font-size:11px;letter-spacing:1.2px;color:var(--dim2);}
  .ending .badge-note{display:none;}
  .ending .badge-note.on{display:block;margin:6px 0 2px;padding:8px 10px;
        border-left:2px solid var(--yellow);background:var(--sunken);}
  .ending .badge-note .bn-t{font-size:12.5px;line-height:1.9;letter-spacing:2px;color:var(--ink2);margin-bottom:4px;}
  .ending .badge-note .bn-b{font-size:12.5px;line-height:1.9;color:var(--dim);}
  .ending .badge-note .bn-v{margin-top:4px;font-size:12.5px;line-height:1.9;color:var(--ink2);}
  .galwrap .badge-row .gt{color:var(--ink2);}
  .galwrap .badge-row .gm{color:var(--yellow);}

  /* ============================================================
     开局指引 · 三样东西（2026-09-13）
     样子照 design/mock-开场指引.html 定稿样张：CAD 黑底、分组框、每行「名称+小字+是什么+决定什么」。
     注意：别借 ending 图鉴的 .grow/.gd（那套是三列图鉴行），这里独立一套 tri- 前缀。
     ============================================================ */
  .stage .guide{display:flex;flex-direction:column;gap:14px;}
  .stage .guide .tri-sub{font-size:14px;color:var(--dim);line-height:1.85;}
  .stage .guide .tri-list{border:1px solid var(--line);background:var(--panel);}
  .stage .guide .tri-row{display:grid;grid-template-columns:92px 1fr;gap:14px;
        padding:13px 14px;border-bottom:1px solid var(--line);}
  .stage .guide .tri-row:last-child{border-bottom:0;}
  .stage .guide .tri-k{font-size:15px;letter-spacing:2px;}
  .stage .guide .tri-k small{display:block;font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:5px;}
  .stage .guide .tri-w{font-size:13.5px;line-height:1.85;color:var(--white);}
  .stage .guide .tri-d{font-size:12.5px;line-height:1.8;color:var(--dim);margin-top:6px;}
  .stage .guide .tri-foot{font-size:12.5px;color:var(--dim);line-height:1.85;
        padding-left:11px;border-left:2px solid var(--line);}
  .stage .guide .tri-foot em{color:var(--ink);font-style:normal;}

  /* 状态栏三项目标可点开（随时复习）：说明块与结局页徽章说明同族 */
  .hud .st.tap{cursor:pointer;user-select:none;}
  .hud .st.tap:hover,.hud .st.tap:focus{color:var(--ink2);}
  .side .row .n[data-tri]{cursor:pointer;user-select:none;}
  .side .row .n[data-tri]:hover{color:var(--cyan);}
  .hud-notes:empty{display:none;}
  .hud-notes{padding:0 15px 10px;background:var(--hud-bg);border-bottom:1px solid var(--line);}
  .hud-notes .badge-note{display:block;margin:8px 0 2px;padding:8px 10px;
        border-left:2px solid var(--yellow);background:var(--sunken);}
  .hud-notes .badge-note .bn-t{font-size:12.5px;letter-spacing:2px;color:var(--ink2);margin-bottom:4px;}
  .hud-notes .badge-note .bn-b{font-size:12.5px;line-height:1.8;color:var(--dim);}
  .hud-notes .badge-note .bn-v{margin-top:4px;font-size:12.5px;line-height:1.8;color:var(--ink2);}

  /* 两个「首次」提示：不打扰的浮层（首次掉头发 / 首次拿到作品）。
     不 blocking：pointer-events 关掉、几秒后自己淡出，不占行动点。 */
  .gtoast{position:fixed;top:16px;left:0;right:0;margin:0 auto;z-index:1300;
        width:max-content;max-width:calc(100% - 32px);background:var(--panel);
        border:1px solid var(--cyan);color:var(--ink);font-size:12.5px;line-height:1.7;
        padding:9px 14px;box-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none;
        animation:gtoastIn .22s ease-out;}
  .gtoast.out{opacity:0;transition:opacity .6s ease;}
  @keyframes gtoastIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  @media (max-width:700px){
    .stage .guide .tri-row{grid-template-columns:76px 1fr;gap:10px;padding:11px 12px;}
    .hud-notes{padding:0 10px 8px;}
  }

/* ============================================================
   移动端适配（2026-09-13）
   为什么要单开一块：
     桌面靠 html{zoom:1.25} 把 CAD 界面整体撑大，好认。手机上这层 zoom
     会和 viewport 的缩放叠乘（而 fixed 定位的坐标又被再乘一次，game.js 里
     只好手动除 zoom 去还原）。这里把移动端从这套 hack 里解放出来：
     移动端 zoom 归 1，fixed 坐标自然对齐（game.js 除的是 computed zoom=1）；
     其余全部改用百分比 / 换行 / flex-wrap 重排，不再依赖缩放。
   判定：「窄」覆盖竖屏（390/360），「矮」覆盖手机横屏（844×390）。
   规矩：可点的都 ≥44px；正文字号 ≥12px；没有元素横向溢出。
   ============================================================ */
@media (max-width:819px), (max-width:960px) and (max-height:520px){
  html{ zoom:1; }                                /* ① 解掉与非缩放 viewport 的叠乘 */

  html,body{ height:100%; }
  body{
    height:100dvh; font-size:16px; cursor:auto;
    /* ② 刘海 / 圆角 / 手势条：四边都留安全区，横屏左右也要 */
    padding-top:calc(5px + env(safe-area-inset-top));
    padding-bottom:calc(5px + env(safe-area-inset-bottom));
    padding-left:calc(5px + env(safe-area-inset-left));
    padding-right:calc(5px + env(safe-area-inset-right));
  }
  .app{ max-width:100%; width:100%; border:0; box-shadow:none; }

  /* ③ 触控尺寸：可点的都抬到 44px 以上（手指安全线） */
  .opt,.place,button.act,.seat,.massbar button,.arow .ab,.presets button.pre{ min-height:44px; }

  /* ④ 外壳：标题栏/菜单栏/HUD/状态栏——留得住手，也留得住字 */
  .titlebar{ height:auto; min-height:42px; padding:0 8px; gap:6px; font-size:12px; }
  .titlebar .fn{ display:none; }                 /* 文件名在手机上纯噪声 */
  .titlebar .w{ gap:8px; font-size:12px; align-items:center; }
  .titlebar .gal{ display:inline-flex; align-items:center; min-height:40px;
                  padding:0 10px; font-size:12px; }
  .menubar{ height:30px; font-size:12px; overflow-x:auto; overflow-y:hidden;
            -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .menubar b{ display:inline-flex; align-items:center; height:100%; padding:0 10px; }
  .hud{ flex-wrap:wrap; height:auto; min-height:40px; overflow:visible; }
  .hud .st{ padding:0 9px; font-size:12px; min-height:22px; flex:0 0 auto; }
  .hud .st.num{ display:flex; }                  /* 手机横屏也保留五个字段（盖掉 min-width:820 那组） */
  .hud .st.sp{ flex:1; justify-content:flex-end; min-width:84px; }
  .status{ height:auto; min-height:24px; font-size:12px; overflow-x:auto; overflow-y:hidden; }
  .status span{ padding:0 8px; flex:0 0 auto; }
  .status .co{ font-size:12px; }

  /* ⑤ 主区：竖屏收掉右侧面板；横屏也别把舞台压成一条 */
  .main{ grid-template-columns:1fr; }
  .side{ display:none; }
  .stage{ padding:14px 12px; min-height:120px; gap:12px; }
  .stage .ttl{ font-size:12px; }
  .stage .txt{ font-size:15px; line-height:1.75; }
  .cmd{ max-height:96px; padding:8px 10px; font-size:12.5px; }
  .cmd .l,.cmd .prompt{ overflow-wrap:anywhere; word-break:break-word; }
  .cmd .prompt .cur{ width:8px; height:13px; }

  /* ⑥ 选项 / 去处：撑满、放大、长句不撑破 */
  .opt,.place{ font-size:15px; padding:12px 13px; min-height:48px; }
  .opt .t{ overflow-wrap:anywhere; }
  .opt .k{ width:20px; height:20px; flex:0 0 20px; font-size:12px; }
  .opt .cf{ font-size:12px; }
  .place{ grid-template-columns:20px 1fr auto; gap:8px; }
  .place .nm{ overflow-wrap:anywhere; }
  .place .nt,.place .cf,.place .nt .ev{ font-size:12px; }
  button.act{ font-size:15px; padding:12px 26px; min-height:46px; }
  .seat{ font-size:12px; padding:3px; line-height:1.2; overflow-wrap:anywhere; }
  .seat .tagn{ font-size:12px; }
  .chip{ font-size:13px; }
  .yr{ font-size:13px; }
  .stamp{ font-size:12px; }
  .warn{ font-size:12.5px; }
  .massbar button{ font-size:13px; }
  .massleft{ font-size:12px; }
  .big .num{ font-size:40px; }
  .arow{ flex-wrap:wrap; gap:8px; }
  .arow .an{ width:64px; font-size:13px; }
  .arow .ab{ width:44px; height:44px; }
  .arow .left{ font-size:12px; }

  /* ⑦ 报志愿：输入框 ≥16px（iOS 不自动放大）；整行独占，提交键不被键盘盖住 */
  .fill{ gap:8px; }
  .fill input{ flex:1 1 100%; min-width:0; font-size:16px; min-height:48px; }
  .presets{ font-size:12px; }
  .presets button.pre{ font-size:13px; padding:8px 12px; }

  /* ⑧ 对话屏：手机上没有空格键，把「▸ 空格 / 点一下 继续」换成触屏说法 */
  .dlgc{ font-size:0; }
  .dlgc::after{ content:'▸ 点一下继续'; font-size:13px; letter-spacing:.5px; color:var(--dim); }

  /* ⑨ 结局屏：字不撑破，按钮常驻底部 */
  .ending{ padding:16px 12px; gap:14px; }
  .ending .big-t{ font-size:20px; }
  .ending .body{ font-size:13.5px; line-height:1.9; }
  .ending .lab,.ending .atlas{ font-size:12px; }
  .ending .claim{ font-size:13.5px; }
  .ending .wlist .wl,.ending .hair,.ending .one{ font-size:12.5px; }
  .ending .verdict{ font-size:15px; margin:16px 0 14px; }
  .ending .scene-txt{ font-size:15px; line-height:1.9; }
  .ending .body,.ending .claim,.ending .one,.ending .verdict,
  .ending .hair,.ending .wlist .wl,.ending .scene-txt,.ending .big-t,.ending .body-txt{ overflow-wrap:anywhere; }
  .ending .endbar{ position:sticky; bottom:-16px; margin:6px 0 -16px; padding:10px 0 8px; }
  .ending .badge{ font-size:12px; }

  /* ⑩ 图鉴弹层（fixed 全屏）：能滚、关得掉，关闭按钮钉在屏内 */
  .galwrap{
    padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
            calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    -webkit-overflow-scrolling:touch;
  }
  .galbox{ max-width:100%; width:100%; padding:14px 12px 8px; }
  .galhead{ flex-wrap:wrap; gap:6px; padding-bottom:8px; }
  .galhead .galt{ font-size:15px; }
  .galhead .galn{ font-size:12px; }
  .galnote{ font-size:12px; }
  .gsec{ font-size:12px; }
  .grow{ grid-template-columns:1fr; gap:2px; font-size:13px; }
  .grow .gm,.grow .gd{ font-size:12px; }
  .galfoot{ position:sticky; bottom:0; margin-top:14px; z-index:5;
            padding:8px 0 calc(4px + env(safe-area-inset-bottom));
            background:var(--bg); border-top:1px solid var(--line-c);
            display:flex; justify-content:center; gap:10px; }
  .galfoot button.act{ width:auto; min-height:44px; padding:10px 18px; font-size:14px; }

  /* ⑪ 特性变更飘字与 HUD 不再挤成一团（2026-09-14）。
     实测（375×812 / 390×844，固定 seed=42）：修复前 17px 飘字挂在 .st 上方
     -2px 处，整个泡在 12px 的 HUD 条里，还横向盖住左右相邻格——
     「头发-3%」box (169,56)→(252,84)，同时压住「头发 93%」(119–191) 与
     「进度 1/8」(191–277)，红字和灰白字互相穿透（证据截图 mobile-before-*.png）。
     现在（820px 以上不受影响，桌面口径/文案原样）：
     ① 字号 17→12px，行高 1.3（与 HUD 条同排的高宽感）；
     ② 加不透明胶囊底（--hud-bg + 1px 边 + 投影）：飘字是覆盖层，飘过任何
        内容行时底板兜住对比度，不与底层字互相穿透；
     ③ 落点从「锚定格上方 -2px（条内）」改为 HUD 条下方（game.js 按条底
        +51px 放：开局屏「三件套」副题行(116–155)与作品卡(163)之间的空档，
        胶囊 box (169,140)→(255,164)，全程不出该带、不被上飘带回条内）；
     ④ 上飘幅度 12→7px、75% 段收 4px（条底 b=92、渲染顶最低 ≈137，
        任意屏（含横屏 844×390）都停在 HUD 条外）。
     判据都过 tools/playtest/assert-mobile-float.js（两宽度 15 帧全绿）。 */
  .float{ font-size:12px; line-height:1.3;
          background:var(--hud-bg); border:1px solid var(--line); border-radius:3px;
          padding:3px 10px; box-shadow:0 2px 10px rgba(0,0,0,.55); }

  /* 移动端只收上飘幅度（ ≤16px 里更深收）；容器内落点/错层由主 .float 规则管。 */
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%, 0) scale(.9);}
    8%{opacity:1;transform:translate(-50%, -2px) scale(1.04);}
    75%{opacity:1;transform:translate(-50%, -4px) scale(1);}
    100%{opacity:0;transform:translate(-50%, -7px) scale(1);}
  }
}

/* 手机横屏（矮屏）：先把装饰性高度让出来给舞台 */
@media (max-width:960px) and (max-height:520px){
  .titlebar{ min-height:36px; }
  .menubar{ display:none; }
  .hud{ min-height:34px; }
  .hud .st{ min-height:20px; }
  .stage{ min-height:90px; padding:10px 12px; gap:10px; }
  .cmd{ max-height:72px; }
  .ending{ padding:12px 12px; }
  .ucs{ display:none; }
}

/* 很窄的屏（竖屏手机）：CAD 状态栏只留「对象捕捉 + 坐标」，
   否则 栅格/正交/极轴 会把最右的实时坐标挤出屏外（那三个是开关指示，不是数据）。
   只对默认 CAD 皮生效——SU/Rhino/手绘 的状态栏各是另一套，别动。 */
@media (max-width:520px){
  body:not(.skin-su):not(.skin-rhino):not(.skin-sketch) .status span:not(.act):not(.co){ display:none; }
}

/* 触屏没有 hover：十字光标是纯噪声，藏掉（CAD 的十字线只对鼠标有意义） */
@media (hover:none), (pointer:coarse){
  .crosshair{ display:none !important; }
}

/* ============================================================
   开场指引屏 · 视口适配（2026-09-13）
   问题：指引比其它屏都长——1280×650 就把「知道了，开始」挤出视口，
   而且 .stage 不跟着滚，等于点不到。三件事一起做：
     ① 收紧指引自己的垂直占用（只动 padding / 行距 / gap，字号一律 ≥12px）；
     ② 矮视口把桌面那层 html{zoom:1.25} 退成 1，等于多让出 25% 高度；
     ③ 按钮钉在指引区底部条（位置兜底：内容再长也点得到，不必先滚动）。
   ============================================================ */
.stage .guide{display:flex;flex-direction:column;gap:8px;margin:-13px -7px -6px;}
.stage .guide .ttl{line-height:1.25;}
.stage .guide .tri-sub{font-size:13px;line-height:1.5;}
.stage .guide .tri-row{grid-template-columns:84px 1fr;gap:12px;padding:8px 12px;align-items:start;}
.stage .guide .tri-k{font-size:14px;letter-spacing:1.6px;line-height:1.3;}
.stage .guide .tri-k small{font-size:10px;letter-spacing:1px;margin-top:2px;}
.stage .guide .tri-w{font-size:13px;line-height:1.45;}
.stage .guide .tri-d{font-size:12px;line-height:1.4;margin-top:3px;}
.stage .guide .tri-foot{font-size:12px;line-height:1.45;padding-left:10px;}
.stage .guide .big{gap:6px;padding:1px 0 0;position:sticky;bottom:0;z-index:2;
                   background:var(--bg);}
.stage .guide button.act{padding:10px 30px;min-height:44px;}
@media (max-width:700px){
  .stage .guide .tri-row{grid-template-columns:72px 1fr;gap:9px;}
}
@media (min-width:820px) and (max-height:760px){
  html{ zoom:1; }                              /* 矮屏退掉放大，先把高度让给内容 */
  .app{ max-width:min(1080px, 100vw); }        /* zoom 变了，宽度口径跟着放开 */
}
@media (min-width:820px) and (max-height:600px){
  .cmd{ max-height:80px; }                     /* 命令行日志让位（它本来就能滚） */
}

/* 2026-09-13 · 恶趣味主线：结局回望句（落点 3）＋图鉴批注（落点 5）
   回望句与结局小字同族：12.5→13.5px 那档留给正文，回望句算小字族的外沿，行高与全屏统一 1.9。 */
.ending .retro{font-family:var(--font-ui);font-size:13.5px;line-height:1.9;color:var(--dim2);margin-top:10px;
               padding-top:8px;border-top:1px dashed rgba(138,138,138,.35);}
.ending .retro + .retro{margin-top:4px;padding-top:0;border-top:0;}
.galwrap .grow .gn{grid-column:1 / -1;color:var(--accent);font-size:11px;letter-spacing:1px;opacity:.9;}
@media (max-width:700px){ .galwrap .grow .gn{font-size:11px;} }


/* ============================================================
   2026-09-14 · 手机端桌面外壳收口
   ------------------------------------------------------------
   背景：窄屏那一段 @media 刻意保留了 CAD 外壳，但实测（390×844）这些在手机上
   要么点不了、要么是死交互，白占屏：
     菜单栏 30px ｜ 命令提示行 96px ｜ 状态栏 24px ｜ UCS 图标 34px ≈ 占屏 22%
   这里只做「收口」，不动配色与皮肤：桌面端一行不受影响（全部锁在窄屏媒体查询里）。
   ============================================================ */
@media (max-width:819px), (max-width:960px) and (max-height:520px){
  /* ① 死交互：点了没反应，纯占位 */
  .menubar{ display:none; }                  /* 文件/编辑/视图/插入/格式/工具/绘图/标注 */
  .status{ display:none; }                   /* 对象捕捉/栅格/正交/极轴 + 0.0000,0.0000,0.0000 */
  .titlebar .w > span:last-child{ display:none; }   /* 桌面窗口按钮 — □ ✕ */

  /* ② 纯装饰：UCS 坐标轴，而且浮在舞台空白上 */
  .ucs{ display:none; }

  /* ③ 命令行：手机上只留日志回显（+作品/−头发 那种），
        「命令: _xx  [ A … / B … ]  <A>:▌」整条是选项按钮的重复 + 一个假输入框 */
  .cmd .prompt{ display:none; }
  .cmd{ max-height:56px; }

  /* ④ 可点字段抬到 44（这一段 CSS 自己在注释里写的规矩，之前 HUD 实际只有 39） */
  .hud .st.tap{ min-height:44px; display:inline-flex; align-items:center; }
}

/* 五类技能明细（2026-09-15）：宽屏在右侧特性栏，手机在可展开面板。
   每行＝名称 + 点数 + 5 格条；等级口径与门槛一致（6 点 = 1 级），未满格空心。 */
.skill-bars{display:block;padding:2px 0 2px 12px;border-left:1px solid var(--edge2);margin-left:2px;}
.skill-bars .sk{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:11px;line-height:1.5;}
.skill-bars .sk .k{color:var(--dim);white-space:nowrap;}
.skill-bars .sk .n{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;}
.skill-bars .pips{display:inline-flex;gap:2px;flex:0 0 auto;}
.skill-bars .pip{display:inline-block;width:8px;height:8px;background:var(--cyan);border:1px solid rgba(0,0,0,.55);}
.skill-bars .pip.off{background:transparent;border-color:var(--edge2);}
</style>

    st_desk1: { name:'通 宵', noChoice:true, eff:{skill:2,hair:-2}, talk: ['凌晨两点，你趴在图板上跟一根斜线较劲。','顶灯十一点就断了，你拖了个排插，三盏台灯串成一串。','旁边同学说这线歪了。你看也是歪的，可谁也没去叫老师。','天亮时你把它擦成正的。','回宿舍路上你觉得自己长高了两公分。']},
    st_desk2: { name:'桌 子', noChoice:true, eff:{skill:1,hair:-1}, talk: ['你把整张 1 号图平铺在桌上，占了三个人的位置。','隔壁班高两届的绕着走了一圈，没说话，在图角踩了个灰脚印。','你拿湿巾擦了半天，脚印越擦越花。','最后你在旁边写上自己的鞋号，当签名。','第二天那人搬去了别的桌。']},
    st_desk3: { name:'踩 图', noChoice:true, eff:{skill:1,hair:-1}, talk: ['你贴着墙画了一整天，脚不敢落地，地上铺着刚裱好的总图。','保洁员推着拖把进来，一眼看出这图今天要交。','别处先擦完，才回来拖你这一块。','漏网的一滴把墙角那条轴线泡糊了。你趴下去补，笔尖一按一个坑。','补线时保洁员在门口说，那地方本来就没人看。']},
    st_desk4: { name:'接 水', noChoice:true, eff:{skill:1,hair:0}, talk: ['画到一半没水了，你去走廊尽头接开水，回来一路没敢走快。','你在桌底下摸了一圈，摸到两支没帽的、一支不认识的。','后来你落笔前先数一遍笔。','数完还是丢。丢的那些都爱往地漏那边滑。']},
    st_desk5: { name:'进 度 墙', noChoice:true, eff:{skill:1,hair:0}, talk: ['你把今天的过程图贴到专教后墙，没人看。','你用的是工字钉，钉帽上还沾着石膏粉。','晚饭后回来，隔壁班的图贴在你上面，压你一头--双面胶，撕下来带走一层墙皮。','你把自己的挪上去。夜里又被挪回来。','老师来看过，两回都当没这堵墙。','第二天墙上多了一张隔壁班的图，没人承认。']},
    st_lib1: { name:'铁 架', noChoice:true, eff:{skill:1,hair:2}, talk: ['你钻进书架最里面那排铁架，书摞到胸口。','抽出一本，书后那张借书卡还在，最后一行日期比你出生那年还早。','保安说十点清场。你点点头。','九点五十你还在，铁架挤得你直不起腰。','十点铃响，你抱着三本书出来，胳膊上压出一道铁印。']},
    st_lib2: { name:'闭 馆', noChoice:true, eff:{skill:1,hair:1}, talk: ['十点整，图书馆放起那首一响就得收包的曲子。','很温柔，温柔到你以为还有二十分钟。','再抬头灯已经灭了一半，你正看到最关键的那页。','你把校园卡塞进去当书签，夹着书跑下楼，卡从楼梯上掉了一级。','出门你决定明天再来。管理员认得你的背影。']},
    st_lib3: { name:'借 书', noChoice:true, eff:{skill:1,hair:2}, talk: ['你抱了十二本书去自助机，下巴压着最上面那本。','机器响了十二次，像在数你。','你一本本放回书车，回头又续了一本。','门口老师问你是不是把整个书架搬空了。','你说没有，只搬了半排。他把你的借期划到了学期末。']},
    st_lib4: { name:'小 人', noChoice:true, eff:{skill:1,hair:2}, talk: ['你在规范旁边的空白处画了个睡觉的小人，把椅子改成躺椅。','用的是自动铅笔，笔芯一按就断，小人越描越黑。','画完自己困得不行，真想躺进那本书里。你决定陪它睡五分钟。','再睁眼，管理员已经把书合上了。小人被压成一条线。','从此你的小人只画在笔记本边角。']},
    st_lib5: { name:'占 座', noChoice:true, eff:{skill:2,hair:1}, talk: ['一楼靠暖气那排是抢手货。你派了本书去占。','派的是最厚那本--占得住位，翻不动页。','回来书还在，座没了。它被挪到边上，压在人家的笔记底下。','你认栽，在备忘录里记了一笔。','第二天同一时间，你的书被挪到了二楼。它升级了。']},
    st_sleep1: { name:'室 友', noChoice:true, eff:{skill:0,hair:5}, talk: ['你躺下时室友在打游戏，外放对面队的阵亡音效。','你数羊数到一千只。床头那副耳机，线缠成一个结，你摸黑解到第三只羊。','解开你戴上，反手开满音量。','室友问：「你今晚还敲吗？」','你说十一点。他十一点半睡了，你敲到三点。他后来没再问。']},
    st_sleep2: { name:'闹 表', noChoice:true, eff:{skill:0,hair:5}, talk: ['闹钟你按了三次，每次都顺手延长十分钟。','手机压在枕头底下，连着充电线。第四次你摸黑划过去的时候，线缠住了手腕。','再睁眼，天花板上的影子和睡前换了位置。','你划掉今天上午的日程。','下午你按这个作息过。']},
    st_sleep3: { name:'电 话', noChoice:true, eff:{skill:0,hair:4}, talk: ['午睡正深。你梦见在一条清水混凝土的走廊里走，接缝一道不差；走到底，前面又是一条一样的。\n一个电话把你拽出来，家里问饭吃了没。','你说吃了，挂了，躺回去--那个梦的位置已经没了。','翻个身，第二个电话。驿站让你带取件码下楼。','你趿着拖鞋下去，在货架上翻了半天，纸箱有一个角是湿的。','回宿舍一躺全是清醒，只好改晚上补觉。']},
    st_sleep4: { name:'灯 灭', noChoice:true, eff:{skill:1,hair:4}, talk: ['十一点熄灯，你还在床上看手机，屏幕照出半张黑眼圈。','被子底下压着白天那支笔，笔杆硌在你腰上。','室友说：「你把亮度调低点，明早我还得起。」','你调暗一格。他那边也灭了。','后来你学会把手机扣在枕头下。']},
    st_mat1: { name:'老 板 娘', noChoice:true, eff:{skill:1,hair:0}, talk: ['进店时老板娘在写单子，一行一个叉。','她头也不抬：又要纸还是胶。你说纸。','她指指角落，三摞纸码得比柜台高。','你搬完最后一摞，她往你口袋里塞了块糖，包装纸有点黏。','糖是店里存着的，没人舍得拆，倒便宜了你。']},
    st_mat2: { name:'搬 纸', noChoice:true, eff:{skill:1,hair:-1}, talk: ['这周的描图纸你一个人搬回专教，卷成一筒，皮筋扎两道。','一路磕了三个门槛。老板娘在后面喊：小心点，别蹭破了。','你回身看，皮筋没断，纸角破了一道。','你把破角那面朝里，压着画了一天。','画完才发现破的是正面。对着光看它像条河，你看着莫名顺眼。']},
    st_mat3: { name:'胶 味', noChoice:true, eff:{skill:1,hair:0}, talk: ['店里那桶胶你凑近闻，闻不出型号，只觉得有点呛。','桶盖边上结了一圈干胶，你用指甲抠了半天。','老板娘说这就是好胶，呛的才粘得牢。','你买回来试，果然撕不下来了。','后来为撕下来你把整张图重画一遍。','重画那张更好，老板娘不知道是哪桶胶的功劳。']},
    st_mat4: { name:'薄 纸', noChoice:true, eff:{skill:1,hair:-1}, talk: ['你要买薄一点的描图纸。老板娘翻出最薄那沓，举到门口的光里，能看见对面楼的窗格。','她用指肚捻捻，说这纸一使劲就穿。','你拎着纸转身走，她喊住你塞了把压纸角铁。','她说：省着点画，我进一次用一年。','你握着角铁回专教。']},

      {t:'熬一宿，按他的意思赶出来', eff:{skill:2, hair:-5, work:1}, r:'凌晨四点半，第七版排完线。你把它放在他办公室门口，回去睡了。'},
      {t:'打电话说做不完', eff:{skill:-1, hair:1}, r:'他在电话里说：「那你先把手头那张图描了。」你第二天上午意外地闲。'},
      {t:'接，但做到能看就交', eff:{skill:1, hair:-2}, r:'他翻完说「还行」。你没告诉他第三张以后线是留白的，他也没翻到那。'}

      {t:'只保一份能看的先交', eff:{skill:1, hair:-2}, r:'交的是排版没排完的那版。你去睡了。'},
      {t:'把大家叫到一起摊牌，分活', eff:{hair:-1, work:1}, r:'会开完各自认了活。最后那页 A2 是管渲染图的那个人出的，你说谢，他说没事。'}

  k1_topic: {

    opts:[

      {t:'换方向，重新想一个', eff:{skill:1, hair:-4}, r:'你写了六页，最后用的是第三页第二个。它稳得多，也普通得多，字还比第一版小一档。'},
      {t:'稳住，这次宁可先不投', eff:{hair:1}, r:'你没投。学期末老师问竞赛，你说「没成」。第二年你真把第一页的论据补进去了。'}
    ]
  },
  k1_meet: {
    name:'竞 赛 · 小 组 会', noChoice:true, eff:{skill:1, hair:-1},
    talk: ['竞赛小组会开了四十分钟，议题是「中午吃什么」，最后定了吃那家第三贵的。','散会前有人把分工表投到墙上，填了三个名字，剩下两个空着没人认。','你拿白板笔把自己那格描了一遍。','剩下两个空你都填了自己，笔帽没盖就还了回去。','出门的时候，另一个人在你背后说了声「谢了」。']
  },
  k1_title: {
    name:'竞 赛 · 起 名 字', noChoice:true, eff:{work:1, hair:-1}, set:{_k1Title:1},

      {t:'只拿废料试两下', eff:{skill:1}, r:'你切了两条废边，师傅扫一眼没说话，最后往你手边推了块好料。那块好料你一直没敢动。'}

      {t:'改一半，保个底', eff:{skill:1, hair:-2}, r:'你把两处硬伤修了，骨架没动。下次评图他又提那两处，这一回你没能答上来。'}

  k3_scale: {

  // 2026-09-13 用户裁定（清单第 15 项）：「除了固定题，其他的都可以是暗牌」。
  //   · 固定题＝排程里的去处（PLACES）→ 保持明牌（去专教/泡图书馆/帮老师干活/补觉…产出固定，玩家要算）；
  //   · 一切**卡内选项** → 暗牌：选之前不显示 +数字/−数字，选完在弹窗里揭晓（只列动了的项，涨绿扣红）。
  //   统一在这里标，不逐张卡手写（新加卡自动生效）；`fork` 是导航/分岔卡，按原样不标。
  //   引擎侧只用既有的 `hid` + 弹窗（与开场追问那六个选项同一套），没有新造机制。
  Object.keys(CARDS).forEach(function(k){
    if (k === 'fork') return;                                  // 毕业分岔：导航，按原样
    const c = CARDS[k];
    if (!c || typeof c !== 'object') return;
    if (c.opts && c.opts.length) c.opts.forEach(function(o){ if (o) o.hid = true; });
    if (c.alt && c.alt.opts && c.alt.opts.length)              // 同一张卡的第二套选项（若有）
      c.alt.opts.forEach(function(o){ if (o) o.hid = true; });
  });

  // ========== 开局：填志愿 → 投骰子 → 看那年录取线 ==========

  function rollAdmit(name, retry){

        box.appendChild(b);

  function showOpeningGuide(){

      return '<div class="tri-row">' +

  function toggleTriNote(id){
    const box = el('hudNotes');
    if (!box || !TRI[id]) return;
    if (box.getAttribute('data-open') === id){       // 再点同一个＝收起
      box.innerHTML = ''; box.removeAttribute('data-open'); return;

  function paintTriNote(id){
    const box = el('hudNotes');

    box.innerHTML =

  // 不打扰的插话（首次掉头发 / 首次拿到作品）：fixed 浮层，几秒后自己走。
  // 不占行动点、不进回合计数、不动数值；pointer-events:none，不挡任何点击。
  function tipFlash(text){
    if (!text || !document.body) return;
    const d = document.createElement('div');
    d.className = 'gtoast';
    d.textContent = text;
    document.body.appendChild(d);
    setTimeout(function(){ d.classList.add('out'); }, 4200);
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 5000);
  }
  // 同一个形态，但要带颜色（暗牌选完揭晓：涨的绿、扣的红）--所以多一层 innerHTML。
  // 只喂自己拼的 HTML，别拿它来放玩家输入。
  function tipFlashHTML(html){
    if (!html || !document.body) return;
    const d = document.createElement('div');
    d.className = 'gtoast gtoast-vals';   // 带数值的那一种：横向 flex + 8px gap（挤在一起已修，见 style.css）
    d.innerHTML = html;
    document.body.appendChild(d);
    setTimeout(function(){ d.classList.add('out'); }, 4200);
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 5000);
  }

  // 状态栏点击：事件委托，顶部横条与右侧特性栏一起管（两边都挂 data-tri）
  document.addEventListener('click', function(e){

    if (t) toggleTriNote(t.getAttribute('data-tri'));

    if (e.key !== 'Enter' && e.key !== ' ') return;

    if (!t) return;
    e.preventDefault(); toggleTriNote(t.getAttribute('data-tri'));

  const OPENING_HOOK = { option: "c", when: "大二上", line: "这话你大一的时候也说过。",
                        note: "触发条件：开场选了 c 的玩家，大二上抽到「食堂·打饭队伍里」那条插播时，正文末尾多出这一行（不加数值、不加第二条）。" };

  // ============================================================
  //  行业背景插播（112 条 · 十幕）
  //  文案逐字来自 design/行业文案-合并定稿.json 的 pools（一字未改，含换行）。
  //  玩法：一局五个学年回合，每个学年取「上」「下」两幕；

  //  tools/playtest/harvest.js 的 `.place` / `.opt` / `#nextBtn` 三件套直接推得动它。
  // ============================================================
  const INTER_YEAR = ['大一', '大二', '大三', '大四', '大五'];
  const INTER_P_TWO = 0.45;         // 一学期出 2 条的概率（否则 1 条）--调这一个数就够
  // 数据本体逐字放在 src/index.html 的 <script id="interData" type="application/json"> 里
  // （十幕 112 条定稿，约 45KB；放 HTML 里 build.py 原样内联，single-file 不破）。
  // 读不到就退化成空池：插播不出现，游戏其余流程完全不受影响。
  const INTER_POOLS = (function(){
    try {
      const n = document.getElementById('interData');
      return n ? (JSON.parse(n.textContent) || {}) : {};
    } catch (e) { return {}; }
  })();

  // 每幕固定一条「那年 · 行业」（2026-09-13 · 行业新闻强化）：
  //   · 十幕（大一上~大五下）各一条，讲**那一年的行业动向**（行业新闻的措辞在变，年份不写明）；
  //   · 专属角标「那年 · 行业」--上屏时以一枚角标标出它的身份，正文标题仍是这条的场合；
  //   · **固定**＝不受随机抽签影响：这一幕只要被取到（「上」幕必取，「下」幕按概率），它一定先播；
  //   · 不写年份、不写房价曲线（铁律：时间线是暗线，靠细节递进）；
  //   · 不进 S._interSeen--它不是随机条目，不会因为「抽过了」而在下一局/本局消失。
  const INTER_FIXED_TAG = '那年 · 行业';

  // 抽这一学期（回合）的插播。一学期只抽一次：先「上」幕，再「下」幕。
  // 返回 [{term:'大二上', e:{trigger,text,keys}}]；本局抽过的条目不再出现。
  // 每幕的顺序固定是：固定条（那年 · 行业）→ 随机条。
  function drawInterludes(){
    if (!S || S.over || S.round < 0 || S.round >= INTER_YEAR.length) return [];
    if (S._interLast === S.round) return [];          // 这一学期已经插播过了
    S._interLast = S.round;
    const y = INTER_YEAR[S.round];
    if (!S._interSeen) S._interSeen = [];
    const one = function(half){
      const term = y + half;
      const pool = INTER_POOLS[term];
      if (!pool || !pool.length) return null;
      const avail = [];
      for (let i = 0; i < pool.length; i++){
        if (S._interSeen.indexOf(term + '#' + i) < 0) avail.push(i);
      }
      if (!avail.length) return null;                 // 这一幕本局抽完了：宁可不播，也不重复
      const i = avail[Math.floor(Math.random() * avail.length)];
      S._interSeen.push(term + '#' + i);
      return { term: term, e: pool[i] };
    };
    const out = [];
    // 一幕 = 固定条（若有）+ 随机条；固定条先播，且不参与 S._interSeen 记账。
    const playTerm = function(half){
      const term = y + half;
      const fx = INTER_POOLS.fixed && INTER_POOLS.fixed[term];
      if (fx) out.push({ term: term, e: fx, fixed: true });
      const r = one(half);
      if (r) out.push(r);
    };
    playTerm('上');
    if (Math.random() < INTER_P_TWO){
      playTerm('下');
    } else if (!out.length){
      playTerm('下');
    }
    return out;
  }

  function showInterlude(list, idx, done){
    const it = list[idx], e = it.e;
    const hook = (it.term === OPENING_HOOK.when && e.trigger === '食堂·打饭队伍里')

          '<button class="act" id="nextBtn">' + UI('ending.cont', {}, '继 续') + '</button>' +
        '</div>' +
      '</div>';
    el('nextBtn').onclick = function(){
      if (idx + 1 < list.length){ showInterlude(list, idx + 1, done); return; }
      done();
    };

  // ========== 工具 ==========

      .replace(/&/g, '&amp;')

  function log(t, cls){

  // 数值门槛：技能/作品/头发够不够，决定有些事你做不做得成
  function meetNeed(n){
    if (n.skill && S.skill < n.skill) return false;
    if (n.work && S.works.length < n.work)  return false;   // 作品只有一个真源：作品集里的件数
    if (n.hair  && S.hair  < n.hair)  return false;
    // 2026-09-15：毕业分岔的七条去向改看具体技能级数（tal / talAny）。
    //   1 级 = 6 点，tagOfSkill 归五类；tal=全部达到，talAny=任一组达标（组内是 AND）。
    //   只在分岔屏用，卡面/白天选项的 need 不受影响。选点依据见 design/落地-门槛改级数-20260915.md。
    function talGroup(g){
      for (const tag in g) {
        const lv = Math.floor((S.skillTags[tag] || 0) / 6);   // 6 点 = 1 级
        if (lv < (g[tag]>>>0)) return false;
      }
      return true;
    }
    if (n.tal && !talGroup(n.tal)) return false;
    if (n.talAny && !n.talAny.some(talGroup)) return false;
    return true;
  }
  // 五类技能明细（2026-09-15）：名称用学生话，每行「名称 + 点数 + 5 格条」。
  // 等级 = min(5, floor(点数/6)+1)（与门槛 6点=1级 同口径）；未满格空心。
  // 2026-09-15 接入两处（宽屏右侧「特性」栏 / 手机可展开面板）：
  //   以前它挂在 window 上、定义在 needText 里 —— 时机不确定，首屏可能还没有，所以提到顶层，
  //   做成「直接可调用的普通函数」，开局第一屏就已经存在。
  const SKILL_TAG_CN = { draw:'手绘', model:'建模', cad:'CAD', craft:'做模型', theory:'理论' };
  function skillBarsHTML(){

  function needText(n){

  function delta(eff){    const parts = [];

  // 作品统一入口：竞赛/毕设/事件卡做了东西，就进作品集（单一真源）

  // ---- 五类技能归类（2026-09-15，v3：新增 theory）----------------------------------
  // 每一笔 skill 加点都要落到 draw（手绘）/ model（建模）/ cad（CAD）/ craft（手工模型）/ theory（理论）之一，
  // 保证 S.skill === 五类之和。规则按「来源卡名/场景/去处」逐步判中即归，都不命中走兜底。
  // 归类口径见 design/落地-技能五类-20260915.md。
  // v4（2026-09-15 二次修）：三条硬规则收口——
  //   ① 改图/审图/变更单/出一版（图）/描图/施工图/建施/平立剖/天正/CAD → cad
  //   ② 粘/切/刻/胶水/实体模型/线割机/切板机/台锯/激光机/切割台/泡沫/等高线/粘土/底板 → craft
  //      （「机床」不入词表：系馆模型房是线割机，不是金工房的机床——2026-09-15 用户口径修正）
  //   ③ 拉体块/建模/Rhino/SU/电池/参数化/渲染/效果图/Lumion/材质/灯光 → model
  //   理论（结构/构造/物理/历史/规范/抄背默）→ theory；手绘（素描/速写/写生/快题/水彩）→ draw。
  // 命中顺序：draw → theory → cad → craft → model；都不中走二级去处/兜底。
  // 归类口径见 design/落地-技能五类-20260915.md（v4 一节）。
  function __tagRules(){
    return [
      ['draw',  /写生|速写|素描|手绘|水彩|墨线|排线|默图|草图|评图|评审|crit|小人|踩图|答辩|面试|复试|汇报|讲述|演讲|重画|一草|底图|剖透视|铅笔|柱式|拷贝纸|画图|画画|画法|画上|重描|描完/],
      ['theory',/结构|构造|建筑物理|物理|建筑史|规范|力学|防水|场地测绘|测绘|选型|考研|盲审|中期|论文|查重|文献|导师|助教|柱式|等高线|抄|背|默|跨度|图书馆|进度墙|翻书|细看|闭馆|借书|占座|铁架|复印|评委|推翻|大改|按文献|照着书|往后翻|借同学的|请他吃顿饭|下一个活|概念阶段|真去数|记数据/],
      ['cad',   /改图|变更单|审图|出一版|出一版改图|出图|描图|施工图|平立剖|建施|天正|CAD|催图|校对|署名|图签|成图|红笔|图幅|比例尺|排版|重排|图纸|交底|批注|发回去|各写一份|带施工方|判给施工方|走流程|报维修|验收|交付|现场会|入职|甲方|工位|职场|公司|实习|写材料|简历|旧同事|老同事|交底|汇报会/],
      ['craft', /模型|切|刻|粘|胶|泡沫|板材|底板|粘土|等高线|泡沫切割机|泡沫切割|切泡沫|热丝|电热丝|切板机|台锯|激光机|切割台|磨|锯|锉|工坊|机器|板屑|焊|绷|宿舍|通宵|灯灭|接水|胶味|老板娘|搬纸|薄纸|桌子|闹钟|油泥|手工|削板|挑灯|关门|油毡|擦干净|照交|补好再走|削|师傅/],
      ['model', /渲染|Lumion|Enscape|Rhino|SU|SketchUp|建模|拉体块|体块|参数化|电池|效果图|材质|灯光|竞赛|投标|作品|排版|申报|重新学|工坊通宵/],
    ];
  }
  function __tagMatch(src, placeName){
    const s = ((src || '')).replace(/\s/g, '');
    const p = ((placeName || '')).replace(/\s/g, '');
    const t = s + '|' + p;
    // 二级：去处兜底（图面/工坊/图纸三类场景）
    if (/泡图书馆/.test(p)) return ['draw', /$/];
    if (/专教|studio|模型房/.test(p + s)) return ['craft', /$/];
    if (/帮老师|teacher|教研室/.test(p + s)) return ['cad', /$/];
    if (/site|desk|allnight/.test(p + s)) return ['cad', /$/];   // 职业期场景＝对图
    const rule = __tagRules().find(r => r[1].test(t));
    return rule || null;
  }
  function tagOfSkill(src, placeName){
    const hit = __tagMatch(src, placeName);
    if (hit) return hit[0];
    // 三级：真无线索的，按「综合设计能力」记 model（兜底，占比要求 ≤30%）
    window.__tagStats = window.__tagStats || { total:0, fallback:0 };
    window.__tagStats.total++;
    window.__tagStats.fallback++;
    return 'model';
  }
  // 一级~二级命中统计（供 check-skill-tags 打兜底率）：ruleTagOfSkill 不含三级兜底，
  // 供自检脚本对照——tagOfSkill 命中一级/二级的，ruleTagOfSkill 返回同一值。
  function ruleTagOfSkill(src, placeName){
    const hit = __tagMatch(src, placeName);
    return hit ? hit[0] : null;
  }

  // 在一次 apply() 里把「这一笔 skill 变化」记入四类。只在加点(+>0)时归类--
  // 扣点不像学东西（改图/被否定不缺哪一类），只回 S.skill 总值，四类不动；
  // 这样四类之和在扣点后可能大于 S.skill，断言按「和 >= skill 且加的时候逐笔守恒」收口。
  function applySkillTag(delta, src, placeName){
    if (delta > 0){
      const tag = tagOfSkill(src, placeName);
      if (!S.skillTags) S.skillTags = { draw:0, model:0, cad:0, craft:0, theory:0 };
      S.skillTags[tag] += delta;
      S._skillLog.push({ delta:delta, tag:tag, src:(src || ''), place:(placeName || '') });
    }
  }

  function apply(eff){
    const d = [];
    const hairBefore = S.hair;
    if (eff.work){
      if (eff.work > 0){ makeWork(); d.push(['作品', 1]); }                       // 做出作品→进作品集
      else if (S.works.length){ S.works.pop(); S.work = S.works.length; d.push(['作品', eff.work]); }
    }
    if (eff.skill){
      S.skill += eff.skill;
      d.push(['设计', eff.skill]);
      applySkillTag(eff.skill, S._skillSrc, S._skillPlace);   // 归类（_skillSrc/_skillPlace 由调用方先挂）
    }
    if (eff.hair){  S.hair  += eff.hair;  d.push(['头发', eff.hair]); }
    if (S.hair > 100) S.hair = 100;
    if (S.hair < 0) S.hair = 0;
    // 头发首次掉到 30 及以下：记一笔（只记第一次）--「通宵那一次」长文本的挂点读它
    if (!S._hairLow30 && S.hair <= 30) S._hairLow30 = true;
    // 首次掉头发：头发第一次比上一次低，多给一句解释（一局只出现一次，不阻断操作）
    // 开场阶段不算：录取那次 设计+2 头发-8 不算「熬过一次」，别把提示用掉
    if (!S._tipHairDown && S._begun && S.hair < hairBefore){
      S._tipHairDown = true;
      tipFlash('熬夜、通宵、连轴转，花的都是它。');
    }
    if (S.skill < 0) S.skill = 0;
    renderHUD();
    // 让 HUD 上变动的数字闪一下，并飘出来--别让它悄悄跳过去
    const MAP = { '技能':'hSkill', '设计':'hSkill', '头发':'hHair' };        // 「设计」为历史键兜底
    const MAPW = { '技能':'sSkill', '设计':'sSkill', '头发':'sHair' };       // 宽屏时数值在右侧面板
    const wide = window.matchMedia('(min-width:820px)').matches;
    d.forEach(function(x){
      if (x[0] === '作品') return;   // 作品格已从 HUD 移除（2026-09-15），不再飘作品
      const node = el(wide ? (MAPW[x[0]] || MAP[x[0]]) : (MAP[x[0]] || MAPW[x[0]]));
      if (!node) return;
      node.classList.remove('pulse'); void node.offsetWidth; node.classList.add('pulse');
      // ===== 飘字改为「容器内绝对定位」（2026-09-14 重写，不再 fixed+全局坐标） =====
      // 旧写法（为什么原来一直出界/挤在一起）：
      //   f 是 position:fixed append 到 body，坐标用 getBoundingClientRect 的全局
      //   值，却手动除以 html 的 zoom=1.25。夹边界时 window.innerWidth/z（带缩放）
      //   和 f.offsetWidth（不带）两套单位混着算 → 夹边界等于没生效 → 仍出界、
      //   仍压在特性栏文字上；同屏多枚还几乎落在同一个 x 上叠成一坨。
      // 新写法：把飘字挂进该 HUD 数值自己的容器 .float-host（JS 在这里懒建一次、
      //   并包好 node），容器本身就是 HUD 的正常布局单元 →
      //   · position:absolute + left:50% + translateX(-50%)：坐标只在容器内算，
      //     与 html 的 zoom 无关（zoom 按同倍数放大容器和飘字，比例不变）；
      //   · top 从容器内一个固定值起步（窄屏 = 条下方浮动带的缝里，宽屏 = 面板
      //     数值上沿），CSS floatUp 动画幅度 ≤ 16px，不会带回条内；
      //   .float-host 有 max-width:100%，容器本身就贴着 HUD 格，飘字不可能
      //   越出容器，容器外就是别的 HUD 格/标题——物理上不可能重叠。
      // 同屏多枚错开（用户看到的 3 枚叠成一坨）：每次 apply 里新出现的枚数
      //   = d.length，第 i 枚纵向让它 行高×i（21px），横向左右交替 ±14px，
      //   加在「同一容器」的多枚上其实就是错行错列，不会叠在同一坐标。
      const fk = document.createElement('span'); fk.className = 'fl-k'; fk.textContent = x[0];
      const fv = document.createElement('span'); fv.className = 'fl-v';
      fv.textContent = (x[1] > 0 ? '+' : '') + x[1] + (x[0] === '头发' ? '%' : '');
      // .float-host 懒建：每个 HUD 数值一枚，包住 node，自身 position:relative
      // （右侧面板特性行 / 顶部横条 .st 在 CSS 里已自带 float-host 样式规则——直接用；
      // 窄屏特例（<820px，375/768 两块覆盖）：飘字不再挂进 .st 那一小格——窄屏一格
      //   ~57px 宽，居中 + 12px 胶囊 + ±12px 横向错开会撑出小格、压进相邻 HUD 格
      //   （375/768 出容器与重叠的根因）。改为挂在整个 .hud 条上（.hud 本身
      //   position:relative），落点 = 条下方预留空带，第 i 枚左/中/右 --slot-x 错开，
      //   带内没有任何文字可压，胶囊左缘 ≥0、右缘 ≤ 条宽 → 不出容器。
      let host = node.closest('.hud .st') || node.closest('.float-host');
      if (host && node.closest('.hud') && !window.matchMedia('(min-width:820px)').matches){
        host = node.closest('.hud'); host.classList.add('float-host');
      }
      else if (host && host.classList.contains('hud') === false && !host.classList.contains('float-host')){
        host.classList.add('float-host');
      }
      if (!host){
        host = document.createElement('span');
        host.className = 'float-host';
        node.parentNode.insertBefore(host, node);   // 占住 node 原位置
        host.appendChild(node);
      }
      const f = document.createElement('div');
      f.className = 'float';
      f.appendChild(fk); f.appendChild(fv);
      f.style.color = x[1] > 0 ? 'var(--green)' : 'var(--red)';
      // 同一次 apply 里多枚飘字错开：宽屏沿用横向 ±14px；窄屏（整条 HUD 托管）
      //   用 --slot-x 左/中/右三档错开——窄屏还用 ±14px 会把胶囊推出条外，
      //   三档都吃在条宽之内（条 375 宽：left 10 / center / right 10）。
      const idx = d.indexOf(x);
      if (host.classList.contains('hud')){
        // 窄屏（整条 HUD 托管）：条内第一行右侧空白带（三个 .st 只占左侧 ~210px），
        //   右缘锚定（贴条右 6px），第 i 枚纵向 --slot-y 下挪 28px，上浮为 0（hudFloatRight）
        f.style.setProperty('--slot-y', (30 + idx * 28) + 'px');
      } else {
        f.style.setProperty('--float-x', ((idx % 2 ? 14 : -14)) + 'px');
      }
      host.appendChild(f);
      setTimeout(function(){ f.remove(); }, 3000);   // 与 floatUp 的 2.4s 对齐：别提前删，让人读得完
    });
    if (d.length){
      log(d.map(function(x){
        return x[0] + ' ' + (x[1]>0?'<span class="up">+'+x[1]+'</span>':'<span class="dn">'+x[1]+'</span>');
      }).join('　'), '');
    }
  }


  // ========== 键盘：在命令行敲字母选选项（CAD 就是这样的）==========
  // 敲 A/B/C/D 选中对应项，回车＝第一项。敲错了在命令行留一行回显。
  function cmdOptions(){
    // 事件卡收 .opt，排程屏收 .place（M5：命令行是全局入口，排程也能敲字母选）
    // 返回的是「按钮 + 它自己印的字母」：字母必须取按钮上印的那个，
    // 不能拿过滤后的下标当字母--排程屏第一个去处去过之后，敲 B 会发动第 3 个去处（2026-09-12 修）
    return Array.prototype.slice.call(document.querySelectorAll('.opt, .place'))
      .filter(function(b){
        return !b.classList.contains('locked') && !b.classList.contains('used') && !b.disabled;
      })
      .map(function(b){
        const kEl = b.querySelector('.k');
        return { el: b, k: kEl ? String(kEl.textContent || '').trim().toUpperCase() : '' };
      });
  }
  function cmdEcho(txt){
    const t = el('typed');
    if (t) t.textContent = txt;
  }
  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;   // 填学校名时别抢键
    // 报志愿屏：这一屏的主操作是「填志愿」，唯一那个按钮是彩蛋「不报建筑」。
    // 以前--没聚焦输入框时敲回车＝点第一个选项＝直接进结局 1，玩家一脸懵地被不报建筑了。
    if (el('schoolInput')){
      const ks = String(e.key || '').toUpperCase();
      if (e.key === 'Enter' || e.key === ' ' || ks === 'A'){
        e.preventDefault(); const ok = el('okBtn'); if (ok) ok.click(); return;
      }
      if (ks === 'B'){
        e.preventDefault(); const nb = document.querySelector('#opts .opt'); if (nb) nb.click(); return;
      }
      return;
    }
    if (S._dlg){ if (e.key === ' ' || e.key === 'Enter' || (e.key||'').toUpperCase()==='SPACEBAR') dlgNext(); return; }
    const opts = cmdOptions();
    if (!opts.length) return;

    const k = (e.key || '').toUpperCase();

    if (k.length === 1 && 'ABCDEF'.indexOf(k) >= 0){
      e.preventDefault();
      cmdEcho(k);
      const hit = opts.filter(function(o){ return o.k === k; })[0];
      if (hit) hit.el.click();
      else { log(UI('ending.noKey', {k:k}, '没有 ' + k + ' 这一项。'), ''); cmdEcho(''); }
      return;
    }
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      cmdEcho('⏎');
      opts[0].el.click();
      return;
    }
    if (e.key === 'Backspace'){ cmdEcho(''); return; }
  });

  // ========== 主流程 ==========
    // ============================================================
  //  渲染分派表
  //  以前：一个 if 链全堆在 startTile 里（加一种交互要动多处、OR 条件越堆越长）。
  //  现在：每种 form 一个函数，新交互只往 RENDERERS 里加一项。

  // 每站共用的底子：标题 + 场景线稿 + 正文（含占位符替换）
  // 学年正文（清单第 37 项）：写了 `textByYear` 的卡按回合（学年）给不同的正文--
  //   同一张卡在大一 / 大二 / 后来不是同一段（可重复的是事，不能重复的是字）。
  //   `textByYear` 的键＝回合号；比表里最后一档还靠后的学年沿用最后一档；更早的用 `text`。
  function cardText(c){
    if (!c) return '';
    if (!c.textByYear) return c.text || '';
    const r = (S && S.round != null) ? S.round : 0;
    let v = c.textByYear[r];
    if (v == null){
      const ks = Object.keys(c.textByYear).map(Number).sort(function(a, b){ return a - b; });
      const last = ks.length ? ks[ks.length - 1] : null;
      v = (last != null && r > last) ? c.textByYear[last] : c.text;
    }
    return v || c.text || '';
  }
  function baseHTML(c, v){
    let body = cardText(v) || '';   // 有些卡只写了 talk 演出、没写 text：缺了不该整屏崩掉（会锁死在这一屏）
    if (body.indexOf('@@THESIS@@') >= 0){
      const t = S.title || '';
      const mid = Math.floor(t.length / 2);
      const w = t ? t.slice(Math.max(0, mid - 2), mid + 2) : '建筑';
      const dir = S.titleDir || '';
      const pool = (ENDING_TEXT.ui && ENDING_TEXT.ui.thesisDir && ENDING_TEXT.ui.thesisDir[dir]) || null;
      if (pool && pool.length){
        body = UI('thesisDir.' + dir, { w: w }, pool[0]);
      } else {
        body = '评委翻到你的图。\n问：「你这个题，『' + w + '』体现在哪？」';
      }
      const nw = namedWork(S.title || '');       // 作品 0 件 → 不出现
      if (nw) body += '\n你作品集里之前做的那件--也讲讲。';
    } else if (body.indexOf('@@THESIS_INTERVIEW@@') >= 0){
      const dir = S.titleDir || '';
      const ipool = (ENDING_TEXT.ui && ENDING_TEXT.ui.interviewDir && ENDING_TEXT.ui.interviewDir[dir]) || null;
      if (ipool && ipool.length){
        body = UI('interviewDir.' + dir, { t: S.title || '' }, ipool[0]);
      } else {
        body = S.title
          ? '面试官翻到你简历最后一行：\n「《' + S.title + '》--这个讲讲？」'
          : '面试官翻到你简历最后一行：\n「这个--你讲讲？」';
      }
      const nw = namedWork(S.title || '');        // 作品 0 件 → 不出现
      if (nw) body += '\n「之前作品集里那件--这件也讲讲？」';
    }
    // 图签行（纯文字）：把这一屏的坐标交代清楚，撑住版式，不再画线稿
    const stamp = 'Y Z - 0 1　　　' + roundName(S.round) +
                  (S.line && LINES[S.line] ? '　　　' + LINES[S.line].name : '') +
                  '　　　' + (S.works ? S.works.length : 0) + ' 件作品';
    return '<div class="ttl">' + c.name + '</div>' +
           '<div class="stamp">' + stamp + '</div>' +
           '<div class="txt">' + body.replace(/\n/g,'<br>') + '</div>';

  function renderCourseDraw(grade, onDone){

    //   「（立不起来，说什么都白搭，这一关紧一点）这种括号说明是什么生硬手法」。
    //   现在只上屏题名与题签两行（场地/要求）；「这关紧」由评图台词与数值传达。
    const paint = function(){
      el('tTitle').textContent = courseLabel(cur);

      S.coursePick[grade] = { name: cur.name, area: cur.area || '', sign: (cur.sign || []).slice(),
                              point: cur.point || '', src: cur.src || '' };

  // ---- 座位平面图：在图上挑位置 ----
  function renderSeat(c, v){

          ? '<span class="seat void"></span>'

      '</div>';
    Array.prototype.forEach.call(el('stage').querySelectorAll('.seat[data-r]'), function(b){
      b.onclick = function(){
        const res = c.pick(+b.dataset.r, +b.dataset.c);
        log('· 你坐了' + res.t);
        if (res.r){ log('　' + res.r); S.memories.push({ tile: c.name, text: res.r }); }
        S._skillSrc = c.name; S._skillPlace = c.scene || ''; apply(res.eff || {});
