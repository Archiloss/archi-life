<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营造大亨 v0.1</title>
<style>
html{ zoom:1.25; }
  :root{
    --bg:#1a1a1a; --panel:#202020; --chrome:#2e2e2e; --line:#3a3a3a; --grid:#242424;
    --ink:#dcdcdc; --white:#fff; --dim:#8a8a8a; --dim2:#5f5f5f;
    --cyan:#35d6e8; --yellow:#ffd93d; --red:#ff5f5f; --green:#4ade80; --magenta:#e879f9; --orange:#ffb020;
    /* 结构线 / 强调色 / 次级墨：三处被引用但一直没定义（分隔线整条不渲染），这里补齐（2026-09-12） */
    --line-c:#4a4a4a; --accent:#35d6e8; --ink2:#b0b0b0;
        /* 结构色（换肤时整组替换） */
    --body-bg:#0f0f0f; --hud-bg:#141414; --box-bg:#232323;
    --edge:#3d3d3d; --edge2:#4a4a4a; --sunken:#1f1f1f; --head-bg:#1c1c1c;
    /* 换肤敏感 token：以前是硬编码深色，浅皮会贴成黑板；统一走变量，浅皮整组覆盖 */
    --seat-bg:#1e1e1e; --seat-ink:#4a4a4a; --seat-hov:#22302f;
    --opt-hov:#26302f;
    --opt-chosen-bg:#243032; --opt-chosen-ink:#fff;
    --cell-done-bg:#242424; --cell-done-ink:#676767; --cell-here-bg:#243032;
    --grp-line:#242424;
    --chip-up-bg:#182620; --chip-dn-bg:#261818;
    --k-line:#5a5a5a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--body-bg);color:var(--ink);font-family:var(--mono);
       font-size:13px;-webkit-font-smoothing:antialiased;padding:14px;
       cursor:var(--cursor, crosshair);display:flex;}

  /* ---- 十字光标（跟随鼠标，CAD 的命根子动作）---- */
  .crosshair{position:fixed;inset:0;pointer-events:none;z-index:999;display:none;}
  .crosshair.on{display:block;}
  .crosshair .h,.crosshair .v{position:absolute;background:rgba(150,150,150,.5);}
  .crosshair .h{left:0;right:0;height:1px;}
  .crosshair .v{top:0;bottom:0;width:1px;}
  .crosshair .pick{
    position:absolute;width:11px;height:11px;
    border:1px solid rgba(180,180,180,.85);
    transform:translate(-50%,-50%);
  }
  .app{max-width:min(1080px, calc(100vw / 1.25));margin:0 auto;background:var(--bg);border:1px solid #000;
       box-shadow:0 10px 40px rgba(0,0,0,.7);display:flex;flex-direction:column;
       flex:1;min-height:0;}

  .titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px;
            padding:0 12px;height:28px;background:var(--chrome);
            border-bottom:1px solid var(--line);font-size:11.5px;}
  .titlebar .fn{color:var(--dim);}
  .titlebar .w{display:flex;gap:14px;color:var(--dim2);font-size:11px;}

  .menubar{display:flex;gap:0;background:var(--chrome);border-bottom:1px solid var(--line);
           height:26px;align-items:center;padding:0 4px;font-size:11.5px;overflow:hidden;}
  .menubar b{font-weight:400;padding:4px 9px;color:var(--ink);white-space:nowrap;}

  .hud{display:flex;align-items:center;gap:0;background:var(--hud-bg);
       border-bottom:1px solid var(--line);height:34px;overflow:hidden;}
  .hud .st{display:flex;align-items:center;gap:7px;padding:0 15px;height:100%;
           border-right:1px solid var(--line);font-size:11.5px;color:var(--dim);white-space:nowrap;}
  .hud .st b{color:var(--white);font-weight:400;font-variant-numeric:tabular-nums;}
  .hud .st.sp{flex:1;justify-content:flex-end;border-right:0;color:var(--dim2);}


  /* ---- CAD 经典坐标轴（UCS 图标）---- */
  .ucs{position:absolute;left:16px;bottom:16px;pointer-events:none;z-index:5;
       font-size:9px;line-height:1;opacity:.85;}
  .ucs .ax{position:relative;width:34px;height:34px;}
  .ucs .ax i{position:absolute;background:var(--dim);}
  .ucs .ax i.x{left:0;bottom:3px;width:30px;height:1px;}
  .ucs .ax i.y{left:3px;bottom:0;width:1px;height:30px;}
  .ucs .ax i.xh{left:28px;bottom:1px;width:0;height:0;background:none;
    border-left:4px solid var(--dim);border-top:3px solid transparent;border-bottom:3px solid transparent;}
  .ucs .ax i.yh{left:1px;bottom:28px;width:0;height:0;background:none;
    border-bottom:4px solid var(--dim);border-left:3px solid transparent;border-right:3px solid transparent;}
  .ucs .ax em{position:absolute;font-style:normal;font-size:8.5px;color:var(--dim);}
  .ucs .ax em.ex{left:31px;bottom:-2px;}
  .ucs .ax em.ey{left:-1px;bottom:31px;}
  /* 左下角 UCS 图标是 AutoCAD 的规矩：别的软件不长这样
     · SketchUp 的绘图轴在模型原点交汇，不在屏幕角上
     · Rhino 另有自己的世界坐标轴图标（.raxe）
     · 手绘根本没有软件界面 */
  body.skin-su .ucs,
  body.skin-rhino .ucs,
  body.skin-sketch .ucs{display:none;}

  /* ---- 工作区 + 右侧面板 ---- */
  .main{display:grid;grid-template-columns:1fr 208px;flex:1;min-height:0;}
  .work{display:flex;flex-direction:column;min-width:0;min-height:0;}

  .side{background:var(--chrome);border-left:1px solid var(--line);overflow-y:auto;}
  .side h3{margin:0;padding:7px 10px;font-size:10px;font-weight:400;
           color:var(--dim2);letter-spacing:1.5px;background:var(--head-bg);
           border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .side h3:first-child{border-top:0;}
  .side .grp{padding:8px 10px;border-bottom:1px solid var(--grp-line);}
  .side .row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px;}
  .side .row .sw{width:9px;height:9px;flex:0 0 9px;border:1px solid rgba(0,0,0,.6);}
  .side .row .k{color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side .row .n{color:var(--ink);font-variant-numeric:tabular-nums;}
  .side .row .n.on{color:var(--white);}
  .side .row .n.off{color:var(--edge2);text-decoration:line-through;}
  .side .row .n b{color:var(--white);font-weight:400;}

  /* 图幅：一局的进度，一格一站（6 列） */
  .side .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px 10px;}
  .side .cell{aspect-ratio:1;border:1px solid var(--edge);background:var(--sunken);
              display:grid;place-items:center;font-size:8.5px;color:var(--dim2);
              font-variant-numeric:tabular-nums;}
  .side .cell.done{background:var(--cell-done-bg);color:var(--cell-done-ink);}
  .side .cell.here{border-color:var(--cyan);background:var(--cell-here-bg);color:var(--cyan);font-weight:700;}
  .side .cell.fork{border-color:var(--yellow);color:var(--yellow);}
  .side .cell.end{border-color:var(--magenta);color:var(--magenta);}

  /* ---- 底部状态栏（含实时坐标）---- */
  .status{display:flex;align-items:center;background:var(--chrome);
          border-top:1px solid var(--line);height:22px;font-size:10px;
          color:var(--dim2);overflow:hidden;}
  .status span{padding:0 11px;height:100%;display:flex;align-items:center;
               border-right:1px solid var(--line);white-space:nowrap;}
  .status span.act{color:var(--white);background:var(--line);}
  .status span.co{margin-left:auto;border-right:0;border-left:1px solid var(--line);
                  color:var(--dim);font-variant-numeric:tabular-nums;}

  .track{padding:16px 18px;background-color:var(--bg);
         background-image:linear-gradient(var(--grid) 1px,transparent 1px),
           linear-gradient(90deg,var(--grid) 1px,transparent 1px);
         background-size:22px 22px;border-bottom:1px solid var(--line);
         overflow-x:auto;}
  .nodes{display:flex;align-items:flex-start;gap:0;min-width:min-content;}
  .nd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 3px;}
  .nd .bx{width:34px;height:26px;border:1px solid var(--edge);background:var(--sunken);
          display:grid;place-items:center;font-size:9.5px;color:var(--dim2);}
  .nd .nm{font-size:9.5px;color:var(--dim2);white-space:nowrap;max-width:56px;
          overflow:hidden;text-overflow:ellipsis;text-align:center;}
  .nd.done .bx{background:var(--sunken);color:#6a6a6a;}
  .nd.here .bx{border-color:var(--cyan);background:var(--cell-here-bg);color:var(--cyan);font-weight:700;}
  .nd.here .nm{color:var(--cyan);}
  .nd.fork .bx{border-color:var(--yellow);color:var(--yellow);}
  .nd.end .bx{border-color:var(--magenta);color:var(--magenta);}
  .sep{padding:0 2px;color:var(--edge);align-self:center;margin-top:6px;font-size:10px;}

  /* 画布：绘图区 + 皮肤装饰层（装饰只盖绘图区，不盖命令行） */
  .canvas{position:relative;flex:1;min-height:0;display:flex;}
  .deco{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden;}
  .stage{padding:20px 18px;min-height:210px;display:flex;flex-direction:column;gap:14px;
         flex:1;min-height:0;overflow-y:auto;position:relative;
         background-color:var(--bg);
         background-image:linear-gradient(var(--grid) 1px,transparent 1px),
           linear-gradient(90deg,var(--grid) 1px,transparent 1px);
         background-size:22px 22px;}
  .stage .ttl{font-size:12px;color:var(--dim);letter-spacing:2px;}
  .stage .txt{font-size:15px;line-height:1.85;color:var(--white);white-space:pre-wrap;}
  .stage .txt .hot{color:var(--yellow);}
  .stage .txt .bk{color:var(--dim);}

  /* ---- 场景图：每一站该有它的样子 ---- */
  .scene{margin:0 0 12px;border:1px solid #2e2e2e;background:var(--sunken);overflow:hidden;}
  .scene svg{display:block;width:100%;height:auto;}

  /* ---- 座位平面图：在图上挑位置，不是在选项里挑 ---- */
  .seatwrap{margin:2px 0 10px;border:1px solid #2e2e2e;background:var(--hud-bg);padding:12px;}
  .seatwrap .board{font-size:10px;color:var(--dim2);letter-spacing:4px;text-align:center;
                   padding-bottom:8px;margin-bottom:10px;border-bottom:1px dashed #333;}
  .seatmap{display:grid;gap:6px;}
  .seat{aspect-ratio:2.3/1;border:1px solid var(--edge);background:var(--seat-bg);cursor:pointer;
        border-radius:1px;transition:border-color .1s,background .1s;position:relative;
        font-family:var(--mono);font-size:9px;color:var(--seat-ink);padding:0;}
  .seat:hover{border-color:var(--cyan);background:var(--seat-hov);color:var(--cyan);}
  .seat.void{border:none;background:transparent;cursor:default;}
  .seat .tagn{position:absolute;left:3px;top:2px;font-size:8px;color:#3f3f3f;}
  .seat:hover .tagn{color:var(--cyan);}

  /* ---- 推体块 ---- */
  .massbar{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0;align-items:center;}
  .massbar button{font-family:var(--mono);font-size:12.5px;padding:9px 14px;min-height:40px;
    background:var(--box-bg);color:var(--ink);border:1px solid var(--edge);border-radius:2px;cursor:pointer;}
  .massbar button:hover{border-color:var(--cyan);color:var(--cyan);}
  .massbar button:disabled{opacity:.3;cursor:not-allowed;border-color:#333;color:var(--dim2);}
  .massbar button.done{background:var(--cyan);color:var(--body-bg);border-color:var(--cyan);font-weight:700;}
  .massleft{font-size:11.5px;color:var(--dim);margin-top:9px;letter-spacing:.3px;}
  .massleft b{color:var(--yellow);font-weight:400;}
  .stage .picked{font-size:15px;color:var(--dim);line-height:1.9;
    opacity:0;animation:lnIn .34s ease-out forwards;animation-delay:.3s;}
  .stage .res{font-size:16px;color:var(--white);line-height:1.95;}
  .deltas{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px;}
  .chip{font-size:13.5px;padding:6px 12px;border:1px solid var(--line);
        border-radius:2px;font-variant-numeric:tabular-nums;letter-spacing:.3px;
        color:var(--dim);}
  .chip.up{color:var(--green);border-color:#2f5a48;background:var(--chip-up-bg);}
  .chip.dn{color:var(--red);border-color:#5a2f2f;background:var(--chip-dn-bg);}
  .chip.zero{color:var(--dim2);}
  @keyframes hudPulse{0%{color:var(--cyan);}100%{color:var(--white);}}
  .hud .st b.pulse{animation:hudPulse 1s ease-out;}
  .fill{display:flex;gap:10px;align-items:center;margin-top:2px;flex-wrap:wrap;}
  .fill input{
    flex:1;min-width:180px;
    background:var(--box-bg);border:1px solid var(--edge);border-radius:2px;
    color:var(--white);font-family:var(--mono);font-size:16px;
    padding:12px 14px;min-height:48px;
  }
  .fill input:focus{outline:none;border-color:var(--cyan);}
  .fill input::placeholder{color:#5f5f5f;}
  .warn{font-size:12px;color:var(--yellow);min-height:17px;margin-top:5px;}

  .opts{display:flex;flex-direction:column;gap:7px;margin-top:2px;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;min-height:44px;
       background:var(--box-bg);border:1px solid var(--edge);border-radius:2px;
       cursor:pointer;text-align:left;font-family:var(--mono);font-size:13px;
       color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover{border-color:var(--cyan);background:var(--opt-hov);}
  .opt .k{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;
          border:1px solid var(--k-line);font-size:10.5px;color:var(--dim);margin-top:1px;}
  .opt:hover .k{border-color:var(--cyan);color:var(--cyan);}
  /* 够不着的选项：看得见，点不了 */
  .opt.locked{opacity:.34;cursor:not-allowed;border-style:dashed;}
  .opt.locked:hover{border-color:var(--edge);background:var(--box-bg);}
  .opt.locked:hover .k{border-color:var(--k-line);color:var(--dim);}
  .opt.locked .cf{color:var(--yellow);}
  .opt.unlocked{border-color:var(--cyan);}
  /* 选择的那一刻：被选中的留下，其余退场 */
  .opt.chosen{border-color:var(--cyan);background:var(--opt-chosen-bg);color:var(--opt-chosen-ink);
              box-shadow:0 0 0 1px var(--cyan);}
  .opt.chosen .k{border-color:var(--cyan);color:var(--cyan);}
  .opt.faded{opacity:.15;transition:opacity .28s;}
  .opt{transition:border-color .12s,background .12s,opacity .28s,box-shadow .15s;}

  /* 结果逐行浮现，不是一坨字甩脸上 */
  /* 结果晚一步浮现——这个"停顿"以前是靠 setTimeout，现在纯 CSS，不会丢 */
  .stage .res span.ln{display:block;opacity:0;transform:translateY(4px);
    animation:lnIn .38s ease-out forwards;animation-delay:.42s;}
  .stage .res span.ln:nth-child(2){animation-delay:.55s;}
  .stage .res span.ln:nth-child(3){animation-delay:.68s;}
  .stage .res span.ln:nth-child(4){animation-delay:.81s;}
  @keyframes lnIn{to{opacity:1;transform:none;}}
  .deltas span.chip{opacity:0;animation:lnIn .3s ease-out forwards;animation-delay:.5s;}
  .deltas span.chip:nth-child(2){animation-delay:.62s;}
  .deltas span.chip:nth-child(3){animation-delay:.74s;}

  /* 数值飘字 */
  .float{position:fixed;pointer-events:none;z-index:1000;font-family:var(--mono);
    font-size:15px;font-weight:700;animation:floatUp 1.05s ease-out forwards;}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) scale(.9);}
    18%{opacity:1;transform:translateY(-6px) scale(1.06);}
    100%{opacity:0;transform:translateY(-34px) scale(1);}
  }
  .opt .t{flex:1;line-height:1.5;}
  .opt .cf{font-size:11px;color:var(--dim2);white-space:nowrap;margin-top:2px;}

  .big{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0;}
  .big .num{font-size:44px;color:var(--white);font-variant-numeric:tabular-nums;line-height:1;}
  .big .lbl{font-size:11px;color:var(--dim);letter-spacing:2px;}

  button.act{font-family:var(--mono);font-size:14px;letter-spacing:1px;padding:13px 34px;
             min-height:48px;background:var(--cyan);color:var(--body-bg);border:1px solid var(--cyan);
             border-radius:3px;cursor:pointer;font-weight:700;transition:filter .12s;}
  button.act:hover{filter:brightness(1.1);}
  button.act:disabled{background:#2e2e2e;border-color:var(--edge);color:var(--dim2);cursor:not-allowed;}

  .alloc{display:flex;flex-direction:column;gap:9px;}
  .arow{display:flex;align-items:center;gap:12px;}
  .arow .an{width:76px;font-size:12.5px;color:var(--ink);}
  .arow .ab{width:30px;height:30px;display:grid;place-items:center;background:#2a2a2a;
            border:1px solid var(--edge2);border-radius:2px;cursor:pointer;color:var(--ink);}
  .arow .ab:hover{border-color:var(--cyan);color:var(--cyan);}
  .arow .av{width:26px;text-align:center;font-size:14px;color:var(--white);font-variant-numeric:tabular-nums;}
  .arow .left{font-size:11px;color:var(--dim2);}

  .cmd{background:var(--hud-bg);border-top:1px solid var(--line);padding:9px 13px;
       font-size:11.5px;line-height:1.8;max-height:118px;overflow-y:auto;}
  .cmd .l{color:#8f8f8f;}
  .cmd .l .p{color:var(--dim2);}
  .cmd .l .up{color:var(--green);}
  .cmd .l .dn{color:var(--red);}
  .cmd .l .hl{color:var(--cyan);}
  .cmd .prompt{color:#cfcfcf;margin-top:5px;padding-top:5px;border-top:1px dashed #2e2e2e;}
  .cmd .prompt .p{color:var(--dim2);}
  .cmd .prompt .opts{color:var(--yellow);}
  /* 光标现在名副其实：敲 A/B/C/D 会先在前面回显，再执行 */
  .cmd .prompt .typed{color:var(--white);font-weight:700;}
  .cmd .prompt .cur{display:inline-block;width:7px;height:12px;background:var(--white);
                    vertical-align:-2px;animation:blink 1.05s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .ending{padding:26px 22px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:4;}
  /* 结局面板底部的「再来一局」常驻：窗口不高时（900/800 高）以前要滚到最底才看得见 */
  .ending .endbar{position:sticky;bottom:-26px;margin:6px 0 -26px;padding:10px 0 8px;
                  background:var(--bg);border-top:1px solid var(--line-c);}
  .ending .lab{font-size:11px;color:var(--dim);letter-spacing:3px;}
  .ending .big-t{font-size:24px;color:var(--ink);line-height:1.5;}
  .ending .body{font-size:14px;line-height:2;color:var(--ink);white-space:pre-wrap;}
  .ending .body .hot{color:var(--yellow);}
  .ending .body .dim{color:var(--dim);}

  /* 窄屏：收掉右侧面板，数值回到顶部横条 */
  @media (max-width:819px){
    .main{grid-template-columns:1fr;}
    .side{display:none;}
    /* 窄屏时 HUD 数值贴菜单栏下面：飘字收短，别蹿上菜单 */
    @keyframes floatUp{
      0%{opacity:0;transform:translateY(0) scale(.9);}
      18%{opacity:1;transform:translateY(-2px) scale(1.04);}
      100%{opacity:0;transform:translateY(-12px) scale(1);}
    }
  }
  /* 宽屏：顶部横条不再重复数值，交给右侧面板 */
  @media (min-width:820px){
    .hud .st.num{display:none;}
  }

  @media (max-width:700px){
    body{padding:8px;font-size:12.5px;}
    .hud .st{padding:0 10px;font-size:11px;}
    .stage{padding:16px 13px;min-height:180px;}
    .stage .txt{font-size:14px;}
    .track{padding:12px;}
  }


/* ============================================================
   皮肤：整组替换上面的颜色变量。用 body 上的 class 切换。
   判定写在 game.js 的 skinsOf(S) 里——皮肤不是奖品，
   是"你这辈子是怎么过的"的视觉总结。
   ============================================================ */

/* ---- SU：蓝天 + 灰地面 + 三色轴（官方界面：无网格、地平线在约 40%）---- */
body.skin-su{
  --body-bg:#d4d4d4; --bg:#efefef; --panel:#e6e6e6; --chrome:#d8d8d8;
  --line:#bdbdbd; --grid:#e4e4e4;
  --ink:#2b2b2b; --white:#131313; --dim:#6c6c6c; --dim2:#909090;
  --hud-bg:#e2e2e2; --box-bg:#eaeaea; --edge:#b4b4b4; --edge2:#cacaca;
  --sunken:#e0e0e0; --head-bg:#dadada;

  --line-c:#a8a8a8; --accent:#14688f; --ink2:#4a4a4a;

  --seat-bg:#f7f7f7; --seat-ink:#4a4a4a; --seat-hov:#d9eef5;
  --opt-hov:#dff0f7; --opt-chosen-bg:#cfe9f4; --opt-chosen-ink:#0c2c3a;

/* 绘图区＝SU 的天空与地面（地平线 40%，上蓝下灰，无网格） */
body.skin-su .stage{
  background-color:#b8b8b8;
  background-image:linear-gradient(#4a90d9 0%, #7db8e8 26%, #b9dcf2 39.6%, #b8b8b8 40%);
  background-size:auto;
}
/* SU 的三色绘图轴：红 X 向右下、绿 Y 向右上、蓝 Z 竖直（虚线） */
body.skin-su .deco .saxe{position:absolute;inset:0;pointer-events:none;opacity:.75;}
body.skin-su .deco .saxe i{position:absolute;}
body.skin-su .deco .saxe i.ax{left:34%;bottom:26%;width:22%;height:1.5px;background:#c0392b;transform:rotate(9deg);transform-origin:0 50%;}
body.skin-su .deco .saxe i.ay{left:34%;bottom:26%;width:19%;height:1.5px;background:#3f9b3f;transform:rotate(-11deg);transform-origin:0 50%;}
body.skin-su .deco .saxe i.az{left:34%;bottom:26%;width:0;height:30%;border-left:1.5px dashed #2f6fb0;}
/* SU 的默认比例人（就在原点旁边站着） */
body.skin-su .deco .sdana{position:absolute;left:14%;bottom:9%;pointer-events:none;opacity:.9;}
body.skin-su .deco .sdana svg{display:block;width:26px;height:auto;}
/* SU 的绘图区＝天空（这是 SU 唯一蓝的地方） */
body.skin-su .stage{
  background-color:#cfe3f2;
  background-image:linear-gradient(#a9cbe8 0%, #cfe3f2 46%, #dceaf6 100%);
  background-size:auto;
}
/* 地平线：天空下面压一条地面灰 */
body.skin-su .stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:min(26%,150px);
  background:linear-gradient(#cfcfcf,#c2c2c2);pointer-events:none;}

/* ---- 手绘：硫酸纸 + 针管笔 ---- */
body.skin-sketch{
  --body-bg:#cfc7b6; --bg:#f4f0e6; --panel:#eee9dd; --chrome:#ddd6c6;
  --line:#c4bba8; --grid:#e8e2d4;
  --ink:#39352c; --white:#1a1712; --dim:#7d7666; --dim2:#a8a091;
  --hud-bg:#ebe5d8; --box-bg:#f0ebe0; --edge:#bfb6a3; --edge2:#d2c9b7;
  --sunken:#e9e3d5; --head-bg:#e3dccd;
  --cyan:#1f5f8b; --yellow:#8a6410; --red:#a33a2a; --green:#3d6b34; --magenta:#7a3a7a; --orange:#a87415;
  --line-c:#b3a992; --accent:#1f5f8b; --ink2:#4d4838;
  /* 换肤敏感 token：浅底深字（硫酸纸） */
  --seat-bg:#f4efe2; --seat-ink:#4d4838; --seat-hov:#e7e0cc;
  --opt-hov:#eee7d4; --opt-chosen-bg:#e2e8cf; --opt-chosen-ink:#20221a;
  --cell-done-bg:#ddd6c2; --cell-done-ink:#4f4a3a; --cell-here-bg:#dde5cd;
  --grp-line:#c9c1ab; --chip-up-bg:#e3ead6; --chip-dn-bg:#f0dfd4; --k-line:#a89f8b;
}
/* 手绘：硫酸纸（无 CAD 网格；两层极淡噪点模拟纸张纤维，纯 CSS 不上图） */
body.skin-sketch .stage{
  background-color:#f4f0e6;
  background-image:
    radial-gradient(rgba(110,100,70,.07) 1px,transparent 1px),
    radial-gradient(rgba(110,100,70,.05) 1px,transparent 1px);
  background-size:9px 9px, 15px 15px;
  background-position:0 0, 4px 7px;
}

/* ---- Rhino：中灰工作视窗 + 更亮的浅灰面板（官方默认）---- */
body.skin-rhino{
  --body-bg:#8f8f8f; --bg:#a0a0a0; --panel:#e2e2e2; --chrome:#d6d6d6;
  --line:#8a8a8a; --grid:#969696;
  --ink:#2f2f2f; --white:#1a1a1a; --dim:#5a5a5a; --dim2:#787878;
  --hud-bg:#dcdcdc; --box-bg:#e6e6e6; --edge:#a8a8a8; --edge2:#bebebe;
  --sunken:#b0b0b0; --head-bg:#d2d2d2;
  --cyan:#0e6ba8; --yellow:#8a6410; --red:#a82f28; --green:#2c6b3f; --magenta:#763a8e; --orange:#c67a1e;
  --line-c:#6f6f6f; --accent:#0e6ba8; --ink2:#2f2f2f;
  /* 换肤敏感 token：浅底深字（Rhino 亮面板） */
  --seat-bg:#ececec; --seat-ink:#333333; --seat-hov:#d9e8f2;
  --opt-hov:#deeaf2; --opt-chosen-bg:#cfe4f2; --opt-chosen-ink:#10283a;
  --cell-done-bg:#cfcfcf; --cell-done-ink:#333333; --cell-here-bg:#cfe4f2;
  --grp-line:#bdbdbd; --chip-up-bg:#dceade; --chip-dn-bg:#efd9d5; --k-line:#afafaf;
}
/* Rhino 的浅灰面板上，正文数字/图层关/排程主项用深墨——别用那组发灰的 --ink/--white */
body.skin-rhino .side .row .n{color:#1f1f1f;}
body.skin-rhino .side .row .n.on{color:#131313;}
body.skin-rhino .side .row .n.off{color:#6a6a6a;}
body.skin-rhino .side .row .n b{color:#131313;}
body.skin-rhino .side .cell{color:#3a3a3a;}
body.skin-rhino .place .nm{color:#1c1c1c;}
/* 视窗内的构造平面网格（Rhino 的标志：视窗有网格，面板没有） */
body.skin-rhino .stage{
  background-color:#a0a0a0;
  background-image:linear-gradient(#8f8f8f 1px,transparent 1px),
    linear-gradient(90deg,#8f8f8f 1px,transparent 1px),
    linear-gradient(#9a9a9a 1px,transparent 1px),
    linear-gradient(90deg,#9a9a9a 1px,transparent 1px);
  background-size:96px 96px,96px 96px,12px 12px,12px 12px;
}
/* 视窗标题（左上角蓝色小标签，Rhino 每个视窗都有） */
body.skin-rhino .stage::before{
  content:'Perspective';position:absolute;left:0;top:0;
  background:#3d7ebf;color:#fff;font-size:9px;padding:1px 7px 2px;pointer-events:none;
}
/* 世界坐标轴图标（左下角三叉） */
body.skin-rhino .deco .raxe{position:absolute;left:14px;bottom:14px;pointer-events:none;opacity:.9;}
/* Rhino 的文字在灰底上要深色 */
body.skin-rhino .stage .ttl,
body.skin-rhino .stage .txt{color:#1c1c1c;}
body.skin-rhino .stage .txt .bk{color:#4a4a4a;}

/* ---- 光标：跟着皮肤换。CAD 是十字拾取，SU/Rhino 默认都是箭头 ---- */
:root{
  /* 手绘：铅笔（内联 SVG，不依赖外部图片） */
  --cursor-pencil:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><path d='M3 21l1.5-4.5L17 4l3 3L7.5 19.5 3 21z' fill='%23f4f0e6' stroke='%23383530' stroke-width='1.2' stroke-linejoin='round'/><path d='M15.5 5.5l3 3' stroke='%23383530' stroke-width='1.2'/></svg>") 3 21, auto;
}
body.skin-su   { --cursor: default; }
body.skin-rhino{ --cursor: default; }
body.skin-sketch{ --cursor: var(--cursor-pencil); }

/* 十字线跟随机：只有 CAD 需要（SU/Rhino 是箭头，手绘是铅笔） */
body.skin-su .crosshair,
body.skin-rhino .crosshair,
body.skin-sketch .crosshair{ display:none !important; }

/* 拾取框颜色也跟着皮肤走 */
body.skin-su .crosshair .pick,
body.skin-rhino .crosshair .pick{ border-color:var(--dim2); }

  /* 状态栏里各软件特有的元素 */
  .status span.tip{flex:1;color:var(--dim);border-right:0;font-size:9.5px;}
  .status span.meas{margin-left:auto;border-right:0;border-left:1px solid var(--line);
    background:var(--sunken);color:var(--ink);min-width:170px;justify-content:flex-start;}
  .status span.co2{margin-left:auto;border-right:0;border-left:1px solid var(--line);
    color:var(--ink);font-variant-numeric:tabular-nums;}

  /* ---- v2 排程：一学期挑 2 个去处 ---- */
  .places{display:flex;flex-direction:column;gap:8px;margin-top:2px;position:relative;z-index:1;}
  .place{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;
         width:100%;text-align:left;font-family:var(--mono);font-size:14px;
         padding:14px 15px;background:var(--box-bg);color:var(--ink);
         border:1px solid var(--edge);border-radius:2px;cursor:pointer;
         transition:border-color .12s,background .12s;}
  .place:hover{border-color:var(--cyan);background:var(--sunken);}
  .place .k{width:18px;height:18px;display:grid;place-items:center;
            border:1px solid var(--edge2);font-size:10.5px;color:var(--dim);}
  .place .nm{color:var(--white);}
  .place .nt{grid-column:2;font-size:11px;color:var(--dim);margin-top:2px;}
  .place .cf{font-size:11px;color:var(--dim2);white-space:nowrap;text-align:right;}
  .place.used{opacity:.32;cursor:default;border-style:dashed;}
  .place.used:hover{border-color:var(--edge);}
  .place.locked{opacity:.42;cursor:not-allowed;}
  .place.locked .cf{color:var(--yellow);}

  /* 作品集：列名字，不是列数字 */
  .side .row .k.wk{color:var(--ink);font-size:10.5px;line-height:1.5;
                   white-space:normal;overflow:visible;text-overflow:clip;}

  /* ===== 结局：判词 ===== */
  .ending .claim{font-size:13px;line-height:1.9;color:var(--ink);margin-bottom:10px;}
  .ending .wlist{margin:0 0 12px 0;padding-left:2px;border-left:2px solid var(--line-c);}
  .ending .wlist .wl{font-size:12px;line-height:1.9;color:var(--ink2);padding-left:9px;letter-spacing:.2px;}
  .ending .hair{font-size:12px;line-height:1.9;color:var(--dim);margin-bottom:14px;}
  .ending .one{font-size:12px;line-height:1.9;color:var(--dim);font-style:italic;
               margin-bottom:0;padding-left:10px;border-left:2px solid var(--line);}
  .ending .verdict{font-size:16px;line-height:1.75;color:var(--ink);font-weight:600;
                   letter-spacing:.6px;margin:22px 0 20px;padding-top:16px;
                   border-top:1px solid var(--line-c);}

  /* ===== 结局·现场 ===== */
  .ending .scene-txt{font-size:15px;line-height:2.0;color:var(--ink);
                     letter-spacing:.4px;margin:12px 0 2px;
                     padding:10px 12px;border-left:2px solid var(--accent);
                     background:var(--panel);}

  /* 排程按钮里「可能遇到：通宵 · 模型」那行小字（M5） */
  .place .nt .ev{display:block;color:var(--dim2);font-size:10.5px;
                 margin-top:2px;letter-spacing:.3px;}

/* 对话流：新句淡入，旧句留在上方逐级变淡 */
.dlg{ display:flex; flex-direction:column; gap:6px; }
.dlg .ln{ line-height:1.55; transition:opacity .28s ease; }
.dlg .ln.fresh{ animation: dlgIn .38s ease; }
@keyframes dlgIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .dlg .ln.fresh{ animation:none; } }

/* 开场预设校名 chips */
.presets{ margin-top:14px; color:var(--dim); font-size:11px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.presets button.pre{ background:transparent; border:1px solid var(--line); color:var(--ink); font:inherit; font-size:12px; padding:3px 9px; border-radius:4px; cursor:pointer; opacity:.85; }
.presets button.pre:hover{ border-color:var(--accent); color:var(--accent); opacity:1; }

/* 排程学年/线路横幅 */
.yr{ font-family:var(--mono); letter-spacing:4px; font-size:13px; text-align:center;
     color:var(--accent); padding:7px 0 2px; margin-bottom:2px;
     border-top:1px solid var(--line-c); border-bottom:1px solid var(--line-c); }

  // ========== SU 白模：你这辈子做过的建筑，一栋一栋立着 ==========
  function suScene(count){
    const U = 30, COS = Math.cos(Math.PI/6), SIN = Math.sin(Math.PI/6);
    const VW = 620, VH = 150;
    const n = Math.max(1, Math.min(count, 7));

    // 每栋的体量：越往后越高（越做越大，也越费头发）
    const B = [];
    for (let i = 0; i < n; i++){
      const cols = 3;
      const gx = (i % cols) * 1.25 + Math.floor(i / cols) * 0.3;
      const gy = Math.floor(i / cols) * 1.25;
      const h = 0.8 + i * 0.28 + (i % 3) * 0.22;
      B.push({ gx: gx, gy: gy, w: 0.95, d: 0.95, h: h });
    }

    const P = function(x, y, z){
      return [ (x - y) * COS * U, ((x + y) * SIN - z) * U ];
    };
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    B.forEach(function(b){
      [[b.gx,b.gy],[b.gx+b.w,b.gy],[b.gx+b.w,b.gy+b.d],[b.gx,b.gy+b.d]].forEach(function(c){
        [0, b.h].forEach(function(z){
          const p = P(c[0], c[1], z);
          minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
          minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
        });
      });
    });
    const ox = (VW - (maxX - minX)) / 2 - minX;
    const oy = (VH - (maxY - minY)) / 2 - minY - 6;
    const pt = function(x, y, z){
      const p = P(x, y, z);
      return (p[0] + ox).toFixed(1) + ',' + (p[1] + oy).toFixed(1);
    };
    const poly = function(pts, fill, sw){
      return '<polygon points="' + pts + '" fill="' + fill + '" stroke="#1a1a1a" stroke-width="' + sw + '" stroke-linejoin="round"/>';
    };

    let s = '<svg viewBox="0 0 ' + VW + ' ' + VH + '" xmlns="http://www.w3.org/2000/svg">' +
            '<rect width="' + VW + '" height="' + VH + '" fill="#cfe3f2"/>';
    s += '<ellipse cx="' + (VW/2) + '" cy="' + (VH - 12) + '" rx="190" ry="14" fill="#000" opacity=".07"/>';

    B.slice().sort(function(a,b){ return (a.gx+a.gy)-(b.gx+b.gy); }).forEach(function(b){
      const x0=b.gx, x1=b.gx+b.w, y0=b.gy, y1=b.gy+b.d, h=b.h;
      s += poly([pt(x0,y1,0), pt(x0,y1,h), pt(x1,y1,h), pt(x1,y1,0)].join(' '), '#e9e9e9', 1.0);
      s += poly([pt(x1,y0,0), pt(x1,y0,h), pt(x1,y1,h), pt(x1,y1,0)].join(' '), '#d6d6d6', 1.0);
      s += poly([pt(x0,y0,h), pt(x1,y0,h), pt(x1,y1,h), pt(x0,y1,h)].join(' '), '#ffffff', 1.7);
    });
    s += '</svg>';
    return s;
  }

      x.className = 'pre'; x.textContent = s;

      pb.appendChild(x);
    });

    // 校名是后面所有文案的主语，太潦草会毁掉代入感
    const bad = function(v){
      if (v.length < 2) return '学校名没这么短。';
      if (!/[\u4e00-\u9fa5A-Za-z]/.test(v)) return '这不是学校名。';
      if (/^([\u4e00-\u9fa5A-Za-z])\1+$/.test(v)) return '这不是学校名。';
      return '';
    };

    const go = function(){
      const raw = cleanInput(el('schoolInput').value);
      if (raw){
        const msg = bad(raw);
        if (msg){ el('warn').textContent = msg; el('schoolInput').focus(); return; }
      }
      const v = raw || '同济';
      el('warn').textContent = '';
      log('你在第一志愿栏写了「' + esc(v) + '」。', 'p');
      showWaiting(v, false);
    };
    el('okBtn').onclick = go;
    el('schoolInput').addEventListener('keydown', function(e){
      if (e.key === 'Enter') go();
    });
    el('schoolInput').focus();
  }

  function showWaiting(name, retry){
    el('stage').innerHTML =
      '<div class="ttl">' + (retry ? '复 读 一 年' : '等 通 知 书') + '</div>' +
      '<div class="txt">' +
        (retry
          ? '你复读了一年。\n第二次高考，还是 ' + S.score + ' 分。'
          : '你的分数 ' + S.score + '。\n录取线每年都不一样，谁也说不准。') +
        '\n\n报纸上说，今年报的人比去年多。' +
      '</div>' +
      '<div class="big"><button class="act" id="rollBtn">投 骰 子</button></div>';
    el('rollBtn').onclick = function(){ rollAdmit(name, retry); };
  }

  function rollAdmit(name, retry){
    const n = 1 + Math.floor(Math.random() * 4);
    // 录取线每年都在变。骰子决定今年线比你的分高还是低，差多少是随机的
    const gap  = 3 + Math.floor(Math.random() * 18);              // 差 3~20 分
    const line = (n >= 3) ? S.score - gap : S.score + gap;
    const last = S.score - 22 + Math.floor(Math.random() * 44);    // 去年的线
    log('掷出 <span class="hl">' + n + '</span>。');

    if (n >= 3){
      S.school = name;
      log('那年' + esc(name) + '的录取线是 ' + line + ' 分。', '');
      el('stage').innerHTML =
        '<div class="ttl">录 取</div>' +
        '<div class="txt">那年' + esc(name) + '的录取线是 ' + line + ' 分。\n你考了 ' + S.score +
          ' 分，多了 ' + (S.score - line) + ' 分。\n\n你被录取了。</div>' +
        '<div class="big"><button class="act" id="go">开 学</button></div>';
      el('go').onclick = function(){
        apply({ skill:2, hair:-8 });
        log('你去了' + esc(name) + '。建筑学，五年制。');
        S.memories.push({ tile:'入学', text:'开学第一周，你发现自己不是班里画得最好的那个。' });
        S.school = name;
        beginRound();                      // ← 进第一回合
      };
      return;
    }

    // 滑档
    const d = line - S.score;
    log('那年' + esc(name) + '的录取线是 ' + line + ' 分，你差 ' + d + ' 分。', '');

    if (!retry){
      el('stage').innerHTML =
        '<div class="ttl">录 取 线 出 来 了</div>' +
        '<div class="txt">那年' + esc(name) + '的录取线是 ' + line + ' 分。\n' +
          '你差了 ' + d + ' 分。' + (d <= 5 ? '\n<span class="bk">就差这么点。</span>' : (d >= 15 ? '\n<span class="bk">差得挺远的。</span>' : '')) + '\n\n' +
          '<span class="bk">（前一年是 ' + last + ' 分。没人知道为什么涨了这么多。）</span>\n\n' +
          '你被第二志愿录取了。\n<span class="bk">（你当时随便填的那一所。）</span></div>' +
        '<div class="opts" id="opts"></div>';
      const box = el('opts');
      [
        { k:'去上',  fn:function(){ settleAdjust(false); } },
        { k:'复读一年', fn:function(){ apply({hair:-5}); S.school='__wait__'; log('你决定复读。头发 -5。'); showWaiting(name, true); } }
      ].forEach(function(o, i){
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                      '<span class="t">' + o.k + '</span>';
        b.onclick = o.fn;
        box.appendChild(b);
      });
      return;
    }

    // 复读之后还是没上
    settleAdjust(true);
  }

  function settleAdjust(again){
    S.school = '调剂';
    log('你去了第二志愿那所学校。');

  // ========== 结局 1 · 新生 ==========
  // ===== 彩蛋：不报建筑 → 随机三种「另一种人生」 =====
  // 共有的刺朝外：土木互嘲 / 划掉的那栏 / 眼睛被训练过
  const EGG = [

  // ========== 工具 ==========
  function el(id){ return document.getElementById(id); }

  // 转义用户输入：学校名会拼进 HTML，必须挡掉标签与脚本
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 清洗输入：去控制字符、去首尾空白、限长（maxlength 可被绕过，这里兜底）
  function cleanInput(s){
    return String(s == null ? '' : s)
      .replace(/[\u0000-\u001F\u007F]/g, '')
      .trim()
      .slice(0, 14);
  }
  function log(t, cls){
    const c = el('cmd');
    const d = document.createElement('div');
    d.className = 'l ' + (cls||'');
    d.innerHTML = t;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
  }
  // 数值门槛：技能/作品/头发够不够，决定有些事你做不做得成
  function meetNeed(n){
    if (n.skill && S.skill < n.skill) return false;
    if (n.work && S.works.length < n.work)  return false;   // 作品只有一个真源：作品集条数
    if (n.hair  && S.hair  < n.hair)  return false;
    return true;
  }
  function needText(n){
    const out = [];
    if (n.skill) out.push('技能 ' + n.skill);
    if (n.work)  out.push('作品 ' + n.work);
    if (n.hair)  out.push('头发 ' + n.hair + '%');
    return out.join(' · ');
  }

  function delta(eff){    const parts = [];
    if (eff.work)  parts.push('作品 '  + (eff.work>0?'+':'')  + eff.work);
    if (eff.skill) parts.push('技能 '  + (eff.skill>0?'+':'') + eff.skill);
    if (eff.hair)  parts.push('头发 '  + (eff.hair>0?'+':'')  + eff.hair + '%');
    return parts.join('　');
  }
  // 作品统一入口：竞赛/毕设/事件卡做了东西，就命名、进作品集（单一真源）
  function makeWork(){
    const nm = workName();
    S.works.push({ name: nm, from: S._cardName || '做过的一个方案', round: S.round });
    S.work = S.works.length;
    return nm;
  }

  function apply(eff){
    const d = [];
    if (eff.work){
      if (eff.work > 0){ makeWork(); d.push(['作品', 1]); }                       // 做出作品→进作品集
      else if (S.works.length){ S.works.pop(); S.work = S.works.length; d.push(['作品', eff.work]); }
    }
    if (eff.skill){ S.skill += eff.skill; d.push(['技能', eff.skill]); }
    if (eff.hair){  S.hair  += eff.hair;  d.push(['头发', eff.hair]); }
    if (S.hair > 100) S.hair = 100;
    if (S.hair < 0) S.hair = 0;
    if (S.skill < 0) S.skill = 0;
    renderHUD();
    // 让 HUD 上变动的数字闪一下，并飘出来——别让它悄悄跳过去
    const MAP = { '作品':'hWork', '技能':'hSkill', '头发':'hHair' };
    const MAPW = { '作品':'sWork', '技能':'sSkill', '头发':'sHair' };   // 宽屏时数值在右侧面板
    const wide = window.matchMedia('(min-width:820px)').matches;
    d.forEach(function(x){
      const node = el(wide ? (MAPW[x[0]] || MAP[x[0]]) : (MAP[x[0]] || MAPW[x[0]]));
      if (!node) return;
      node.classList.remove('pulse'); void node.offsetWidth; node.classList.add('pulse');
      const r = node.getBoundingClientRect();
      const f = document.createElement('div');
      f.className = 'float';
      f.textContent = x[0] + ' ' + (x[1] > 0 ? '+' : '') + x[1] + (x[0] === '头发' ? '%' : '');
      f.style.color = x[1] > 0 ? 'var(--green)' : 'var(--red)';
      // fixed 定位的坐标会被 html 上的 zoom 再乘一次（默认 1.25）：
      // 1440 宽的屏上飘字会落到 x≈1723，整块飘出视口。先除掉 zoom 还原。
      const z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
      f.style.left = ((r.left + r.width / 2) / z) + 'px';
      f.style.top = ((r.top - 2) / z) + 'px';
      f.style.transform = 'translateX(-50%)';
      document.body.appendChild(f);
      setTimeout(function(){ f.remove(); }, 1200);
    });
    if (d.length){
      log(d.map(function(x){
        return x[0] + ' ' + (x[1]>0?'<span class="up">+'+x[1]+'</span>':'<span class="dn">'+x[1]+'</span>');
      }).join('　'), '');
    }
  }


  // ========== 键盘：在命令行敲字母选选项（CAD 就是这样的）==========
  // 敲 A/B/C/D 选中对应项，回车＝第一项。敲错了在命令行留一行回显。
  function cmdOptions(){
    // 事件卡收 .opt，排程屏收 .place（M5：命令行是全局入口，排程也能敲字母选）
    // 返回的是「按钮 + 它自己印的字母」：字母必须取按钮上印的那个，
    // 不能拿过滤后的下标当字母——排程屏第一个去处去过之后，敲 B 会发动第 3 个去处（2026-09-12 修）
    return Array.prototype.slice.call(document.querySelectorAll('.opt, .place'))
      .filter(function(b){
        return !b.classList.contains('locked') && !b.classList.contains('used') && !b.disabled;
      })
      .map(function(b){
        const kEl = b.querySelector('.k');
        return { el: b, k: kEl ? String(kEl.textContent || '').trim().toUpperCase() : '' };
      });
  }
  function cmdEcho(txt){
    const t = el('typed');
    if (t) t.textContent = txt;
  }
  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;   // 填学校名时别抢键
    // 报志愿屏：这一屏的主操作是「填志愿」，唯一那个按钮是彩蛋「不报建筑」。
    // 以前——没聚焦输入框时敲回车＝点第一个选项＝直接进结局 1，玩家一脸懵地被不报建筑了。
    if (el('schoolInput')){
      const ks = String(e.key || '').toUpperCase();
      if (e.key === 'Enter' || e.key === ' ' || ks === 'A'){
        e.preventDefault(); const ok = el('okBtn'); if (ok) ok.click(); return;
      }
      if (ks === 'B'){
        e.preventDefault(); const nb = document.querySelector('#opts .opt'); if (nb) nb.click(); return;
      }
      return;
    }
    if (S._dlg){ if (e.key === ' ' || e.key === 'Enter' || (e.key||'').toUpperCase()==='SPACEBAR') dlgNext(); return; }
    const opts = cmdOptions();
    if (!opts.length) return;

    const k = (e.key || '').toUpperCase();

    if (k.length === 1 && 'ABCDEF'.indexOf(k) >= 0){
      e.preventDefault();
      cmdEcho(k);
      const hit = opts.filter(function(o){ return o.k === k; })[0];
      if (hit) hit.el.click();
      else { log('没有 ' + k + ' 这一项。', ''); cmdEcho(''); }
      return;
    }
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      cmdEcho('⏎');
      opts[0].el.click();
      return;
    }
    if (e.key === 'Backspace'){ cmdEcho(''); return; }
  });

  // ========== 底部状态栏：每个软件都不一样 ==========

  const STATUS = {

        '<span>极轴</span><span class="co" id="coords">0.0000, 0.0000, 0.0000</span>',

  // ========== 皮肤装饰：SU 的三色轴+比例人、Rhino 的世界轴 ==========
  // 都塞进 .stage 的背景层（每站重渲染时跟着重注入），不挡内容
  const SU_DANA =
    '<svg viewBox="0 0 30 68" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="15" cy="6.5" r="5.2" fill="#e3c49b"/>' +

  const DECO = {
    su:    '<div class="saxe"><i class="ax"></i><i class="ay"></i><i class="az"></i></div>' +

  function decoOf(){

  // ========== 皮肤：结局揭晓，它是"你这辈子怎么过的"视觉总结 ==========
  // 不是攒够技能解锁的奖品——是走到哪、留下什么，界面就长成什么样
  function skinOf(s){
    if (s.line === 'leave')            return 'rhino';   // 转行＝换了软件
    if (s.work >= 4)                   return 'su';      // 做出来的东西多＝建模的人
    if (s.skill >= 18 && s.work <= 1)  return 'sketch';  // 一直在画、没留下东西＝手绘的人
    return '';                                            // 默认：CAD 施工图
  }
  const SKIN_NAME = { '':'CAD', su:'SU', sketch:'手绘', rhino:'Rhino' };
    // 外壳（标题文件名 + 菜单栏）跟着皮肤走，避免 SU 界面露 .dwg 的破绽（M8c）
  const SHELL_FILE = { '':'YZ-2026.dwg', 'su':'庭院小筑.skp', 'rhino':'方案_第三轮.3dm', 'sketch':'1:100 · A1 硫酸纸' };
  const SHELL_MENU = {
    '':       ['文件','编辑','视图','插入','格式','工具','绘图','标注'],
    'su':     ['文件','编辑','视图','相机','绘图','工具','窗口','帮助'],
    'rhino':  ['文件','编辑','视图','曲线','曲面','实体','网格','工具','分析','渲染'],
    'sketch': ['描','淡','虚','收','排','注','HB · 0.1']
  };
  function applySkin(name){
    document.body.classList.remove('skin-su','skin-sketch','skin-rhino');
    if (name) document.body.classList.add('skin-' + name);
    const fn = document.querySelector('.titlebar .fn');
    if (fn) fn.textContent = '\u2014 [ ' + (SHELL_FILE[name] || 'YZ-2026.dwg') + ' ]';
    const mb = document.querySelector('.menubar');
    if (mb) mb.innerHTML = (SHELL_MENU[name] || SHELL_MENU['']).map(function(m){ return '<b>' + m + '</b>'; }).join('');

  function renderHUD(){
    el('hWork').textContent  = S.work;

    el('hHair').textContent  = S.hair + '%';

                             : (S.line ? LINES[S.line].now : '建筑学在读');

  // ========== 右侧面板：图层 / 特性 / 图签 ==========
  function renderSide(){
    const side = el('side');
    if (!side) return;

    // 图层：四条线就是四个图层。走过的那条"开"，其余"关"
    let ly = '<div class="row"><span class="sw" style="background:#8a8a8a"></span>' +
             '<span class="k">你</span><span class="n on">开</span></div>';
    Object.keys(LINES).forEach(function(k){
      const L = LINES[k], on = (S.line === k);
      ly += '<div class="row">' +
            '<span class="sw" style="background:' + (on ? L.color : '#3a3a3a') + '"></span>' +
            '<span class="k"' + (on ? ' style="color:' + L.color + '"' : '') + '>' + L.name + '</span>' +
            '<span class="n ' + (on ? 'on' : 'off') + '">' + (on ? '开' : '关') + '</span></div>';
    });

    const row = function(k, v){
      return '<div class="row"><span class="k">' + k + '</span><span class="n">' + v + '</span></div>';
    };

    // 图幅：v2 是 8 个回合。走过的变灰，当前高亮，最后一格是结局
    let figs = '';
    ROUNDS.forEach(function(R, i){
      const cls = (i < S.round ? 'done' : '') + (i === S.round ? ' here' : '')

  // ========== 命令行回显：进度也写进命令行，像 CAD 在等一个命令 ==========
  function showPrompt(title, opts){
    const cmd = el('cmd');
    if (!cmd) return;
    const old = cmd.querySelector('.prompt');
    if (old) old.remove();
    if (!opts || !opts.length) return;
    const list = opts.map(function(o, i){
      return String.fromCharCode(65 + i) + ' ' + (o.t || '').slice(0, 14);
    }).join(' / ');
    const d = document.createElement('div');
    d.className = 'prompt';
    d.innerHTML = '<span class="p">命令:</span> _' + esc(title) + ' ' +
                  '<span class="opts">[ ' + esc(list) + ' ]</span> ' +
                  '&lt;A&gt;: <span class="typed" id="typed"></span><span class="cur"></span>';
    cmd.appendChild(d);
    cmd.scrollTop = cmd.scrollHeight;
  }
  function clearPrompt(){
    const cmd = el('cmd');
    const old = cmd && cmd.querySelector('.prompt');
    if (old) old.remove();
  }

  // 进度条搬进侧边栏的「图幅」栏之后，这里只剩保持调用兼容
  function renderTrack(){
    renderSide();
  }

  // ========== 主流程 ==========
    // ============================================================
  //  渲染分派表
  //  以前：一个 if 链全堆在 startTile 里（加一种交互要动多处、OR 条件越堆越长）。
  //  现在：每种 form 一个函数，新交互只往 RENDERERS 里加一项。
  // ============================================================

  // 每站共用的底子：标题 + 场景线稿 + 正文（含占位符替换）
  function baseHTML(c, v){
    let body = v.text || '';      // 有些卡只写了 talk 演出、没写 text：缺了不该整屏崩掉（会锁死在这一屏）
    if (body.indexOf('@@THESIS@@') >= 0){
      const t = S.title || '';
      const mid = Math.floor(t.length / 2);
      const w = t ? t.slice(Math.max(0, mid - 2), mid + 2) : '建筑';
      body = '评委翻到你的图，停了一下。\n问："你这个题，『' + w + '』体现在哪？"';
    } else if (body.indexOf('@@THESIS_INTERVIEW@@') >= 0){
      body = '面试官翻到你简历最后一行：\n"《' + S.title + '》——这个讲讲？"';
    }
    const sn = v.scene || c.scene;
    return '<div class="ttl">' + c.name + '</div>' +
           (SCENES[sn] ? '<div class="scene">' + SCENES[sn] + '</div>' : '') +
           '<div class="txt">' + body.replace(/\n/g,'<br>') + '</div>';
  }

  // ---- 抽题（毕设）----
  function renderDraw(c, v){
    el('stage').innerHTML = baseHTML(c, v) +
      '<div class="big"><div class="lbl">你 抽 到 了</div>' +
      '<div class="num" id="rolledTitle" style="font-size:19px;line-height:1.6">…</div></div>' +
      '<div id="drawBtns"></div>';
    const t = drawTitle();
    S.title = t;
    el('rolledTitle').textContent = '《' + t + '》';
    const b = document.createElement('button');
    b.className = 'act'; b.textContent = '接 受';
    b.onclick = function(){
      log('你接受了《<span class="hl">' + t + '</span>》。');
      next();
    };
    el('drawBtns').appendChild(b);
  }

  // ---- 座位平面图：在图上挑位置 ----
  function renderSeat(c, v){
    let grid = '';
    for (let r = 0; r < c.rows; r++){
      for (let col = 0; col < c.cols; col++){
        grid += ((c.void || []).indexOf(r + ',' + col) >= 0)
          ? '<span class="seat void"></span>'
          : '<button class="seat" data-r="' + r + '" data-c="' + col + '"></button>';
      }
    }
    el('stage').innerHTML = baseHTML(c, v) +
      '<div class="seatwrap">' +
        '<div class="board">讲 台</div>' +
        '<div class="seatmap" style="grid-template-columns:repeat(' + c.cols + ',1fr)">' + grid + '</div>' +
      '</div>';
    Array.prototype.forEach.call(el('stage').querySelectorAll('.seat[data-r]'), function(b){
      b.onclick = function(){
        const res = c.pick(+b.dataset.r, +b.dataset.c);
        log('· 你坐了' + res.t);
        if (res.r){ log('　' + res.r); S.memories.push({ tile: c.name, text: res.r }); }
        apply(res.eff || {});
        showResult('你坐了' + res.t, res.r, res.eff || {});
      };
    });
  }

  // ---- 选项（choice / guess / fork / none 共用一套）----
  function renderChoices(c, v){
    el('stage').innerHTML = baseHTML(c, v) + '<div class="opts" id="opts"></div>';
    showPrompt(c.name, v.opts);
    const box = el('opts');
    (v.opts || []).forEach(function(o, i){
      const locked = o.need ? !meetNeed(o.need) : false;
      const b = document.createElement('button');
      b.className = 'opt' + (locked ? ' locked' : (o.need ? ' unlocked' : ''));
      const cf = locked ? ('需要 ' + needText(o.need)) : (o.eff ? delta(o.eff) : '');
      b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                    '<span class="t">' + o.t + '</span>' +
                    (cf ? '<span class="cf">' + cf + '</span>' : '');
      if (locked){ box.appendChild(b); return; }     // 看得见，点不了
      b.onclick = function(){
        // 先问「这一次算不算数」，再锁按钮（2026-09-12 修死屏：以前是先锁后判，
        // 被判掉的那次点击会把按钮全部 disable，这一屏就再没有出口了）
        if (!commitChoice(c, o)) return;
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){
          x.classList.add(x === b ? 'chosen' : 'faded');
          x.disabled = true;
        });
      };
      box.appendChild(b);
    });
  }

  const RENDERERS = {
    draw: renderDraw, seat: renderSeat,
    choice: renderChoices, guess: renderChoices, fork: renderChoices, none: renderChoices
  };

  // ========== 主流程 ==========
  // ====== 对话引擎：▶ 点一下/空格推进台词流 → ✦ 决定点(opts) ======
  function startTalk(card, doneFn){
    const list = card.talk || [];
    if (!list.length){ doneFn(); return; }
    S._dlg = { list: list, idx: 0, card: card, done: doneFn };
    bindDlgTap();
    renderTalk();
  }
  let _dlgTapBound = false;
  function bindDlgTap(){
    // 标志必须放在页面级：#stage 跨局都活着，监听器不移除；
    // 以前标志挂在每局重建的 S 上 → 第二局起每点一下推进两句、第四局四句（2026-09-12 修）
    if (_dlgTapBound) return;
    _dlgTapBound = true;
    el('stage').addEventListener('click', function(e){
      if (!S._dlg) return;
      if (e.target && e.target.closest && e.target.closest('.opt,.prompt,.deltas')) return;
      dlgNext();
    });
  }
  function talkBR(s){ return String(s).replace(/\n/g, '<br>'); }
  function renderTalk(){
    const tl = S._dlg;
    const who = (tl.card && (tl.card.dlgName || tl.card.name)) || '';
    const upto = tl.idx;
    const from = Math.max(0, upto - 4);                 // 最多显示最近 5 条
    const show = tl.list.slice(from, upto + 1);
    const grad = [0.28, 0.42, 0.58, 0.78, 1];           // 越旧越淡
    const base = grad.length - show.length;
    const html = show.map(function(s, i){
      const last = (i === show.length - 1);
      const o = last ? 1 : grad[base + i];
      return '<div class="ln' + (last ? ' fresh' : '') + '" style="opacity:' + o + '">' + talkBR(s) + '</div>';
    }).join('');
    el('stage').innerHTML =
      '<div class="ttl">' + esc(who) + '</div>' +
      '<div class="dlg">' + html + '</div>' +
      '<div class="dlgc">▸ 空格 / 点一下 继续</div>';
  }
  function dlgNext(){
    if (!S._dlg) return;
    const tl = S._dlg;
    tl.idx++;
    if (tl.idx >= tl.list.length){
      const done = tl.done; S._dlg = null; if (done) done();
    } else { renderTalk(); }
  }

  function startTile(cardId){

    S._optLocked = false;          // 新屏解锁（M7b）
    const id = cardId || S.pendingCard;
    const c = CARDS[id];
    if (!c) { afterCard(); return; }
    renderTrack(); renderHUD();
    clearPrompt();
    const dbox = el('deco');
    if (dbox) dbox.innerHTML = decoOf();
    el('stage').innerHTML = '';
    const v = (S.useAlt && c.alt) ? c.alt : c;
    if (v.talk && v.talk.length){
      if (v.noChoice){        // 纯演出：看完自动结算(v.eff)，没得选
        startTalk(v, function(){ apply(v.eff || {}); afterCard(); });
        return;
      }
      startTalk(v, function(){ (RENDERERS[c.form])(c, v); });
      return;
    }
    const renderer = RENDERERS[c.form];
    if (!renderer) throw new Error('未知卡片类型 form: ' + c.form);
    renderer(c, v);
  }


  // 真正执行一个选择（在"决定"的停顿之后）
  // 返回 true = 这次点击真的算数了；false = 被挡掉，界面必须保持可点（否则整屏锁死，无路可走）
  function commitChoice(c, o){
          if (S._optLocked) return false;       // 这一屏已结算过
          S._optLocked = true;
          S._cardName = c.name;
          apply(o.eff || {});
          log('· ' + o.t);
          if (o.r){
            log('　' + o.r);
            S.memories.push({ tile: c.name, text: o.r });
          }
          showResult(o.t, o.r, o.eff || {});
          return true;
  }

  // ========== 结果页：选完先看清发生了什么，再走下一步 ==========
  function showResult(pick, res, eff){
    const chips = [];
    if (eff.work)  chips.push(['作品', eff.work]);
    if (eff.skill) chips.push(['技能', eff.skill]);
    if (eff.hair)  chips.push(['头发', eff.hair]);

    let chipHTML = '';
    if (chips.length){
      chipHTML = '<div class="deltas">' + chips.map(function(c){
        const sign = c[1] > 0 ? '+' : '';
        return '<span class="chip ' + (c[1] > 0 ? 'up' : 'dn') + '">' +
               c[0] + ' ' + sign + c[1] + (c[0] === '头发' ? '%' : '') + '</span>';
      }).join('') + '</div>';
    } else {
      chipHTML = '<div class="deltas"><span class="chip zero">这一下没有立刻见效</span></div>';
    }

    el('stage').innerHTML =
      '<div class="ttl">你 选 了</div>' +
      '<div class="picked">' + esc(pick) + '</div>' +
      (res ? '<div class="res">' + esc(res).split('\n').map(function(l){
               return '<span class="ln">' + l + '</span>';
             }).join('') + '</div>' : '') +
      chipHTML +
      '<div class="big" style="padding-top:2px">' +
        '<button class="act" id="nextBtn">继 续</button>' +
      '</div>';
    el('nextBtn').onclick = next;
  }

  // ============================================================
  //  作品名：按真实竞赛获奖作品的路子写
  //  参考霍普杯 2025 实际获奖名——《老摊日记》《长亭外，铁道边》
  //  《呼吸的祭仪：光与烟雾的当代净化仪式》《边角新生，暮年新趣》
  //  《楼道里也会吹来想你的风》《涌现——后疫情时代大学生宿舍重塑》
  //  套路只有五种：概念＋长说明 / 冒号叠大词 / 化用旧句 / 四字对仗 / 大白话
  //  真正普通的是"XX社区活动中心"——那是招标公告，不是学生作品。
  // ============================================================
  const WN = {
    abstract: ['涌现','折叠','缝合','呼吸','生长','退让','漫游','失重','回声','留白','间隙',
               '重叠','转译','重构','切片','编织','渗透','漂浮','凝固','悬置','溶解','折叠'],
    site:     ['老城区','城中村','工业遗址','菜市场','旧厂房','筒子楼','老社区','半地下室',
               '屋顶','围墙','楼道','巷弄','街角','渡口','防空洞','天桥下','大院','老澡堂'],
    verb:     ['重塑','再生','更新','改造','激活','共生','再定义','重写','消解','延展','归位'],
    era:      ['后疫情时代','存量时代','屏幕时代','收缩城市','老龄社会','气候危机','县城','算法时代'],
    nounA:    ['祭仪','考古','地层','标本','纪念碑','遗言','招魂','解剖','测绘','田野'],
    nounB:    ['净化仪式','日常','地层','褶皱','残片','回声','切面','剖面','纪念物','织物'],
    oldLine:  ['长亭外','铁道边','春江花月','斜阳草树','寻常巷陌','山高水长','落花时节',
               '黄昏疏雨','斜风细雨','半亩方塘','苔痕上阶','众里寻他'],
    oldLine2: ['铁道边','旧巷口','老渡头','雨巷','梧桐道','晒台','檐下','天井','灶间','学堂'],
    flatA:    ['楼道里也会吹来','屋顶上晾着','巷子里还留着','窗台外挂着','操场边坐着','楼梯间藏着'],
    flatB:    ['想你的风','去年的雨','过期的信','我妈的竹竿','没人收的衣服','谁的旧课本','半截粉笔'],
    flatSolo: ['楼下那张桌子','一楼的灶间','这条街的下午','一块钱的场地','他们家的窗户','巷口那棵树'],
    b1:       ['边角','暮年','旧墙','老树','窄巷','矮屋','窗下','檐前'],
    b2:       ['新生','余温','回声','微光','晚照','余响','夕照','碎影']
  };
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function workName(){
    // 权重照真实获奖名单来：概念+破折号最多，大白话最少（少才惊艳）
    const r = Math.random();
    const k = r < 0.35 ? 0 : r < 0.60 ? 1 : r < 0.80 ? 3 : r < 0.92 ? 2 : 4;
    if (k === 0) return pick(WN.abstract) + '——' + pick(WN.era) + pick(WN.site) + pick(WN.verb);
    if (k === 1){
      // "地层的地层"这种前后撞词要拦掉
      const a = pick(WN.nounA);
      let b = pick(WN.nounB), g = 0;
      while (a === b && g++ < 20) b = pick(WN.nounB);
      return pick(WN.abstract) + '的' + a + '：' + b + '的当代' + pick(WN.verb);
    }
    if (k === 2) return pick(WN.oldLine) + '，' + pick(WN.oldLine2);
    if (k === 3){
      // 对仗不能撞字（"老树新趣，旧墙新生"两个"新"就露馅了）
      const a1 = pick(WN.b1), a2 = pick(WN.b2);
      let b1 = pick(WN.b1), b2 = pick(WN.b2), guard = 0;
      while ((b1 === a1 || b2 === a2 || /[新老余]/.test(b2) && /[新老余]/.test(a2)) && guard++ < 30){
        b1 = pick(WN.b1); b2 = pick(WN.b2);
      }
      return a1 + a2 + '，' + b1 + b2;
    }
    return Math.random() < 0.5 ? (pick(WN.flatA) + pick(WN.flatB)) : pick(WN.flatSolo);
  }

  // 一学期开始时要把「这个去处用过了」清干净。
  // 只清 PLACES 是不够的：毕业后用的是各条线的 LINE_PLACES，
  // 它们没被清 → 毕业后第二个学期所有去处都还挂着「去过」，行动点还剩着却无处可去（死屏）。
  function allPlaces(){
    const all = PLACES.slice();
    Object.keys(LINE_PLACES).forEach(function(k){ all.push.apply(all, LINE_PLACES[k]); });
    return all;
  }
  function resetPlaces(){ allPlaces().forEach(function(pl){ pl._used = false; }); }
  function resetPlaceCounts(){ allPlaces().forEach(function(pl){ pl._used = false; pl._count = 0; }); }

  function activePlaces(){
    if (S.round >= 5 && S.line && LINE_PLACES[S.line]) return LINE_PLACES[S.line];
    return PLACES;
  }

  const ROUNDS = [
    { name:'大一', school:true },
    { name:'大二', school:true, gate:'crit' },
    { name:'大三', school:true, gate:'detail' },
    { name:'大四', school:true, gate:'sketch2' },
    { name:'大五', school:true, gate:'thesis' },
    { name:'毕业第一年', fork:true },
    { name:'第二年' },
    { name:'第三年' }
  ];


  // ============================================================
  //  排程：v2 的核心界面。一学期给你 2 个行动点，挑 2 个去处。
  //  答题不再是推进器——它是你花时间的方式，主线是时间。
  // ============================================================
  function showSchedule(){
    S._optLocked = false;
    S._lastPick = 0;
    renderTrack(); renderHUD(); clearPrompt();
    const R = ROUNDS[S.round];
    const dbox = el('deco');
    if (dbox) dbox.innerHTML = decoOf();

    const lbl = (S.round >= 5 && S.line && LINES[S.line])
                    ? ('毕 业 · ' + LINES[S.line].name)
                    : (ROUNDS[S.round].name || '');
    let rows = '<div class="yr">' + esc(lbl) + '</div>';
    const places = activePlaces();
    places.forEach(function(pl, i){
      const usedUp = pl.max && pl._count >= pl.max;      // 用过太多次了
      const taken = pl._used;
      const locked = (pl.need && !meetNeed(pl.need)) || usedUp;
      const cls = 'place' + (taken ? ' used' : '') + (locked ? ' locked' : '');
      const cf = usedUp ? '这学期不做了'
                        : (locked ? ('需要 ' + needText(pl.need))
                                  : (Object.keys(pl.eff).length ? delta(pl.eff) : ''));
      const evs = (pl.cards || []).slice(0, 3).map(function(id){ var c = CARDS[id]; return c ? c.name.replace(/\s/g,'') : ''; })
                    .filter(Boolean).join(' · ');
      const nt = (pl.note ? '<b>' + pl.note + '</b>' : '') +
                 (evs ? '<span class="ev">可能遇到：' + esc(evs) + '</span>' : '');
      rows += '<button class="' + cls + '" data-i="' + i + '">' +
                '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                '<span class="nm">' + pl.name + '</span>' +
                '<span class="nt">' + nt + '</span>' +
                '<span class="cf">' + cf + '</span>' +
              '</button>';
    });

    el('stage').innerHTML =
      '<div class="ttl">' + R.name + ' · 这学期的时间花在哪</div>' +
        (S.exhausted ? '<div class="warn" style="margin-top:-4px">（头发见底 · 只做得动一件事）</div>' : '') +
      '<div class="txt">还剩 <b class="hot">' + S.actionsLeft + '</b> 个行动点。' +
        (S.picked.length ? '\n已经选了 ' + S.picked.length + ' 个。' : '') +
        '\n<span class="dim">（每个去处一学期只能去一次）</span></div>' +
      '<div class="places">' + rows + '</div>';

    Array.prototype.forEach.call(el('stage').querySelectorAll('.place'), function(b){
      if (b.classList.contains('locked') || b.classList.contains('used')) return;
      b.onclick = function(){ pickPlace(+b.dataset.i); };
    });
  }

  // 选一个去处：扣行动点、结算产出、抽一件具体的事
  function pickPlace(i){
    if (S.over) return;
    // 连点 / 双击锁：200ms 内同一帧点进来的第三次直接挡掉（评审 M7b）
    const now = Date.now();
    if (now - (S._lastPick || 0) < 200) return;
    S._lastPick = now;
    const pl = activePlaces()[i];
    if (!pl || pl._used || !PROGRESS.canAct()) return;
    pl._used = true;
    pl._count = (pl._count || 0) + 1;
    PROGRESS.spend();
    log('· ' + pl.name);
    apply(pl.eff);
    if (pl.work){
      // 作品不是"点一下就+1"——竞赛可能白做
      if (pl.chance && Math.random() > pl.chance){
        log('　结果出来了：没进。方案是你的，但没人看见。');
        apply({ skill: 1 });          // 失败不白：图是练下来的，回一点技能
        S.memories.push({ tile: pl.name, text: '你做完了那个方案，它没进。但手艺是练下了。' });
      } else {
        const nm = workName();
        S.works.push({ name: nm, from: pl.name, round: S.round });
        S.work = S.works.length;            // 真源：作品 = 作品集条数
        log('　你做完了《<span class="hl">' + nm + '</span>》。');
        S.memories.push({ tile: pl.name, text: '你做完了《' + nm + '》。' });
      }
    }
    // 毕业后（第 6~8 回合）：发你选的那条线的卡。
    // 这是评审 M2——之前选了考研结果还是发通宵/平面，等于毕业白选。
    if (S.round >= 5 && S.line){
      const lc = LINES[S.line].cards.filter(function(x){ return CARDS[x]; });
      if (lc.length){
        const lid = lc[Math.floor(Math.random() * lc.length)];
        S.pendingCard = lid;
        startTile(lid);
        return;
      }
    }
    if (pl.cards && pl.cards.length){
      // 卡片标了能出现的学期（grade）——别让大一遇上构造课
      let pool = pl.cards.filter(function(x){
        return CARDS[x] && (!CARDS[x].grade || CARDS[x].grade.indexOf(S.round) >= 0);
      });
      if (!pool.length){ pool = pl.cards.filter(function(x){ return CARDS[x]; }); }   // 兜底
      // 无放回（全局，修重复题）：整一局所有去处事件本局抽过的卡不再抽，跨处所也不撞，池耗尽才重置
      if (!S._seenG) S._seenG = [];
      let avail = pool.filter(function(x){ return S._seenG.indexOf(x) < 0; });
      if (!avail.length){ avail = pool; S._seenG = []; }
      const id = avail[Math.floor(Math.random() * avail.length)];
      S._seenG.push(id);
      S.pendingCard = id;
      startTile(id);
    } else {
      // 这个去处没有具体的事（比如睡觉），直接回排程
      afterCard();
    }
  }


  function showLiuxueChoice(){
    el('stage').innerHTML =
      '<div class="ttl">回 国 ?</div>' +
      '<div class="txt">你毕业了。签证还有半年。\n同学问你要不要留下。</div>' +
      '<div class="opts" id="opts"></div>';
    showPrompt('回 国 ?', [{t:'回国'}, {t:'留下'}]);
    const box = el('opts');
    var opts2 = [{t:'回国', sub:'home'}, {t:'留下', sub:'abroad'}];
    opts2.forEach(function(o, i){
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                    '<span class="t">' + (i===0 ? '回 国' : '留 下') + '</span>';
      b.onclick = function(){
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){
          x.classList.add(x === b ? 'chosen' : 'faded'); x.disabled = true;
        });
        S.sub = o.sub;
        log('你选择了「' + (o.sub==='home' ? '回国' : '留下') + '」。', 'p');
        S.memories.push({ tile:'留学去向', text: (o.sub==='home' ? '你毕业就回国了。' : '你留了下来。') });
        setTimeout(function(){ ending(); }, 380);
      };
      box.appendChild(b);
    });
  }
  // 一件过完，回排程或进下一回合
  function afterCard(){
    if (PROGRESS.canAct()){ showSchedule(); return; }
    // 学期末关卡：这学期行动点用完了，先过本学期的关（M1）
    const R0 = ROUNDS[S.round];
    if (R0.gate && !S.gateDone[S.round]){
      S.gateDone[S.round] = true;
      callGate(R0.gate);
      return;
    }
    // 留学线末日：所有回合走完、弹「回不回国」，选完才出结局
    if (S.line === 'liuxue' && !S.liuxue_done && S.round >= ROUNDS.length - 1){
      S.liuxue_done = true;
      showLiuxueChoice();
      return;
    }
    // 本回合行动点用完 → 进下一回合；全部走完才结局
    if (S.round >= ROUNDS.length - 1){ ending(); return; }
    PROGRESS.nextRound();
    beginRound();
  }

  // 开始一个回合
  function beginRound(){
    const R = PROGRESS.begin();
    // 头发是资源：掉到 20% 以下，这学期只做得动一件事
    if (S.hair < 20 || S.gateFail){ S.actionsLeft = 1; S.gateFail = false; S.exhausted = true; }
    else { S.exhausted = false; }
    PLACES.forEach(function(pl){ pl._used = false; });
    resetPlaces();       // 毕业后各条线的去处也要清（只清 PLACES 会让毕业后第二学期全处「去过」→ 死屏）
    renderTrack(); renderHUD();
    // 毕业那一回合：先分岔（选一条线），再排程
    if (R.fork && !S.line){
      el('stage').innerHTML =
        '<div class="ttl">毕 业</div>' +
        '<div class="txt">毕业。\n你投了 47 份简历，收到 3 个回复。\n其中两个是同一个岗位。</div>' +
        '<div class="opts" id="opts"></div>';
      showPrompt('毕 业', CARDS.fork.opts);
      const box = el('opts');
      CARDS.fork.opts.forEach(function(o, i){
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                      '<span class="t">' + o.t + '</span>';
        b.onclick = function(){
          Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){
            x.classList.add(x === b ? 'chosen' : 'faded'); x.disabled = true;
          });
          S.line = o.line;
          log('你选择了「' + o.t + '」。', 'p');
          S.memories.push({ tile:'毕业', text:'毕业那年你选了' + o.t + '。' });
          renderSide(); showSchedule();   // 直接同步渲染，停顿交给 CSS 过渡（避免后台标签页被节流）
        };
        box.appendChild(b);
      });
      return;
    }
    showSchedule();
  }

  // ============================================================
  //  M1 关卡检定：每学期末一关。不是选择题，是「拿头发换过关」。
  //  门槛随学期涨：大二8 / 大三12 / 大四16 / 大五20
  //  过关 = 技能(按态度打折) + 做过作品×2 + 一点运气 ≥ 门槛
  //  认真做 pass 概率高但掉 12 发；差不多 5 发；随便交不掉发但基本功不保险。
  //  这正好让「头发是资源」——你用头发买过关。
  // ============================================================
  const GATE_T = { crit:8, detail:12, sketch2:16, thesis:20 };
  function gatePass(mode){
    const coef = (mode==='care' ? 1.5 : mode==='ok' ? 1.0 : 0.7);
    const rnd = Math.floor(Math.random() * 5);
    const req = (GATE_T[S.currentGate] || 12);
    const score = (S.skill * coef) + (S.works.length * 2) + rnd;
    S._gateLog = '技能 ' + S.skill + ' ×' + coef + ' + 作品 ' + S.works.length + ' ×2 + 运气 +' + rnd + ' = ' + score + ' / 门槛 ' + req;
    return score >= req;
  }
  // 显示三个态度（认真/差不多/随便交），点完就判定、结算，然后下一回合
  function showGateAttitude(resultText){
    const c = CARDS[S.currentGate];
    const gateName = c.name;
    el('stage').innerHTML =
      '<div class="ttl">' + gateName + ' · 学期末</div>' +
      '<div class="txt">' + c.text.replace(/\n/g, '<br>') + '</div>' +
      (resultText ? '<div class="warn">结果：' + resultText + '</div>' : '') +
      '<div class="opts" id="opts"></div>';
    showPrompt(gateName + ' · 学期末', [
      {t:'认真做'}, {t:'差不多'}, {t:'随便交'}
    ]);
    const A = [
      { t:'认真做——熬夜把它磨出来', mode:'care', label:'认真做' },
      { t:'差不多就行', mode:'ok',     label:'差不多' },
      { t:'随便交——不想再碰了', mode:'slack', label:'随便交' }
    ];
    const box = el('opts');
    A.forEach(function(o, i){
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                    '<span class="t">' + o.t + '</span>';
      b.onclick = function(){
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){
          x.classList.add(x === b ? 'chosen' : 'faded'); x.disabled = true;
        });
        const pass = gatePass(o.mode);
        log('　判定：' + (S._gateLog || '') + (pass ? ' · 过了' : ' · 不够'), 'gate');
        const cost = (o.mode==='care' ? 12 : o.mode==='ok' ? 5 : 0) + (pass ? 0 : 6);
        S.hair -= cost;
        if (S.hair < 0) S.hair = 0;
        let resLine;
        if (pass){
          S.memories.push({ tile: gateName, text: gateName + '过了。那学期你拿头发换的。' });
          log('「' + gateName + '」过了。', 'p');
          resLine = gateName + '过了。那学期你拿头发换的。';
          // 毕设过 = 唯一确定的作品，从此进作品集
          if (S.currentGate === 'thesis'){
            S.works.push({ name: S.title || '毕业设计', from:'毕设', round:S.round });
            S.work = S.works.length;
            S.memories.push({ tile: gateName, text: '你的毕设《' + (S.title||'') + '》做完了。' });
          }
        } else {
          S.gateFail = true;               // 下回合只做得动一件事
          S.memories.push({ tile: gateName, text: gateName + '没过。那学期白搭了。' });
          log('「' + gateName + '」没过。', 'w');
          resLine = gateName + '没过。那学期白搭了。';
        }
        renderHUD();
        // 关卡是全游戏情绪最高的一屏，以前选完只剩一行判定公式就跳走，
        // 还留着全项目唯一那个 420ms 定时器（后台标签页会被节流）。现在补一屏结果页，点「继续」再走。
        showResult(o.label, resLine, { hair: -cost });
        el('nextBtn').onclick = finishGate;
      };
      box.appendChild(b);
    });
  }
  // 毕设关：先抽题（复用黑话生成器），再让态度决定这关过不过
  function callGate(id){
    S.currentGate = id;
    if (id === 'thesis'){
      el('stage').innerHTML =
        '<div class="ttl">毕 设 · 学期末</div>' +
        '<div class="txt">毕设题目分配会。题目装在两个牛皮纸信封里，逐个念名字。</div>' +
        '<div class="big"><div class="lbl">你 抽 到 了</div>' +
        '<div class="num" id="tTitle" style="font-size:19px;line-height:1.6">…</div></div>' +
        '<div id="tBtn"></div>';
      const t = drawTitle();
      S.title = t;
      el('tTitle').textContent = '《' + t + '》';
      const b = document.createElement('button');
      b.className = 'act'; b.textContent = '接 受 这 个 题';
      b.onclick = function(){
        log('毕设你做《' + t + '》。', 'p');
        showGateAttitude('');
      };
      el('tBtn').appendChild(b);
      return;
    }
    showGateAttitude('');
  }
  // 关卡结束 → 进下一回合 / 结局
  function finishGate(){
    renderSide(); renderHUD();
    if (S.round >= ROUNDS.length - 1){ ending(); return; }
    PROGRESS.nextRound(); beginRound();
  }

  // ============================================================
  //  进度中枢：唯一能改"走到哪了"的地方
  //  v2 模型 = 回合制：一局 8 回合，每回合把 2 个行动点花在"去处"上。
  //  所有调用方只管调这里的函数，不碰内部字段。
  // ============================================================
  const PROGRESS = {
    // 开始一个回合
    begin(){
      const R = ROUNDS[S.round];
      S.actionsLeft = 2;
      S.picked = [];
      S.useAlt = false;
      return R;
    },
    // 花掉一个行动点（选了一个去处）
    spend(){
      if (S.actionsLeft > 0) S.actionsLeft--;
      S.picked.push(1);
      return S.actionsLeft;
    },
    // 本回合还选不选得了
    canAct(){ return S.actionsLeft > 0; },
    // 进下一回合；返回 false 表示全部走完
    nextRound(){
      S.round++;
      if (S.round >= ROUNDS.length) return false;
      return true;
    },
    // 进度文本
    label(){ return (S.round + 1) + ' / ' + ROUNDS.length; }
  };


  function next(){
    afterCard();
  }

  // ========== 结局 ==========
  // ========== 结局状态：从数值算出来，不写死 ==========
  // 以前结局标题只有一个 LINES[line].end（写死的），18 次选择改不动它。
  // 现在 = ① 落点句（走的线决定）+ ② 状态句（数值落点决定）。
  // 五种状态不是"好坏"，是"什么样的人"——守「不排名不比人」。
  const STATE = {
    spent:  '你把自己用完了。活都干得不错。',
    steady: '你按时下班。在这个行业里，这是本事。',
    bear:   '活儿最后都到你手上。你从没说过不行。',
    stuck:  '没做成什么，也没做错什么。',
    mid:    '你还在画。'
  };
  // 判定线按实测定的：一局技能 11~16、作品 3~5、头发 42~56
  function stateOf(s){
    if (s.hair <= 45)                        return 'spent';   // 透支了
    if (s.skill >= 15 && s.hair >= 52)       return 'steady';  // 又强又不累
    if (s.skill >= 15)                       return 'bear';    // 强，但付出了
    if (s.skill <= 12 && s.work <= 3)        return 'stuck';   // 没学也没攒下
    return 'mid';
  }

  function ending(){
    S.over = true;
    applySkin(skinOf(S));          // 界面跟着你这辈子变
    const end = S.line ? LINES[S.line].end : '毕业了';
    const stage = el('stage');
    renderTrack();

    const st = stateOf(S);
    const works = S.works || [];
    // 现场：属于这条毕业线的一小段，落点句正下方
    const line = S.line ? LINES[S.line] : null;
    let sceneText = (line && line.scene) ? line.scene : '';
    if (line && line.id === 'liuxue') sceneText = '';      // 留学现场由去向分岔决定
    if (S.line === 'liuxue' && S.sub === 'home')   sceneText = line.scene_home;
    if (S.line === 'liuxue' && S.sub === 'abroad') sceneText = line.scene_abroad;

    // ── 证据：一句话说清你留下了什么 ────────────────────────
    let claim = '';
    if (works.length >= 2){
      claim = '你留下了两样东西。都不是给谁交的作业。';
    } else if (works.length === 1){
      claim = '你留下了一样东西。它没拿过奖，但它一直在。';
    } else {
      claim = '你没留下什么。你交过的图都在柜子里。';
    }

    // ── 头发：不报数，报它意味着什么 ──────────────────────
    let hairLine;
    if (S.hair <= 15)      hairLine = '头发剩 ' + S.hair + '%。镜子里的那个人已经不太像你了。';
    else if (S.hair <= 45) hairLine = '头发剩 ' + S.hair + '%。这几年，你好几次拿它换过东西。';
    else if (S.hair <= 75) hairLine = '头发剩 ' + S.hair + '%。这个行业里，算多的。';
    else                   hairLine = '头发剩 ' + S.hair + '%。你没怎么拼过。';

    // ── 一件事：从这一辈子里挑一件，只挑一件 ────────────────
    const seenTile = {}, seenHead = {};
    let one = '';
    S.memories.slice().reverse().forEach(function(m){
      const text = m.text || m;
      const tile = m.tile || '_';
      const head = text.slice(0, 3);
      if (!one && !seenTile[tile] && !seenHead[head]){ seenTile[tile] = 1; seenHead[head] = 1; one = text; }
    });
    if (S.title) one = one || ('你的毕设叫《' + S.title + '》。');

    // ── 定论：由数值算出来的那句，放最后 ────────────────────
    const verdict = STATE[st];

    stage.innerHTML =
      '<div class="ending">' +
        '<div class="lab">你 现 在</div>' +
        '<div class="big-t">' + end + '。</div>' +
        (sceneText ? '<div class="scene-txt">' + sceneText.replace(/\n/g, '<br>') + '</div>' : '') +
        '<div class="scene" style="margin-top:4px">' + suScene(Math.max(1, works.length)) + '</div>' +
        '<div class="body">' +
          '<div class="claim">' + claim + '</div>' +
          (works.length
            ? '<div class="wlist">' + works.map(function(w){
                return '<div class="wl">《' + esc(w.name) + '》</div>';
              }).join('') + '</div>'
            : '') +
          '<div class="hair">' + hairLine + '</div>' +
          (one ? '<div class="one">' + one + '</div>' : '') +
        '</div>' +
        '<div class="verdict">' + verdict + '</div>' +
        '<div class="endbar"><button class="act" id="again">再 来 一 局</button></div>' +
      '</div>';

    log('—— 一局结束 ——', 'p');
    el('again').onclick = reset;
  }

  // 十字光标：移动到哪跟到哪
  (function(){
    const ch = el('crosshair');
    const h = ch.querySelector('.h'), v = ch.querySelector('.v'), pk = ch.querySelector('.pick');
    document.addEventListener('mousemove', function(e){
      ch.classList.add('on');
      h.style.top = e.clientY + 'px';
      v.style.left = e.clientX + 'px';
      pk.style.left = e.clientX + 'px';
      pk.style.top = e.clientY + 'px';
      // 底部状态栏跟着显示坐标（Y 轴朝上）。格式按软件来：
      // AutoCAD 是「x, y, z」，Rhino 是「X _ Y _ Z _」
      const co = el('coords');
      if (co){
        const X = (e.clientX * 4.217).toFixed(1);
        const Y = ((window.innerHeight - e.clientY) * 4.217).toFixed(1);
        const isRhino = document.body.className.indexOf('skin-rhino') >= 0;
        co.innerHTML = isRhino
          ? 'X ' + X + '&nbsp;&nbsp;Y ' + Y + '&nbsp;&nbsp;Z 0.0'
          : X + ', ' + Y + ', 0.0';
      }
    });
    document.addEventListener('mouseleave', function(){ ch.classList.remove('on'); });
  })();

  reset();

  // 调试用：?skin=su 直接看某套皮肤（正式入口是结局判定）
  (function(){
    const m = /[?&]skin=(\w+)/.exec(location.search);
    if (m && ['su','sketch','rhino','cad'].indexOf(m[1]) >= 0){
      applySkin(m[1] === 'cad' ? '' : m[1]);
    }
  })();
  // 调试入口：?dev 时把生成器挂出来，方便批量看
  if (location.search.indexOf('dev') >= 0){
    window.workName = workName;
    // 自动试玩（tools/playtest/harvest.js）要读到内部状态：只读快照，不改任何流程
    window.__GAME = {
      S: function(){ return S; },
      cardIds: function(){ return Object.keys(CARDS); },
      card: function(id){ return CARDS[id] || null; },
      lines: function(){ return Object.keys(LINES); },
      lineCards: function(k){ return LINES[k] ? LINES[k].cards : []; },
      roundCount: function(){ return ROUNDS.length; },
      placeIds: function(){ return (activePlaces() || []).map(function(p){ return p.id; }); },
      places: function(){
        return (activePlaces() || []).map(function(p){
          return { id:p.id, name:p.name, eff:p.eff, note:p.note, used:!!p._used,
                   count:p._count || 0, cards:p.cards || [], need:p.need || null };
        });
      }
    };
  }
})();
</script>
