  // ---- 选项（choice / guess / fork / none 共用一套）----
  function renderChoices(c, v){
    el('stage').innerHTML = baseHTML(c, v) + '<div class="opts" id="opts"></div>';
    showPrompt(c.name, v.opts);
    const box = el('opts');
    (v.opts || []).forEach(function(o, i){
      const locked = o.need ? !meetNeed(o.need) : false;
      const b = document.createElement('button');
      b.className = 'opt' + (locked ? ' locked' : (o.need ? ' unlocked' : ''));
      // 2026-09-13 用户裁定（清单第 15 项）：卡内选项一律暗牌--选之前不告诉代价（`hid`），
      // 选完在弹窗里揭晓。排程去处（PLACES）保持明牌；锁定态照旧只显示门槛。
      const cf = locked ? ('需要 ' + needText(o.need))
                        : (o.hid ? HID_PLACEHOLDER : (o.eff ? delta(o.eff) : ''));
      b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                    '<span class="t">' + o.t + '</span>' +
                    (cf ? '<span class="cf' + (o.hid && !locked ? ' hid' : '') + '">' + cf + '</span>' : '');
      if (locked){ box.appendChild(b); return; }     // 看得见，点不了
      b.onclick = function(){
        // 先问「这一次算不算数」，再锁按钮（2026-09-12 修死屏：以前是先锁后判，
        // 被判掉的那次点击会把按钮全部 disable，这一屏就再没有出口了）
        if (!commitChoice(c, o)) return;
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){
          x.classList.add(x === b ? 'chosen' : 'faded');
          x.disabled = true;
        });
      };
      box.appendChild(b);
    });
  }

  const RENDERERS = {
    draw: renderDraw, seat: renderSeat,
    choice: renderChoices, guess: renderChoices, fork: renderChoices, none: renderChoices
  };

  // ========== 主流程 ==========
  // ====== 对话引擎：▶ 点一下/空格推进台词流 → ✦ 决定点(opts) ======
  function startTalk(card, doneFn){
    const list = card.talk || [];
    if (!list.length){ doneFn(); return; }
    S._dlg = { list: list, idx: 0, card: card, done: doneFn };
    bindDlgTap();
    renderTalk();
  }
  let _dlgTapBound = false;
  function bindDlgTap(){
    // 标志必须放在页面级：#stage 跨局都活着，监听器不移除；
    // 以前标志挂在每局重建的 S 上 → 第二局起每点一下推进两句、第四局四句（2026-09-12 修）
    if (_dlgTapBound) return;
    _dlgTapBound = true;
    el('stage').addEventListener('click', function(e){
      if (!S._dlg) return;
      if (e.target && e.target.closest && e.target.closest('.opt,.prompt,.deltas')) return;
      dlgNext();
    });
  }
  function talkBR(s){ return String(s).replace(/\n/g, '<br>'); }
  function renderTalk(){
    const tl = S._dlg;
    const who = (tl.card && (tl.card.dlgName || tl.card.name)) || '';
    const upto = tl.idx;
    const from = Math.max(0, upto - 4);                 // 最多显示最近 5 条
    const show = tl.list.slice(from, upto + 1);
    const grad = [0.28, 0.42, 0.58, 0.78, 1];           // 越旧越淡
    const base = grad.length - show.length;
    const html = show.map(function(s, i){
      const last = (i === show.length - 1);
      const o = last ? 1 : grad[base + i];
      return '<div class="ln' + (last ? ' fresh' : '') + '" style="opacity:' + o + '">' + talkBR(s) + '</div>';
    }).join('');
    el('stage').innerHTML =
      '<div class="ttl">' + esc(who) + '</div>' +
      '<div class="dlg">' + html + '</div>' +
      '<div class="dlgc">' + UI('ending.tapHint', {}, '▸ 空格 / 点一下 继续') + '</div>';
  }
  function dlgNext(){
    if (!S._dlg) return;
    const tl = S._dlg;
    tl.idx++;
    if (tl.idx >= tl.list.length){
      const done = tl.done; S._dlg = null; if (done) done();
    } else { renderTalk(); }
  }

  function startTile(cardId){

    S._optLocked = false;          // 新屏解锁（M7b）
    const id = cardId || S.pendingCard;
    const c = CARDS[id];
    if (!c) { afterCard(); return; }
    if (id === 'l_interview') S._lInterviewSeen = true;   // 本局面过试了：转行线最后一屏不再强塞面试
    renderTrack(); renderHUD();
    clearPrompt();
    const dbox = el('deco');
    if (dbox) dbox.innerHTML = decoOf();
    el('stage').innerHTML = '';
    // alt 分支已删（2026-09-13）：useAlt 全文件恒 false，那三处 alt 是死代码，
    // 里面还藏着被完全支配的选项（评测按 bug 算）--卡面只留一份可见 opts。
    const v = c;
    if (id === 'st_desk1') S._allNight = true;   // 首次通宵：落点 4 那句吐槽靠它
    S._lastCard = c;                             // 链式卡（nextCard）靠它：这张卡演完接下一张
    if (v.talk && v.talk.length){
      if (v.noChoice){        // 纯演出：看完自动结算(v.eff)，没得选
        startTalk(v, function(){
          S._skillSrc = c.name; S._skillPlace = c.scene || '';
          apply(v.eff || {});
          // 纯演出卡也能记一笔状态（同 commitChoice 的 o.set）：k1_title 的起名回响靠它
          if (v.set) Object.keys(v.set).forEach(function(k){ S[k] = v.set[k]; });
          cardDone();
        });
        return;
      }
      startTalk(v, function(){ (RENDERERS[c.form])(c, v); });
      return;
    }
    const renderer = RENDERERS[c.form];
    if (!renderer) throw new Error('未知卡片类型 form: ' + c.form);
    renderer(c, v);
  }


  // 真正执行一个选择（在"决定"的停顿之后）
  // 返回 true = 这次点击真的算数了；false = 被挡掉，界面必须保持可点（否则整屏锁死，无路可走）
  function commitChoice(c, o){
          if (S._optLocked) return false;       // 这一屏已结算过
          S._optLocked = true;
          S._cardName = c.name;
          S._skillSrc = c.name; S._skillPlace = c.scene || ''; apply(o.eff || {});
          if (o.set) Object.keys(o.set).forEach(function(k){ S[k] = o.set[k]; });   // 卡上带的状态标记（如先锋线的署名 _vCredit）
          log('· ' + o.t);
          // 暗牌：选完才揭晓代价--与开场追问同一条弹窗（tipFlashHTML + openingEffToast：
          // 只列动了的项、涨绿扣红、0 值项不显示）。一个数都没动就不弹（没代价可揭晓）；
          // 底部结算屏的 chips 照旧显示，不动。
          if ([o.eff && o.eff.work, o.eff && o.eff.skill, o.eff && o.eff.hair].some(function(v){ return !!v; }))
            tipFlashHTML(openingEffToast(o.eff || {}));
          if (o.r){
            log('　' + o.r);
            S.memories.push({ tile: c.name, text: o.r });
          }
          showResult(o.t, o.r, o.eff || {});
          return true;
  }

  // ========== 结果页：选完先看清发生了什么，再走下一步 ==========
  function showResult(pick, res, eff){
    const chips = [];
    if (eff.skill) chips.push(['技能', eff.skill]);
    if (eff.hair)  chips.push(['头发', eff.hair]);

    let chipHTML = '';
    if (chips.length){
      chipHTML = '<div class="deltas">' + chips.map(function(c){
        const sign = c[1] > 0 ? '+' : '';
        return '<span class="chip ' + (c[1] > 0 ? 'up' : 'dn') + '">' +
               c[0] + ' ' + sign + c[1] + (c[0] === '头发' ? '%' : '') + '</span>';
      }).join('') + '</div>';
    }

    el('stage').innerHTML =
      '<div class="ttl">' + UI('ending.resultTitle', {}, '你 选 了') + '</div>' +
      '<div class="picked">' + esc(pick) + '</div>' +
      (res ? '<div class="res">' + esc(res).split('\n').map(function(l){
               return '<span class="ln">' + l + '</span>';
             }).join('') + '</div>' : '') +
      chipHTML +
      '<div class="big" style="padding-top:2px">' +
        '<button class="act" id="nextBtn">' + UI('ending.cont', {}, '继 续') + '</button>' +
      '</div>';
    el('nextBtn').onclick = next;
  }

  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

  const DIRS = {

  function dirTitle(dir){
    const P = DIR_POOL[dir] || DIR_POOL.urban;
    const r = Math.random();
    const k = r < 0.30 ? 0 : r < 0.55 ? 1 : r < 0.72 ? 2 : r < 0.88 ? 3 : 4;
    if (k === 0) return pick(P.abs) + '--' + pick(P.site) + '的' + pick(P.land);
    if (k === 1){
      const a = pick(P.site);
      let b = pick(P.site), g = 0;
      while (b === a && g++ < 20) b = pick(P.site);
      return pick(P.abs) + '的' + a + '：' + b + '的' + pick(P.land);
    }
    if (k === 2) return pick(P.site) + '，' + pick(P.abs);
    if (k === 3){
      const a1 = pick(P.abs), a2 = pick(P.site);
      let b1 = pick(P.abs), b2 = pick(P.site), guard = 0;
      while ((b1 === a1 || b2 === a2) && guard++ < 30){ b1 = pick(P.abs); b2 = pick(P.site); }
      return a1 + a2 + '，' + b1 + b2;
    }
    return pick(P.site) + '的' + pick(P.land);
  }

        for (let i=0;i<ws.length;i++) for (let j=0;j<ws.length;j++){

        }
        if (!bad) return ws.join('');
      }
      return POOL.map(function(a){ return a[0]; }).join('');
    }

  function workNameOnce(){
    const r = Math.random();
    if (r < 0.30) return pick(WN.abstract) + '--' + pick(WN.era) + pick(WN.site) + pick(WN.verb);
    if (r < 0.36){
      // "地层的地层"这种前后撞词要拦掉
      const a = pick(WN.nounA);
      let b = pick(WN.nounB), g = 0;
      while (a === b && g++ < 20) b = pick(WN.nounB);
      return pick(WN.abstract) + '的' + a + '：' + b + '的当代' + pick(WN.verb);
    }
    if (r < 0.46) return pick(WN.oldLine) + '，' + pick(WN.oldLine2);
    if (r < 0.62){
      // 对仗不能撞字（"老树新趣，旧墙新生"两个"新"就露馅了）
      const a1 = pick(WN.b1), a2 = pick(WN.b2);
      let b1 = pick(WN.b1), b2 = pick(WN.b2), guard = 0;
      while ((b1 === a1 || b2 === a2 || /[新老余]/.test(b2) && /[新老余]/.test(a2)) && guard++ < 30){
        b1 = pick(WN.b1); b2 = pick(WN.b2);
      }
      return a1 + a2 + '，' + b1 + b2;
    }
    if (r < 0.71) return pick(WN.plain);                                   // 大白话直陈
    if (r < 0.78) return pick(WN.doorPlace) + ' ' + pick(WN.doorNo);       // 门牌 / 地名式（不写真实城市与真实建筑名）
    if (r < 0.84) return pick(WN.numName);                                 // 数字 / 版本式
    if (r < 0.89) return pick(WN.askName);                                 // 口语反问式
    if (r < 0.94) return pick(WN.para);                                    // 括号副题式
    return pick(WN.compound);                                              // 单名词
  }
  // 同一局里不出现两件同名作品（抽到重名就重抽；连抽还不合规就落兜底）。
  // 2026-09-13（清单第 26 项）：作品名必须是「交付物」--
  //   用户抓「工地围挡换个色 这个作品名是什么」：格式对（大白话直陈），但**它不是一个作品**。
  //   生成后必须含一个交付物类型词（改造/更新/中心/馆/驿站/广场/住宅/戏台/社区盒子/公园/展厅…），
  //   不含就重抽（与「前后撞词重抽」同做法）。
  const WN_DELIVER = ['改造','更新','翻新','重建','中心','馆','驿站','广场','住宅','戏台','社区盒子','公园','展厅',
                      '楼','房','屋','室','厅','堂','院','棚','仓','坊','亭','廊','桥','站','园','店','塔','榭',
                      '食堂','澡堂','厂房','菜市场','筒子楼','渡口','码头','天桥','宿舍','阳台','楼梯',
                      '檐口','屋面','雨棚','台阶','天井','坡道','过道','砖墙','围墙'];
  function hasDeliverable(n){
    for (let i = 0; i < WN_DELIVER.length; i++) if (n.indexOf(WN_DELIVER[i]) >= 0) return true;
    return false;
  }
  const _wnUsed = [];
  // 标注“已停用”（2026-09-15）：workName() 不再被调用（保留定义以免残留引用报错）
  function workName(){
    for (let i = 0; i < 60; i++){
      const n = workNameOnce();
      if (_wnUsed.indexOf(n) < 0 && hasDeliverable(n)){
        _wnUsed.push(n);
        if (_wnUsed.length > 400) _wnUsed.shift();      // 长局/连抽不涨内存
        return n;
      }
    }
    // 兜底：词库连抽 60 次都不成东西（理论上不会），从一定合规的那一栏里出
    for (let i = 0; i < 60; i++){
      const n = pick(WN.plain);
      if (_wnUsed.indexOf(n) < 0){
        _wnUsed.push(n);
        if (_wnUsed.length > 400) _wnUsed.shift();
        return n;
      }
    }
    return pick(WN.plain);
  }

      { id:'v_ontime', name:'准 点 走',     eff:{hair:3},          note:'六点出门，天还亮着' }
    ]
  };
  // 一学期开始时要把「这个去处用过了」清干净。
  // 只清 PLACES 是不够的：毕业后用的是各条线的 LINE_PLACES，
  // 它们没被清 → 毕业后第二个学期所有去处都还挂着「去过」，行动点还剩着却无处可去（死屏）。
  function allPlaces(){
    const all = PLACES.slice();
    Object.keys(LINE_PLACES).forEach(function(k){ all.push.apply(all, LINE_PLACES[k]); });
    return all;
  }
  function resetPlaces(){ allPlaces().forEach(function(pl){ pl._used = false; pl._term = 0; }); }
  function resetPlaceCounts(){ allPlaces().forEach(function(pl){ pl._used = false; pl._term = 0; pl._count = 0; pl._last = ''; }); }

  // 去处反馈（清单 32/32-2/32-3，2026-09-14）：目前只有 studio 落了 notes 数组。
  // 学年档：大一二(grade 0,1) / 大三四(2,3) / 大五(4)；次数档：来之前的 _count===0 → 初识，≥1 → 熟了。
  // 头发见底（S.hair≤30，与 _hairLow30 同阈值）走 low 那套；{last} 换成上次留下的实物（pl._last）。
  // 只选文案、不动数值：eff / need / max 一概不碰，去处也照旧一直可选。
  function placeFeedback(pl){
    if (!pl.notes || !pl.notes.length) return null;
    const g = (S.round <= 1) ? 0 : (S.round <= 3) ? 2 : 4;
    const again = (pl._count || 0) >= 1;                 // 来之前来过 → 熟了
    // 同学期再来档（2026-09-14 放开一学期一次后补的）：同学期内第 2 次及以后，
    // 优先走 sameTerm 专属文案（指回上一次留下的实物）；没有匹配的学年档才退回 again 档。
    let pool = pl.notes.filter(function(n){
      return n.sameTerm && (n.g || []).indexOf(g) >= 0 && again;
    });
    if (!pool.length) pool = pl.notes.filter(function(n){
      return !n.sameTerm && (n.g || []).indexOf(g) >= 0 && (!!n.again) === again;
    });
    if (!pool.length) pool = pl.notes.filter(function(n){ return (n.g || []).indexOf(g) >= 0; });
    if (!pool.length) pool = pl.notes;                   // 兜底：总能给出一条
    const n = pool[Math.floor(Math.random() * pool.length)];
    const base = (S.hair <= 30 && n.low) ? n.low : n.text;
    return { text: String(base || '').replace(/\{last\}/g, pl._last || '堆旧料'),
             left: n.left || '' };
  }

  function activePlaces(){
    if (S.round >= 5 && S.line && LINE_PLACES[S.line]) return LINE_PLACES[S.line];
    return PLACES;
  }

  const ROUNDS = [
    { name:'大一', school:true },
    { name:'大二', school:true, gate:'crit' },
    { name:'大三', school:true, gate:'detail' },
    { name:'大四', school:true, gate:'sketch2' },
    { name:'大五', school:true, gate:'thesis' },
    { name:'毕业第一年', fork:true },
    { name:'第二年' },
    { name:'第三年' },
    { name:'第四年' }
  ];
  // 分支长短不一样：大学五年固定，毕业后走几年看这条线（转行走得快，体制熬得久）
  const LINE_ROUNDS = { kaoyan:3, liuxue:3, firm:3, client:3, tizhi:4, leave:3, avant:3 };
  const CN_YEAR = ['一','二','三','四'];
  function totalRounds(){ return 5 + (S.line ? (LINE_ROUNDS[S.line] || 3) : 3); }
  function roundName(i){
    if (i < 5) return ROUNDS[i].name;
    const y = i - 4;                       // 6 → 毕业第一年
    return '毕业第' + (CN_YEAR[y - 1] || y) + '年';
  }

  // ============================================================
  //  非设计课副线（2026-09-13）：素描课 / 速写 / 外出写生
  //  它们是「必现卡」：不像去处卡池那样靠抽，落到对应学期一定上，且**不占行动点**
  //  （一学期开学时插一屏，演完照常回排程；actionsLeft 全程不动）。
  //  一学期最多一张、同局同一张不重复。
  //  rounds＝能在哪几个回合（学年）出现；rescue＝头发见底时的回血卡，优先且额外判条件。
  // ============================================================
  const SIDE_HAIR_LOW = 25;                    // 头发见底线：低于它，老师把全班带出去写生
  const SIDE_CARDS = [
    { id:'sk_plaster', rounds:[0,1] },
    { id:'su_book',    rounds:[0,1] },
    { id:'sk_rework',  rounds:[1,2,3] },
    { id:'sk_model',   rounds:[2,3,4] },
    { id:'su_pile',    rounds:[3,4] },
    { id:'hi_oral',    rounds:[1,2] },
    { id:'hi_column',  rounds:[2,3,4] },
    { id:'dj_node',    rounds:[2,3] },
    { id:'sc_outdoor', rounds:[0,1,2,3,4], rescue:true }
  ];
  // 这一学期该上哪张副线卡。peek=true 只查不改（验收探针用）。
  function drawSideCard(peek){
    if (!S || S.over || S.round > 4) return null;            // 毕业以后没有课了
    if (!S._sideSeen) S._sideSeen = [];
    if (!peek && S._sideRound === S.round) return null;       // 一学期只插一屏
    const ok = SIDE_CARDS.filter(function(e){
      if (e.rounds.indexOf(S.round) < 0) return false;        // 不是这个学年的课
      if (S._sideSeen.indexOf(e.id) >= 0) return false;       // 这一局上过了
      if (!CARDS[e.id]) return false;
      if (e.rescue && !(S.hair <= SIDE_HAIR_LOW)) return false;  // 回血卡：头发不低就不上
      return true;
    });
    if (!ok.length) return null;
    const rescue = ok.filter(function(e){ return e.rescue; });
    const use = rescue.length ? rescue : ok;                  // 回血卡优先
    const e = use[Math.floor(Math.random() * use.length)];
    if (!peek){ S._sideSeen.push(e.id); S._sideRound = S.round; }
    return e.id;
  }
  // 学期开头的落脚点：有副线卡就上，没有就进排程。（转场横幅走完调这里）
  function sideOrSchedule(){
    const id = drawSideCard();
    if (id){
      S.pendingCard = id;
      log('-- ' + roundName(S.round) + ' · ' + CARDS[id].name.replace(/\s/g, '') + ' --', 'p');
      startTile(id);
      return;
    }
    showSchedule();
  }


  // ============================================================
  //  排程：v2 的核心界面。一学期给你 2 个行动点，挑 2 个去处。
  //  答题不再是推进器--它是你花时间的方式，主线是时间。
  // ============================================================
  function showSchedule(){
    S._optLocked = false;
    S._lastPick = 0;
    // 副线回血卡（外出写生）可能把头发从「见底」拉回来：这一屏进来前重算一次，
    // 「只做得动一件事」就不该再算数了（只在还没选任何去处时重算，中途不改）。
    if (S.exhaustedBy === 'hair' && S.hair >= 20 && S.actionsLeft === 1 && !(S.picked || []).length){
      S.actionsLeft = 2; S.exhausted = false; S.exhaustedBy = '';
    }
    renderTrack(); renderHUD(); clearPrompt();
    const R = ROUNDS[S.round];
    const dbox = el('deco');
    if (dbox) dbox.innerHTML = decoOf();

    const lbl = (S.round >= 5 && S.line && LINES[S.line])
                    ? ('毕 业 · ' + LINES[S.line].name)
                    : roundName(S.round);
    let rows = '<div class="yr">' + esc(lbl) + '</div>';
    const places = activePlaces();
    places.forEach(function(pl, i){
      const usedUp = pl.max && pl._count >= pl.max;      // 用过太多次了
      const taken = pl._used;
      const locked = (pl.need && !meetNeed(pl.need)) || usedUp;
      // 2026-09-14：一学期内允许重复去，used 不再灰掉，只用于文案（去过几次）
      const cls = 'place' + (locked ? ' locked' : '');
      const cf = usedUp ? UI('schedule.usedUp', {}, '这学期不做了')
                        : (locked ? UI('lock.need', {need: needText(pl.need)}, '需要 ' + needText(pl.need))
                                  : (taken ? UI('schedule.used', {n: (pl._term||1)}, '这学期来过 ' + (pl._term||1) + ' 次')
                                           : (Object.keys(pl.eff).length ? delta(pl.eff) : '')));
      // 2026-09-13 用户：「把可能遇到 隐藏」--不再预告这个去处可能撞上什么卡
      // （与暗牌同一道理：提前说出来就没意思）。只删这行小字，动作本身与数值不变。
      const nt = (pl.note ? '<b>' + pl.note + '</b>' : '');
      rows += '<button class="' + cls + '" data-i="' + i + '">' +
                '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                '<span class="nm">' + pl.name + '</span>' +
                '<span class="nt">' + nt + '</span>' +
                '<span class="cf">' + cf + '</span>' +
              '</button>';
    });

    el('stage').innerHTML =
      '<div class="ttl">' + UI('schedule.title', {round: roundName(S.round)}, roundName(S.round) + ' · 这学期的时间花在哪') + '</div>' +
        (S.exhausted ? '<div class="warn" style="margin-top:-4px">' +
          (S.exhaustedBy === 'fail' ? UI('schedule.afterFail', {}, '（上学期没过。这学期，你只做得动一件事。）')
                                    : UI('schedule.exhausted', {}, '（头发见底。这学期，你只做得动一件事。）')) + '</div>' : '') +
      '<div class="txt">' + UI('schedule.points', {n: S.actionsLeft}, '还剩 ' + S.actionsLeft + ' 个行动点。') +
        (S.picked.length ? '\n' + UI('schedule.picked', {n: S.picked.length}, '已经选了 ' + S.picked.length + ' 个。') : '') +
        '\n<span class="dim">' + UI('schedule.once', {}, '（同一个去处可以再去）') + '</span></div>' +
      '<div class="places">' + rows + '</div>';

    Array.prototype.forEach.call(el('stage').querySelectorAll('.place'), function(b){
      if (b.classList.contains('locked')) return;   // used 不再拦：同一个去处可以再去
      b.onclick = function(){ pickPlace(+b.dataset.i); };
    });
  }

  // 选一个去处：扣行动点、结算产出、抽一件具体的事
  function pickPlace(i){
    if (S.over) return;
    // 连点 / 双击锁：200ms 内同一帧点进来的第三次直接挡掉（评审 M7b）
    const now = Date.now();
    if (now - (S._lastPick || 0) < 200) return;
    S._lastPick = now;
    const pl = activePlaces()[i];
    if (!pl || !PROGRESS.canAct()) return;
    pl._used = true;
    pl._term = (pl._term || 0) + 1;      // 这学期来过几次（每学期清）
    const fb = placeFeedback(pl);          // 先取文案：用「来之前」的 _count 定初识/熟了
    pl._count = (pl._count || 0) + 1;
    PROGRESS.spend();
    termRecord(pl);
    log('· ' + pl.name);
    S._skillSrc = pl.name; S._skillPlace = pl.name; apply(pl.eff);
    if (fb){ log('　' + fb.text); pl._last = fb.left; }   // 这次留下的实物，下次熟了文案指回它
    if (pl.work){
      // 作品不是"点一下就+1"--竞赛可能白做
      if (pl.chance && Math.random() > pl.chance){
        log('　结果出来了：没进。方案是你的，但没人看见。');
        S._skillSrc = pl.name; S._skillPlace = pl.name;
        apply({ skill: 1 });          // 失败不白：图是练下来的，回一点技能
        S.memories.push({ tile: pl.name, text: '你做完了那个方案，它没进。但手艺是练下了。' });
      } else {
        // 作品名已停用（2026-09-15）：只记件数语义，不再生成/存名字。
        S.works.push({ from: pl.name, round: S.round });
        S.work = S.works.length;            // 真源：作品 = 作品集里的件数
        log('　做完了一件，进了<span class="hl">作品集</span>。');
        tipFlash('又一件进了你的作品集。');
        S.memories.push({ tile: pl.name, text: '你在「' + pl.name + '」做完了一件东西。' });
      }
    }
    // ---- 选完去处、进卡面之前：先插一屏「行业背景」轻薄屏（一学期一次）----
    // 走到那个地方，发生的不是事件，是耳边的风声。不占行动点、不进回合计数。
    // 复用结果页的 #nextBtn 契约：自动试玩点它就推进，不会被判卡住。
    const contCard = function(){
    // 毕业后（第 6~8 回合）：发你选的那条线的卡。
    // 这是评审 M2--之前选了考研结果还是发通宵/平面，等于毕业白选。
    if (S.round >= 5 && S.line){
      const lc0 = LINES[S.line].cards.filter(function(x){ return CARDS[x]; });
      // 转行线：最后一年这一屏，如果本局还没面过试，就让它落在面试上--
      // 「转行面试」那篇长文本要在进结局之前出现（l_interview 之后、结局之前）。
      const lc = (S.line === 'leave' && S.round === totalRounds() - 1 && !S._lInterviewSeen &&
                  lc0.indexOf('l_interview') >= 0) ? ['l_interview'] : lc0;
      if (lc.length){
        // 无放回（优先同局没看过的）：每条线只有 3~4 张线内卡，毕业段却要抽 4~8 次，
        // 有放回 = 同一张平均看 2~2.7 遍。改成：先抽本局没出过的线内卡（S._seenL 记），
        // 整条线在本局都出过一轮了，才允许重复--此时把记录清空、重开一轮，
        // 保证任何一回合都抽得出卡（不会因此无卡可出）。
        if (!S._seenL) S._seenL = [];
        let availLine = lc.filter(function(x){ return S._seenL.indexOf(x) < 0; });
        if (!availLine.length){ S._seenL = []; availLine = lc; }   // 一轮出满 → 重置，重开一轮
        const lid = availLine[Math.floor(Math.random() * availLine.length)];
        S._seenL.push(lid);
        S.pendingCard = lid;
        startTile(lid);
        return;
      }
    }
    if (pl.cards && pl.cards.length){
      // 卡片标了能出现的学期（grade）--别让大一遇上构造课
      let pool = pl.cards.filter(function(x){
        return CARDS[x] && (!CARDS[x].grade || CARDS[x].grade.indexOf(S.round) >= 0);
      });
      if (!pool.length){ pool = pl.cards.filter(function(x){ return CARDS[x]; }); }   // 兜底
      // 无放回（全局，修重复题）：整一局所有去处事件本局抽过的卡不再抽，跨处所也不撞，池耗尽才重置
      if (!S._seenG) S._seenG = [];
      let avail = pool.filter(function(x){ return S._seenG.indexOf(x) < 0; });
      if (!avail.length){ avail = pool; S._seenG = []; }
      const id = avail[Math.floor(Math.random() * avail.length)];
      S._seenG.push(id);
      S.pendingCard = id;
      startTile(id);
    } else {
      // 这个去处没有具体的事（比如睡觉），直接回排程
      afterCard();
    }
    };
    const lf = longformHere(pl);           // 三篇长文本：与插播共用挂点，长文本优先
    const afterLong = function(){
      const il = drawInterludes();         // 长文本已把这一回合的插播顶掉（上面抽过并丢掉）→ 必为空
      if (il.length){ showInterlude(il, 0, contCard); return; }
      contCard();
    };
    if (lf){
      // 照样把这一回合的插播抽一次：随机源只消费这一遍，与「没有长文本」时完全一致--
      // 同一 seed 的整局不被长文本改动（抽卡序列照旧），只是这一屏先出长文本。
      // 2026-09-13（内容类二）：固定条「那年 · 行业」是**每幕必有**的，长文本不吞它--
      // 长文本演完把这一回合的固定条补上；被顶掉的是随机条（长文本本来就顶掉它）。
      const il = drawInterludes();
      const fx = il.filter(function(x){ return x.fixed; }).slice(0, 1);   // 只补「上」幕这一条；下幕的屏被长文本占了
      showLongform(lf.title, lf.talk, function(){
        if (fx.length){ showInterlude(fx, 0, contCard); return; }
        contCard();
      });
      return;
    }
    afterLong();
  }


  function showLiuxueChoice(){
    // 按钮文案走文案表（ENDING_TEXT.ui.ending.backTitle/backOpts），表里缺了再用兜底
    const backTitle = UI('ending.backTitle', {}, '回 国 ?');
    const backOpts = (ENDING_TEXT.ui && ENDING_TEXT.ui.ending && ENDING_TEXT.ui.ending.backOpts) || ['回 国', '留 下'];
    el('stage').innerHTML =
      '<div class="ttl">' + esc(backTitle) + '</div>' +
      '<div class="txt">你毕业了。签证还有半年。\n同学问你要不要留下。</div>' +
      '<div class="opts" id="opts"></div>';
    showPrompt(backTitle, [{t:backOpts[0]}, {t:backOpts[1]}]);
    const box = el('opts');
    var opts2 = [{t:backOpts[0] || '回 国', sub:'home'}, {t:backOpts[1] || '留 下', sub:'abroad'}];
    opts2.forEach(function(o, i){
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                    '<span class="t">' + esc(o.t) + '</span>';
      b.onclick = function(){
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){
          x.classList.add(x === b ? 'chosen' : 'faded'); x.disabled = true;
        });
        S.sub = o.sub;
        log('你选择了「' + (o.sub==='home' ? '回国' : '留下') + '」。', 'p');
        S.memories.push({ tile:'留学去向', text: (o.sub==='home' ? '你毕业就回国了。' : '你留了下来。') });
        // 2026-09-13 用户：转场不自动闪走--选完不再 380ms 自动跳结局，
        // 这一屏自己变成「等玩家」：屏上补一个 #nextBtn（机器人认它），
        // 空格 / 回车 / 点一下 / 点「继 续」才进结局屏（与学期转场同一套 waitNext）。
        // 守卫照旧：这一屏可能被连点两次、玩家也可能已经点了「再来一局」--
        // 那时 S.line 已清空，就别再冒出一个结局屏（waitNext 保证只触发一次）。
        const bar = document.createElement('div');
        bar.className = 'big';
        bar.style.marginTop = '26px';
        bar.innerHTML = '<button class="act" id="nextBtn">' + UI('ending.cont', {}, '继 续') + '</button>' +
                        '<div class="lbl" style="margin-top:12px;font-size:12px;color:var(--dim)">' +
                          UI('term.tapHint', {}, '▸ 空格 / 回车 / 点一下 继续') + '</div>';
        el('stage').appendChild(bar);
        waitNext(function(){ if (S.line === 'liuxue' && !S._endShown) ending(); });
      };
      box.appendChild(b);
    });
  }
  // 一件过完，回排程或进下一回合
  function afterCard(){
    // 头发掉到 3 以下＝这天你熬不动了：不是"只做得动一件事"，是这一局到这里就散场
    if (S.hair <= 3 && S.round <= 4 && !S.over){ earlyEnding('xiuxue'); return; }
    if (PROGRESS.canAct()){ showSchedule(); return; }
    // 学期末关卡：这学期行动点用完了，先过本学期的关（M1）
    const R0 = ROUNDS[S.round];
    if (R0.gate && !S.gateDone[S.round]){
      S.gateDone[S.round] = true;
      callGate(R0.gate);
      return;
    }
    // 留学线末日：所有回合走完、弹「回不回国」，选完才出结局
    if (S.line === 'liuxue' && !S.liuxue_done && S.round >= totalRounds() - 1){
      S.liuxue_done = true;
      showLiuxueChoice();
      return;
    }
    // 本回合行动点用完 → 进下一回合；全部走完才结局
    if (S.round >= totalRounds() - 1){
      // 转行线：进结局之前，先出「转行面试」这篇长文本--它是这条线的最后一屏。
      // （l_interview 卡在最后一年必先落到，所以这屏接在它后面；一局最多一次。）
      if (S.line === 'leave' && !S._lfInterview && LONGFORM && LONGFORM.interview &&
          LONGFORM.interview.talk && LONGFORM.interview.talk.length){
        S._lfInterview = true;
        showLongform(LONGFORM.interview.title, LONGFORM.interview.talk, ending);
        return;
      }
      ending(); return;
    }
    PROGRESS.nextRound();
    sealTerm();
    beginRound();
  }

  // 结算「上学期」：把本学期的去处/数值合计封存成 lastTerm，转场屏用它
  function sealTerm(){
    S.lastTerm = { places: (S.termPlaces || []).slice(), eff: S.termEff ? { work:S.termEff.work||0, skill:S.termEff.skill||0, hair:S.termEff.hair||0 } : null };
    S.termPlaces = [];
    S.termEff = { work:0, skill:0, hair:0 };
  }

  // 分岔屏（2026-09-15 碰壁机制版）：七条去向全部可点。门槛不过的条目点了播
  // BUMP_TALK[line].first（3~5 句「没进去」），播完回分岔屏；同一条线第二次点播
  // second（1~2 句；再点同一句回应，不产生新回路）。过线的条目按原流程落
  // S.line → 过渡 → 结局/排程。
  // 保底出口（2026-09-15 兜底）：第 8 条「先找份活干着」无门槛——七条全被卡住时
  // 仍必有一步可走（tools/playtest/assert-no-deadlock.js 断这一条），走向早结局 early·ganhuo。
  // 状态不消耗（碰壁期间不落 S.line、不动 work/skill/hair/skillTags）。
  function renderForkScreen(){
    el('stage').innerHTML =
      '<div class="ttl">毕 业</div>' +
      '<div class="txt">毕业。\n你投了 47 份简历，收到 3 个回复。\n其中两个是同一个岗位。</div>' +
      '<div class="opts" id="opts"></div>';
    const opts = CARDS.fork.opts.concat([{ t:'先找份活干着', line:'' }]);
    showPrompt('毕 业', opts);
    const box = el('opts');
    opts.forEach(function(o, i){
      const isBackstop = (o.line === '') && !CARDS.fork.opts[i];       // 第 8 条：保底
      const ok = isBackstop || !o.need || meetNeed(o.need);            // 门槛过了没（过了才落线，没过也照常能点）
      const bt = BUMP_TALK[o.line];
      const bumped = !isBackstop && !ok && bt && bt.first && bt.first.length;
      const b = document.createElement('button');
      b.className = 'opt' + ((o.need && !bumped) ? ' unlocked' : '');   // 不加 locked：这一版允许碰壁
      b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                    '<span class="t">' + o.t + '</span>' +
                    (o.need && !isBackstop ? '<span class="cf">需要 ' + needText(o.need) + '</span>' : '');
      b.onclick = function(){
        // ---- 碰壁：没过线且备了碰壁文案 → 播「没进去」→ 回分岔屏（不消耗）----
        if (bumped){
          const seen = (S._bumped && S._bumped[o.line]) || 0;
          const talkList = seen >= 1 ? (bt.second && bt.second.length ? bt.second : bt.first) : bt.first;
          if (!S._bumped) S._bumped = {};
          S._bumped[o.line] = seen + 1;
          log('你试着走了「' + o.t + '」，没进去。', 'p');
          startTalk({ name: bt.name || '没进去', talk: talkList.slice() }, function(){
            renderForkScreen();               // 亏没吃、线没落：回到分岔，接着选
          });
          return;
        }
        // ---- 正常过线：落线 → 过渡 → 结局/排程 ----
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){
          x.classList.add(x === b ? 'chosen' : 'faded'); x.disabled = true;
        });
        if (isBackstop){                       // 保底出口：不落七线，直达「先这样」早结局
          S.line = '';
          log('你选了「先找份活干着」。', 'p');
          S.memories.push({ tile:'毕业', text:'毕业那年七条路都没进去，你先找了份活干着。' });
          earlyEnding('ganhuo');
          return;
        }
        S.line = o.line;
        log('你选择了「' + o.t + '」。', 'p');
        S.memories.push({ tile:'毕业', text:'毕业那年你选了' + o.t + '。' });
        // 转行线（2026-09-15）：毕业选「转行」→ 逐句播面试过渡 → 直接进转行画像结局。
        // 其余六线（2026-09-15 批）：LINE_TRANSITION 查表，命中即播该线短过渡（逐句 2~6 句）
        // → 直达该线结局；未命中走毕业后 3 回合（那套代码/卡池全部保留，DLC 用）。
        // 文案走 talk 引擎（与卡牌屏同一套手感：逐句一屏，点击/空格推进）。
        if (o.line === 'leave' && LEAVE_TALK.length){
          renderSide();
          startTalk({ name: '转行面试', talk: LEAVE_TALK.slice() }, function(){ ending(); });
          return;
        }
        const tr = LINE_TRANSITION[o.line];
        if (tr && tr.talk && tr.talk.length){
          renderSide();
          startTalk({ name: tr.name, talk: tr.talk.slice() }, function(){ ending(); });
          return;
        }
        renderSide(); showSchedule();   // 直接同步渲染，停顿交给 CSS 过渡（避免后台标签页被节流）
      };
      box.appendChild(b);
    });
  }

  // 开始一个回合
  function beginRound(){
    S._begun = true;      // 从这一屏起才算「真的开始了」：两个「首次」提示从这里才开始记账
    const R = PROGRESS.begin();
    // 头发是资源：掉到 20% 以下，这学期只做得动一件事
    if (S.hair < 20 || S.gateFail){ S.actionsLeft = 1; S.exhaustedBy = S.hair < 20 ? 'hair' : 'fail'; S.gateFail = false; S.exhausted = true; }
    else { S.exhausted = false; S.exhaustedBy = ''; }
    PLACES.forEach(function(pl){ pl._used = false; pl._term = 0; });
    resetPlaces();       // 毕业后各条线的去处也要清（只清 PLACES 会让毕业后第二学期全处「去过」→ 死屏）
    renderTrack(); renderHUD();
    // 毕业那一回合：先分岔（选一条线），再排程。
    // 碰壁机制（2026-09-15）：门槛不过的条目照样能点——点了播一段「没进去」（BUMP_TALK，
    // 3~5 句；同一条线第二次点播更短的 second），播完回分岔屏，这次不消耗（不落 S.line、
    // 不动数值/技能/作品）。门槛继续显示在按钮上（「需要 X」），只是不再灰掉。
    if (R.fork && !S.line){
      renderForkScreen();
      return;
    }
    // 大一第一件事：抽这学期的课程设计题（茶室设计 / 上海里弄微更新 / 咖啡屋，都是入门题）
    if (S.round === 0 && !S.courseIntroDone){
      S.courseIntroDone = true;
      renderCourseDraw('大一', termStart);
      return;
    }
    // 大二 / 大三 / 大四：这一学年开学第一屏就是抽题。题签定下这一学年的场地与要求，
    // 期末评图按考核点（area）评--题签才算进了关卡（2026-09-13）。
    const Rg = ROUNDS[S.round];
    const gGrade = (Rg && Rg.gate) ? (GATE_GRADE[Rg.gate] || '') : '';
    if (gGrade && !(S.coursePick && S.coursePick[gGrade])){
      renderCourseDraw(gGrade, termStart);
      return;
    }
    termStart();
  }
  // 学期转场：横幅等玩家按「继续」再走（round 0 也走--大一上也是一学期的开始）
  function termStart(){
    S.termCount = (S.termCount == null) ? 0 : S.termCount;
    showTermTransition();
    S.termCount++;
  }

  // ============================================================
  //  M1 关卡检定：每学期末一关。不是选择题，是「拿头发换过关」。
  //  门槛随学期涨：大二8 / 大三12 / 大四16 / 大五20
  //  过关 = 技能(按态度打折) + 做过作品×2 + 一点运气 ≥ 门槛
  //  认真做 pass 概率高但掉 12 发；差不多 5 发；随便交不掉发但基本功不保险。
  //  这正好让「头发是资源」--你用头发买过关。
  // ============================================================
  const GATE_T = { crit:9, detail:14, sketch2:17, thesis:21 };   // B 方案：认真做基本稳过，随便交仍然赌
  const GATE_NEED = { crit:0, detail:0, sketch2:1, thesis:1 };   // 作品硬要求：不够不是判死，是扣分
  function gatePass(mode){
    const coef = (mode==='care' ? 1.5 : mode==='ok' ? 1.0 : 0.7);
    const rnd = Math.floor(Math.random() * 5);
    const req = (GATE_T[S.currentGate] || 15);
    const need = (GATE_NEED[S.currentGate] || 0);
    // 作品是硬通货：不是「有没有都行」。硬要求不够＝这一关直接没得判（不是扣点分糊过去）
    if (S.works.length < need){
      S._gateLog = '作品 ' + S.works.length + ' 件 < 要求 ' + need + ' 件 -- 手上没东西可交';
      return false;
    }
    const tilt = gateTilt();                  // 这题偏什么，±1 的松紧
    const score = (S.skill * coef) + (S.works.length * 3) + rnd + tilt;
    S._gateLog = '设计 ' + S.skill + ' ×' + coef + ' + 作品 ' + S.works.length + ' ×3 + 运气 +' + rnd +
                 (tilt ? ' + 这题 ' + (tilt > 0 ? '+' : '') + tilt : '') +
                 ' = ' + score + ' / 门槛 ' + req;
    return score >= req;
  }
  // 显示三个态度（认真/差不多/随便交），点完就判定、结算，然后下一回合
  function showGateAttitude(resultText){
    const c = CARDS[S.currentGate];
    const gateName = c.name;
    const gw = namedWork(S.title || '');       // 关卡评图屏也点一次名；作品 0 件 → 不出现
    // 这一学年抽到的那道题 → 评图按它的考核点（area）评（2026-09-13）
    const gp = (S.coursePick || {})[roundName(S.round)];
    const lens = (gp && AREA_LENS[gp.area]) ? AREA_LENS[gp.area] : null;
    el('stage').innerHTML =
      '<div class="ttl">' + gateName + ' · 学期末</div>' +
      '<div class="txt">' + c.text.replace(/\n/g, '<br>') +
        // 2026-09-13（清单第 22 项 · M 类）：lens.tail（「这一关紧一点 / 这一关就松一点」）
        //   是设计者旁白，不再上屏；只留老师说的 head 与一句评语 says[0]。
        //   松紧靠数值更狠 + 台词更短更冷来传（tilt 照旧加在判定分上）。
        (lens ? '<br>「《' + gp.name + '》这一题，' + lens.head + '。」<br>' +
                lens.says[0] : '') +
        (gw ? '<br>你作品集里之前做的那件--也讲讲。' : '') + '</div>' +
      (resultText ? '<div class="warn">结果：' + resultText + '</div>' : '') +
      '<div class="opts" id="opts"></div>';
    const GN = (ENDING_TEXT.ui && ENDING_TEXT.ui.gate) || {};
    const gOpts = (GN[S.currentGate] && GN[S.currentGate].length === 3) ? GN[S.currentGate]
                : ((GN.fallback && GN.fallback.length === 3) ? GN.fallback
                   : ['认真做--熬夜把它磨出来', '差不多就行', '随便交--不想再碰了']);
    const gShort = (GN.short && GN.short.length === 3) ? GN.short : ['认真做', '差不多', '随便交'];
    showPrompt(gateName + ' · 学期末', [{t:gShort[0]}, {t:gShort[1]}, {t:gShort[2]}]);
    const A = [
      { t: gOpts[0], mode:'care',  label: gShort[0] },
      { t: gOpts[1], mode:'ok',    label: gShort[1] },
      { t: gOpts[2], mode:'slack', label: gShort[2] }
    ];
    const box = el('opts');
    A.forEach(function(o, i){
      const b = document.createElement('button');
      b.className = 'opt';
      b.dataset.mode = o.mode;          // 自动试玩/回归认这个：文案随便改，机器照样知道哪个是哪个
      b.innerHTML = '<span class="k">' + String.fromCharCode(65+i) + '</span>' +
                    '<span class="t">' + o.t + '</span>';
      b.onclick = function(){
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){
          x.classList.add(x === b ? 'chosen' : 'faded'); x.disabled = true;
        });
        const pass = gatePass(o.mode);
        log('　判定：' + (S._gateLog || '') + (pass ? ' · 过了' : ' · 不够'), 'gate');
        const cost = (o.mode==='care' ? 12 : o.mode==='ok' ? 5 : 0) + (pass ? 0 : 6);
        S.hair -= cost;
        if (S.hair < 0) S.hair = 0;
        let resLine;
        if (pass){
          S.memories.push({ tile: gateName, text: gateName + '过了。那学期你拿头发换的。' });
          log('「' + gateName + '」过了。', 'p');
          resLine = gateName + '过了。那学期你拿头发换的。';
          // 毕设过 = 唯一确定的作品，从此进作品集
          if (S.currentGate === 'thesis'){
            // 作品名已停用（2026-09-15）：毕设同样只记件数。《题名》的提示语不再报书名号。
            S.works.push({ from:'毕设', round:S.round });
            S.work = S.works.length;
            tipFlash('毕设做完，进了你的作品集。');
            S.memories.push({ tile: gateName, text: '你的毕设做完了。' });
          }
        } else {
          S.gateFail = true;               // 下回合只做得动一件事
          S.gateFails = (S.gateFails || 0) + 1;
          // 关卡是可以「死」的：毕设没过＝延毕；连着三关没过＝肄业（分支不一定走完）
          if (S.gateFails >= 3) S._earlyEnd = 'yiye';
          else if (S.currentGate === 'thesis') S._earlyEnd = 'yanbi';
          else if (S.currentGate === 'crit' && S.skill <= 3) S._earlyEnd = 'zhuan';   // 大二评图没过、技能还没入门
          S.memories.push({ tile: gateName, text: gateName + '没过。那学期白搭了。' });
          log('「' + gateName + '」没过。', 'w');
          resLine = S._earlyEnd === 'yanbi' ? (gateName + '没过。这一届，你毕不了业。')
                  : S._earlyEnd === 'yiye' ? (gateName + '没过。这是第三关了。')
                  : (gateName + '没过。那学期白搭了。');
        }
        renderHUD();
        // 关卡是全游戏情绪最高的一屏，以前选完只剩一行判定公式就跳走，
        // 还留着全项目唯一那个 420ms 定时器（后台标签页会被节流）。现在补一屏结果页，点「继续」再走。
        showResult(o.label, resLine, { hair: -cost });
        el('nextBtn').onclick = finishGate;
      };
      box.appendChild(b);
    });
  }
  // 毕设关：先抽题（方向制 + 可重抽，跟抽题屏同一套），再让态度决定这关过不过
  function callGate(id){
    S.currentGate = id;
    if (id === 'thesis'){
      el('stage').innerHTML =
        '<div class="ttl">大五 · 毕设 · 学期末</div>' +
        '<div class="txt">毕设选题那天，老师在群里发了一张在线表格，二十几个题目，一人一行。</div>' +
        '<div class="big"><div class="lbl">你 抽 到 了</div>' +
        '<div class="num" id="tTitle" style="font-size:19px;line-height:1.6">…</div></div>' +
        '<div class="txt" id="tSign" style="margin-top:8px;color:var(--dim2);font-size:13px;line-height:1.8"></div>' +
        '<div id="tBtn"></div>';
      if (S.redraws == null) S.redraws = 0;
      if (!S.titleDir) S.titleDir = DIR_ORDER[Math.floor(Math.random() * DIR_ORDER.length)];
      const dirLabel = (DIRS[S.titleDir] || {}).label || '';
      const draw = function(){
        const t = drawTitle(S.titleDir);
        S.title = t;
        S._lastTitle = t;
        el('tTitle').textContent = UI('draw.dirLabel', { dir: dirLabel, t: t }, dirLabel + ' · 《' + t + '》');
        // 题签两行：从方向自己的 sign 取（跟抽题屏同一版式，题名格式不动，重抽照旧）
        const sd = (DIRS[S.titleDir] || {}).sign || [];
        el('tSign').innerHTML = sd.length === 2 ? ('题签：' + sd[0] + '<br>　　　' + sd[1]) : '';
      };
      draw();
      const b = document.createElement('button');
      b.className = 'act'; b.textContent = UI('ending.acceptThesis', {}, '接 受 这 个 题');
      b.onclick = function(){
        log('毕设你做《' + S.title + '》。', 'p');
        showGateAttitude('');
      };
      const rb = document.createElement('button');
      rb.className = 'act'; rb.style.marginLeft = '12px';
      rb.textContent = UI('draw.redraw', {}, '再 抽 一 次');
      rb.onclick = function(){
        S.redraws++;
        log(UI('draw.redrawLog', {}, '你把纸条放回去，又抽了一张。'));
        draw();
      };
      el('tBtn').appendChild(b);
      el('tBtn').appendChild(rb);
      return;
    }
    // 另外三个学期末关卡（大二评图 / 大三构造课 / 大四一草）：这一学年的题在开学时
    // 就抽过了（beginRound），这里直接按考核点评图。万一没抽过（测试入口直跳），补抽一屏。
    const gG = GATE_GRADE[id] || '大二';
    if (!(S.coursePick && S.coursePick[gG])){ renderCourseDraw(gG, function(){ showGateAttitude(''); }); return; }
    showGateAttitude('');
  }
  // 关卡结束 → 进下一回合 / 结局
  function finishGate(){
    renderSide(); renderHUD();
    if (S._earlyEnd){ const k = S._earlyEnd; S._earlyEnd = null; earlyEnding(k); return; }
    if (S.round >= totalRounds() - 1){ ending(); return; }
    PROGRESS.nextRound(); sealTerm(); beginRound();
  }

  // ============================================================
  //  学期转场：一句话过场 + 学期横幅 + 上学期小结
  //  小结按回合累积（termPlaces/termEff），beginRound 时转为「上学期」再清空。
  //  2026-09-13 用户：「换场页不用这么快闪走，可以空格/点击后继续」--
  //  这一屏从 0.8s 自动推进改成**等玩家**（与长文本/插播/结局屏同一契约）：
  //  空格 / 回车 / 点一下 / 点「继 续」才进排程。机器人推得动：屏上是 #nextBtn。
  //  无障碍（prefers-reduced-motion）照旧整段跳过，直接进排程。
  // ============================================================
  // 等玩家的统一入口（2026-09-13）：空格 / 回车 / 点一下 / 点 #nextBtn 都算「继续」，
  // 只算一次；推完就把三个监听摘掉（不摘会跨屏重复触发）。
  // 机器人契约不变：屏上有 #nextBtn，harvest 的 #nextBtn 那条规则直接推得动。
  function waitNext(fn){
    const stage = el('stage');
    let done = false;
    const fire = function(){
      if (done) return;
      done = true;
      window.removeEventListener('keydown', onKey, true);
      stage.removeEventListener('click', onTap, true);
      fn();
    };
    const onKey = function(e){
      if (e.key !== ' ' && e.key !== 'Enter' && e.key !== 'Spacebar') return;
      e.preventDefault(); fire();
    };
    const onTap = function(e){
      if (e.target && e.target.closest && e.target.closest('.opt,.prompt,.deltas')) return;
      fire();
    };
    const btn = el('nextBtn');
    if (btn) btn.onclick = function(e){ if (e && e.stopPropagation) e.stopPropagation(); fire(); };
    window.addEventListener('keydown', onKey, true);
    stage.addEventListener('click', onTap, true);
  }
  function termRecord(pl){
    if (!S.termPlaces) S.termPlaces = [];
    if (S.termPlaces.indexOf(pl.name) < 0) S.termPlaces.push(pl.name);
    if (!S.termEff) S.termEff = { work:0, skill:0, hair:0 };
    const e = pl.eff || {};
    S.termEff.work  += (e.work  || 0);
    S.termEff.skill += (e.skill || 0);
    S.termEff.hair  += (e.hair  || 0);
  }
  function termSummaryText(){
    const places = (S.termPlaces || []).join(' · ');
    const e = S.termEff || {};
    const parts = [];
    if (e.work)  parts.push('作品 ' + (e.work > 0 ? '+' : '') + e.work);
    if (e.skill) parts.push('设计 ' + (e.skill > 0 ? '+' : '') + e.skill);
    if (e.hair)  parts.push('头发 ' + (e.hair > 0 ? '+' : '') + e.hair);
    if (!places && !parts.length) return UI('term.summaryNone', {}, '上学期：哪儿都没怎么去');
    return UI('term.summary', { places: places || '哪儿都没怎么去', eff: parts.join(' ') || NO_EFF },
              '上学期：' + (places || '') + ' ／ ' + parts.join(' '));
  }
  function termOneLiner(){
    const works = (S.works || []).length;
    const kind = (S.round >= 4) ? 'y5'
               : (S.hair <= 35) ? 'hair'
               : (works >= 4) ? 'works'
               : 'normal';
    const n = (kind === 'works') ? works : 0;
    return UI('term.oneLiner.' + kind, { works: n },
              (ENDING_TEXT.ui.term && ENDING_TEXT.ui.term.oneLiner[kind] && ENDING_TEXT.ui.term.oneLiner[kind][0]) || '');
  }
  // 学期横幅：大字 + 一句话 + 上学期小结，等玩家按「继续」（0.8s 自动那一版已删）。
  function showTermTransition(){
    const R = ROUNDS[S.round];
    if (!R || !R.school){ sideOrSchedule(); return; }
    const reduced = (function(){
      try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
      catch(e){ return false; }
    })();
    if (reduced){ sideOrSchedule(); return; }        // 无障碍：直接进排程，不闪
    const half = (S.termCount != null && S.termCount % 2 === 1) ? '下' : '上';
    const bn = (roundName(S.round) + ' · ' + half);
    const one = termOneLiner();
    // 这一学期抽到的课程设计题：开场就把题名与场地要求摆出来（题签进关卡的第一次露面）
    const gpc = (S.coursePick || {})[roundName(S.round)];
    const courseLine = gpc ? ('这学期做《' + gpc.name + '》　' + ((gpc.sign || [])[0] || '')) : '';
    const sum = S.lastTerm ? termSummaryText() : '';
    el('stage').innerHTML =
      '<div class="ttl">　</div>' +
      '<div class="big" style="margin-top:60px">' +
        '<div class="num" style="font-size:34px;letter-spacing:8px">' + esc(bn) + '</div>' +
        (one ? '<div class="lbl" style="margin-top:14px;font-size:14px;letter-spacing:2px">' + esc(one) + '</div>' : '') +
        (courseLine ? '<div class="lbl" style="margin-top:12px;font-size:13px;color:var(--dim2)">' + esc(courseLine) + '</div>' : '') +
        (sum ? '<div class="lbl" style="margin-top:10px;font-size:13px;color:var(--dim2)">' + esc(sum) + '</div>' : '') +

      '</div>';

    if (sum) log('　' + sum);

    // 副线卡（素描/速写/写生）插在这儿，插完再进排程。
    waitNext(function(){
      if (S.over) return;
      sideOrSchedule();
    });

  //  进度中枢：唯一能改"走到哪了"的地方
  //  v2 模型 = 回合制：一局 8 回合，每回合把 2 个行动点花在"去处"上。
  //  所有调用方只管调这里的函数，不碰内部字段。
  // ============================================================
  const PROGRESS = {
    // 开始一个回合
    begin(){
      const R = ROUNDS[S.round];
      S.actionsLeft = 2;
      S.picked = [];
      return R;
    },
    // 花掉一个行动点（选了一个去处）
    spend(){
      if (S.actionsLeft > 0) S.actionsLeft--;
      S.picked.push(1);
      return S.actionsLeft;
    },
    // 本回合还选不选得了
    canAct(){ return S.actionsLeft > 0; },
    // 进下一回合；返回 false 表示全部走完
    nextRound(){
      S.round++;
      if (S.round >= ROUNDS.length) return false;
      return true;
    },
    // 进度文本
    label(){ return (S.round + 1) + ' / ' + totalRounds(); }
  };

  //  卡演完的统一出口（2026-09-13）：卡上带 nextCard 就按概率接下一张，否则照常回排程。
  //  dm_carry.nextCard={id:'dm_drop', chance:0.45}／construct.nextCard={id:'construct_end'}
  //  --「模型摔了」是随机突发事件：只在走近这条路（回宿舍／专教）的局里按概率撞上，不进固定排程。
  //  ============================================================
  function cardDone(){
    const c = S._lastCard;
    S._lastCard = null;
    if (c && c.nextCard && !S.over){
      const nx = c.nextCard;
      if (Math.random() < (nx.chance == null ? 1 : nx.chance)){
        S.pendingCard = nx.id;
        startTile(nx.id);
        return;
      }
    }
    maybeQuip();
    afterCard();
  }

  function maybeQuip(){
    if (!S || S.over || !S._begun || S._quipDone) return;
    let q = '';
    if (S.hair <= 10)                                      q = '你现在照镜子会先看头顶。';
    else if (S.hair >= 95 && S.round >= 2)                 q = '头发还在。别高兴太早，它掉得比图快。';
    else if ((S.works || []).length === 0 && S.round >= 3) q = '你手上还是空的，楼里已经开始贴简历了。';
    else if (S.skill >= 28)                                q = '你画得比同届利索--名字还是没过别人的嘴。';
    else if (S._allNight)                                  q = '你以后会习惯的。这不是好话。';
    if (!q) return;
    S._quipDone = true;
    tipFlash(q);
  }

  // 毕业意味着技能 ≥18，所以按「你怎么用自己」来分档，而不是按绝对技能高低。
  function stateOf(s){

    if (s.hair <= 20)                  return 'spent';   // 真熬干了

    const valid = {};

    if ((S.works || []).length)          retro.push('你手上那件东西，是很早做的，一直没再换过。');
    else if ((S._sideSeen || []).length) retro.push('你那几本速写本，最后压在出租屋的床底下。');
    const retroText = retro.slice(0, 2).map(function(l){ return '<div class="retro">' + l + '</div>'; }).join('');
    const atlasKey = (pick.kind === 'line')
      ? (pick.key + (pick.key === 'liuxue' && S.sub ? '.' + S.sub : '') + '·' + (pick.mood || ''))
      : ('special·' + pick.key);
    const atlasN = markEnding(atlasKey);

    // ── 证据：一句话说清你留下了什么（按实际件数写，别和同屏的作品列表打架）──
    let claim = '';
    if (works.length >= 2){
      claim = '你留下了 ' + works.length + ' 样东西。都不是给谁交的作业。';
    } else if (works.length === 1){
      claim = '你留下了一样东西。它没拿过奖。';
    } else {
      claim = '你没留下什么。你交过的图都在柜子里。';
    }
    // 作品名已停用（2026-09-15）：不再念出名字，claim 句子本身已按件数写全。

    // ── 头发：不报数，报它意味着什么 ──────────────────────
    let hairLine;
    if (S.hair <= 15)      hairLine = '头发剩 ' + S.hair + '%。镜子里的那个人已经不太像你了。';
    else if (S.hair <= 45) hairLine = '头发剩 ' + S.hair + '%。这几年，你好几次拿它换过东西。';
    else if (S.hair <= 75) hairLine = '头发剩 ' + S.hair + '%。这个行业里，算多的。';
    else                   hairLine = '头发剩 ' + S.hair + '%。这几年，你没拿它换过什么。';

    // ── 一件事：从这一辈子里挑一件，只挑一件 ────────────────
    const seenTile = {}, seenHead = {};
    let one = '';
    S.memories.slice().reverse().forEach(function(m){
      const text = m.text || m;
      const tile = m.tile || '_';
      const head = text.slice(0, 3);
      if (!one && !seenTile[tile] && !seenHead[head]){ seenTile[tile] = 1; seenHead[head] = 1; one = text; }
    });
    if (S.title){
      const echo = (ENDING_TEXT.ui && ENDING_TEXT.ui.echoDir && ENDING_TEXT.ui.echoDir[S.titleDir]) || null;
      const echoLine = echo ? UI('echoDir.' + (S.titleDir || 'urban'), { t: S.title }, echo) : ('你的毕设叫《' + S.title + '》。');
      one = one || echoLine;
    }
    // 重抽 ≥3 次的次数棗：单独一句，永远不挤掉「一件事」那句
    let redrawLine = '';
    if ((S.redraws || 0) >= 3){
      redrawLine = UI('redraw', { n: S.redraws }, '你抽了 ' + S.redraws + ' 次。');
    }

    // ── 署名回响（先锋工作室）：你的名字在不在那张图上 ────────
    // 由 v_credit 那张卡的选项写进 S._vCredit（'small' / 'none'），别的线不设，就不会多这一行。
    const creditLine = (S._vCredit && ENDING_TEXT.ui && ENDING_TEXT.ui.credit)
      ? (ENDING_TEXT.ui.credit[S._vCredit] || '') : '';

    // ── 起名回响（竞赛 · 起名字，k1_title）────────────────────
    // 那张卡以前零机制：笑完就没了。现在它记一个 flag（S._k1Title），
    // 在结局里回一句--你当年给那件东西起的名字，后来没人念过。
    const titleEcho = (S._k1Title && ENDING_TEXT.ui && ENDING_TEXT.ui.titleEcho)
      ? (ENDING_TEXT.ui.titleEcho || '') : '';

    // ── 定论：由数值算出来的那句，放最后 ────────────────────
    const verdict = (word && word.verdict) ? word.verdict : STATE[st];

    stage.innerHTML =
      '<div class="ending">' +
        '<div class="lab">' + UI('ending.lab', {}, '你 现 在') + '</div>' +
        '<div class="big-t">' + end + '。</div>' +

            : '') +
          '<div class="hair">' + hairLine + '</div>' +
          (one ? '<div class="one">' + one + '</div>' : '') +
          (redrawLine ? '<div class="one" style="margin-top:6px">' + redrawLine + '</div>' : '') +
          (creditLine ? '<div class="one" style="margin-top:6px">' + creditLine + '</div>' : '') +
          (titleEcho ? '<div class="one" style="margin-top:6px">' + titleEcho + '</div>' : '') +
        '</div>' +
        '<div class="verdict">' + verdict + '</div>' +
        (pick.badges && pick.badges.length
          ? '<div class="badges">' + pick.badges.map(function(b){
              return '<span class="badge" data-spec="' + esc(b.key) + '" role="button" tabindex="0">' + esc(b.label) + '</span>';
            }).join('') + '</div>' +
            '<div class="badge-hint">' + UI('ending.badgeTap', {}, '▸ 点徽章看说明') + '</div>' +
            '<div class="badge-notes">' + pick.badges.map(function(b){
              const sp = (ENDING_TEXT.special || {})[b.key] || {};
              return '<div class="badge-note" data-note="' + esc(b.key) + '">' +
                     '<div class="bn-t">' + esc(sp.title || b.label) + '</div>' +
                     '<div class="bn-b">' + esc(String(sp.body || '').replace(/\n/g, ' ')) + '</div>' +
                     '<div class="bn-v">' + esc(sp.verdict || '') + '</div>' +
                     '</div>';

        (atlasN ? '<div class="atlas">图鉴 ' + galCount() + ' / ' + ENDING_TOTAL + ' 个结局</div>' : '') +

      '</div>';

    log('-- 一局结束 --', 'p');
    el('again').onclick = reset;


    // 徽章点开：展开同一 key 的那段说明（一次只开一个，再点收起）
    (function(){
      const chips = document.querySelectorAll('.ending .badge');
      for (let i = 0; i < chips.length; i++){

          for (let j = 0; j < notes.length; j++){
            if (notes[j].getAttribute('data-note') === k){
              if (!notes[j].classList.contains('on')) target = notes[j];
              notes[j].classList.remove('on');
            }
          }
          if (target) target.classList.add('on');
        };
      }

  // 十字光标：移动到哪跟到哪
  (function(){
    const ch = el('crosshair');
    const h = ch.querySelector('.h'), v = ch.querySelector('.v'), pk = ch.querySelector('.pick');
    document.addEventListener('mousemove', function(e){
      ch.classList.add('on');
      // fixed 定位的坐标会被 html{zoom:1.25} 再乘一次 → 十字光标会偏右下。
      // 与飘字同一套做法：先除掉 computed zoom 还原（移动端 zoom=1，天然对齐）。
      const z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
      h.style.top = (e.clientY / z) + 'px';
      v.style.left = (e.clientX / z) + 'px';
      pk.style.left = (e.clientX / z) + 'px';
      pk.style.top = (e.clientY / z) + 'px';
      // 底部状态栏跟着显示坐标（Y 轴朝上）。格式按软件来：
      // AutoCAD 是「x, y, z」，Rhino 是「X _ Y _ Z _」
      const co = el('coords');
      if (co){
        const X = (e.clientX * 4.217).toFixed(1);
        const Y = ((window.innerHeight - e.clientY) * 4.217).toFixed(1);
        const isRhino = document.body.className.indexOf('skin-rhino') >= 0;
        co.innerHTML = isRhino
          ? 'X ' + X + '&nbsp;&nbsp;Y ' + Y + '&nbsp;&nbsp;Z 0.0'
          : X + ', ' + Y + ', 0.0';
      }
    });
    document.addEventListener('mouseleave', function(){ ch.classList.remove('on'); });
  })();

  // ========== 结局图鉴 ==========

  const MOOD_ORDER = [

  const GAL_LINES = [
    ['kaoyan', '考 研',        null],
    ['liuxue', '留 学 · 回 国', 'home'],
    ['liuxue', '留 学 · 留 下', 'abroad'],
    ['firm',   '设 计 院',     null],

  const GAL_EARLY = [

    ['yiye',   '肄业',   '连着三关没过'],
    ['xiuxue', '休学',   '在校期间就把头发熬到底'],
    ['zhuan',  '换专业', '大二评图没过'],
    ['ganhuo', '先这样', '毕业分岔七条线都没进去，选了「先找份活干着」']
  ];
  // 徽章（原"特殊结局"）：降级成结局页并列展示的标记，不再占图鉴格。
  // 为什么不占格：一局只能有一个结局标题，谁占了格、其余同条件的分支就永远轮不到 = 死格。
  const GAL_BADGES = [
    ['bald',  '头发到底了',     '结局时头发 = 0'],
    ['empty', '手上只剩一两件', '结局时作品 ≤ 2 件（毕设那件之外几乎没攒下东西）'],
    ['all',   '三样都齐',       '设计 ≥ 20 且作品 ≥ 4 且头发 ≥ 60（少见）']
  ];
  function galSlots(){
    const out = [];
    GAL_LINES.forEach(function(L){
      const key = L[2] ? (L[0] + '.' + L[2]) : L[0];
      const T = L[2] ? (((ENDING_TEXT.lines || {})[L[0]] || {})[L[2]] || {})
                     : (((ENDING_TEXT.lines || {})[L[0]]) || {});
      MOOD_ORDER.forEach(function(M){
        const w = T[M[0]] || null;
        out.push({ key: key + '·' + M[0], sec: L[1], mood: M[1],
                   title: (w && w.title) ? String(w.title).replace(/[。．.]+$/, '') : '',
                   verdict: (w && w.verdict) || '', hint: M[2] });
      });
    });
    GAL_EARLY.forEach(function(E){
      const w = ((ENDING_TEXT.early || {})[E[0]]) || {};
      out.push({ key: 'early·' + E[0], sec: '早 结 局', mood: E[1],
                 title: String(w.title || '').replace(/[。．.]+$/, ''), verdict: w.verdict || '', hint: E[2] });
    });

    // 三个彩蛋各占一格（清单第 19 项）：标题取各自的真标题，格子里就是它自己那段正文，
    // 不再用「第 1/2/3 种」区分，也不让三格长得一样。未解锁的仍旧只给条件（不剧透）。
    EGG.forEach(function(e, i){
      out.push({ key: 'egg·' + (i + 1), sec: '结 局 1 · 彩 蛋', mood: '',
                 title: String(eggTitleOf(i)).replace(/[。．.]+$/, ''),
                 verdict: String(e).replace(/\n/g, '<br>'),
                 hint: '报志愿那一屏，点「不 报 建 筑」' });
    });
    return out;
  }
  function galCount(){
    const seen = seenEndings();
    return galSlots().filter(function(r){ return seen.indexOf(r.key) >= 0; }).length;
  }
  function updateGalBtn(){
    const b = el('galBtn');
    if (b) b.innerHTML = '图鉴 <b>' + galCount() + '</b> / ' + ENDING_TOTAL;
  }
  function showGallery(){
    if (el('galwrap')) return;
    const store = loadStore();
    const seen = store.keys;
    const HIST = store.hist || {};
    const rows = galSlots();
    let html = '<div class="galwrap" id="galwrap"><div class="galbox">' +
      '<div class="galhead"><div class="galt">结 局 画 廊</div>' +
      '<div class="galn">你已经走过 <b>' + galCount() + '</b> / ' + ENDING_TOTAL + '</div></div>' +
      '<div class="galnote">存在这台机器上（换浏览器／清缓存会清空）。没解锁的只给条件，不剧透。</div>';
    let sec = '';
    rows.forEach(function(r){
      if (r.sec !== sec){ sec = r.sec; html += '<div class="gsec">' + sec + '</div>'; }
      const got = seen.indexOf(r.key) >= 0;
      const ann = got ? annFor(r.key, HIST[r.key]) : '';
      html += '<div class="grow' + (got ? ' got' : '') + '">' +
                '<span class="gm">' + r.mood + '</span>' +
                '<span class="gt">' + (got && r.title ? r.title + '。' : '· · · · · · ·') + '</span>' +
                '<span class="gd">' + (got ? (r.verdict || '') : r.hint) + '</span>' +
                (ann ? '<span class="gn">' + ann + '</span>' : '') +
              '</div>';
    });
    html += '<div class="gsec">徽 章（不 计 入 收 集）</div>';
    GAL_BADGES.forEach(function(B){
      html += '<div class="grow badge-row">' +
                '<span class="gm">徽 章</span>' +
                '<span class="gt">' + B[1] + '</span>' +
                '<span class="gd">' + B[2] + '</span>' +
              '</div>';
    });
    html += '<div class="galfoot"><button class="act" id="galclose">关 闭</button>' +
            '<button class="act" id="galclear" style="margin-left:12px;background:none;color:var(--dim2);border:1px solid var(--dim2);">清 空 记 录</button></div></div></div>';
    const wrap = document.createElement('div');
    wrap.innerHTML = html;
    const node = wrap.firstChild;
    document.body.appendChild(node);
    node.onclick = function(e){ if (e.target === node) node.remove(); };   // 点外面也能关

  // ============================================================
  //  调试跳转（2026-09-15）：给开发/审阅用，正式玩家看不见（不加任何按钮/UI）。
  //  用法（控制台或 URL 都行）：
  //    jumpTo('intern')                  直达任意一张卡（按 id，CARDS 里的都行）
  //    jumpTo('fork')                    直达毕业分岔屏
  //    jumpTo('ending')                  直达结局屏（按当前/默认状态）
  //    jumpTo('ending', {line:'firm'})   结局屏 + 预设毕业线（firm/kaoyan/liuxue/…）
  //    jumpTo('k3_case', null, {round:6})带状态：第三参摆好数值再渲染（round/skillTags/work/hair 都收）
  //    dist.html?jump=k3_case            URL 参数版（便于截图 / 分享）
  //  只动 S 的这几个字段，不碰卡的文案/数值/门槛，不污染正常流程。
  //  ============================================================
  window.jumpTo = function(target, opt, state){
    opt = opt || {};
    if (state){                                    // 跳哪都像「刚玩到这」：数值先摆在门口
      if (state.round != null) S.round = Math.min(Math.max(state.round, 0), ROUNDS.length - 1);
      if (state.hair != null)  S.hair = state.hair;
      if (state.skill != null) S.skill = state.skill;
      if (state.work != null)  S.work = state.work;
      if (state.skillTags)     S.skillTags = Object.assign({}, S.skillTags, state.skillTags);
    }
    S._optLocked = false;
    if (target === 'fork'){
      S.line = null; S.over = false;
      S.round = (state && state.round != null) ? Math.min(Math.max(state.round, 0), ROUNDS.length - 1) : (ROUNDS.length - 1);
      beginRound();
      return 'fork';
    }
    if (target === 'ending'){
      if (opt.line) S.line = opt.line;
      if (opt.sub)  S.sub = opt.sub;                 // 留学分回国/留下
      S.over = false;
      ending();
      return 'ending';
    }
    if (!CARDS[target]){ console.warn('[jumpTo] 没有这张卡: ' + target); return null; }
    S.over = false;
    S.pendingCard = target;
    startTile(target);
    return target;
  };
  (function(){                                       // URL 参数：?jump=k3_case&jump_state={...}
    const m = /[?&]jump=([\w]+)/.exec(location.search);
    if (!m) return;
    let opt = null, state = null;
    const so = /[?&]jump_line=(\w+)/.exec(location.search);
    if (so) opt = { line: so[1] };
    const ss = /[?&]jump_state=([^&]+)/.exec(location.search);
    if (ss){ try { state = JSON.parse(decodeURIComponent(ss[1])); } catch(e){ state = null; } }
    // 等第一屏起完再跳（开场要先落 reset/school，覆盖它）
    setTimeout(function(){ jumpTo(m[1], opt, state); }, 50);
  })();
  // 调试入口：?dev 时挂出状态快照（workName 生成器已停用，不再挂出）
  if (location.search.indexOf('dev') >= 0){
    // window.workName 已随作品名退场移除（2026-09-15）
    // 自动试玩（tools/playtest/harvest.js）要读到内部状态：只读快照，不改任何流程
    window.__GAME = {
      S: function(){ return S; },
      cardIds: function(){ return Object.keys(CARDS); },
      card: function(id){ return CARDS[id] || null; },
      ruleTagOfSkill: ruleTagOfSkill,             // 自检用：不含三级兜底的规则表，数兜底率
      tagOfSkill: tagOfSkill,
      lines: function(){ return Object.keys(LINES); },
      lineCards: function(k){ return LINES[k] ? LINES[k].cards : []; },
      roundCount: function(){ return ROUNDS.length; },
      lineRounds: function(){ return LINE_ROUNDS; },
      // 测试用：直接跳到第 N 回合（0 基）并（可选）锁定毕业线，便于验"毕设抽题"这类只在大五出现的屏
      devJump: function(round, line){
        S.round = round;
        if (line) S.line = line;
        if (S.hair < 30) S.hair = 60;
        if ((S.works || []).length < 2) S.works = [{ from: '测试', round: 0 }, { from: '测试', round: 1 }];
        S.work = (S.works || []).length;      // 件数真源同步（2026-09-15 作品名退场）
        S.over = false;
        beginRound();
        return { round: S.round, line: S.line, works: S.works.length };
      },
      openingAsk: showOpeningAsk,                 // 测试用：直接跳到大一上的开场追问屏
      liuxueChoice: showLiuxueChoice,             // 测试用：直接跳到留学「回不回国」那一屏（验「等玩家」用）
      openingGuide: showOpeningGuide,             // 测试用：直接跳到开局指引屏（三样东西）
      triNote: toggleTriNote,                     // 测试用：展开某一项的说明（work / skill / hair）
      // 行业插播（测试用）：抽这一学期的插播 / 直接渲染某一条（验 openingHook 那行用）
      interDraw: function(){ return drawInterludes().map(function(x){ return x.term + ' · ' + x.e.trigger; }); },
      interShow: function(term, trigger){
        const pool = INTER_POOLS[term] || [];
        for (let i = 0; i < pool.length; i++){
          if (pool[i].trigger === trigger){ showInterlude([{ term: term, e: pool[i] }], 0, function(){}); return term + ' · ' + trigger; }
        }
        return null;
      },
      interPools: function(){ return INTER_POOLS; },
      setOpenWhy: function(k){ S.openWhy = k; return S.openWhy; },
      // 非设计课副线（测试用）：这一学期该上哪张（peek，不改状态）/ 设头发 / 重走学期开头
      sidePick: function(){ return drawSideCard(true); },
      sideList: function(){ return SIDE_CARDS.map(function(e){ return { id:e.id, rounds:e.rounds, rescue:!!e.rescue }; }); },
      setHair: function(v){ S.hair = v; renderHUD(); return S.hair; },
      // 两个「首次」提示专项（测试用）：走真实的 apply()，验 flag 与浮层只出现一次
      applyEff: function(eff){ apply(eff); return { work:S.work, skill:S.skill, hair:S.hair,
        tipHairDown:!!S._tipHairDown, tipWorkFirst:!!S._tipWorkFirst }; },
      // 作品点名/交作品 专项探针（测试用）：直接渲染某张卡 / 某个关卡评图屏 / 结算屏
      showCard: function(id){ if (!CARDS[id]) return null; S.pendingCard = id; S._optLocked = false; startTile(id); return id; },
      showGate: function(id){ if (!CARDS[id]) return null; S.currentGate = id; showGateAttitude(''); return id; },
      showEnding: function(){ ending(); return true; },
      devBegin: function(){
        beginRound();
        return { round:S.round, hair:S.hair, skill:S.skill, actionsLeft:S.actionsLeft,
                 exhausted:!!S.exhausted, exhaustedBy:S.exhaustedBy || '' };
      },
            totalRounds: function(){ return totalRounds(); },
      placeIds: function(){ return (activePlaces() || []).map(function(p){ return p.id; }); },
      places: function(){
        return (activePlaces() || []).map(function(p){
          return { id:p.id, name:p.name, eff:p.eff, note:p.note, used:!!p._used,
                   count:p._count || 0, cards:p.cards || [], need:p.need || null };
        });
      }
    };
  }
})();
</script>
